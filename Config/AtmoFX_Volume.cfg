; AtmoFX fork of D3D9Client: Jupiter's cloud layers, ray-marched (read once per Orbiter start)
; Altitudes in km above the reference radius (Jupiter Size 69911 km); the 1 bar level is taken at ~440 km.
Enabled = 1
Planet = none         ; Jupiter (its 3D clouds off for now, 2026-10-20 - to be redone later; was: Jupiter). Io plume below stays on
MaxCamAlt = 20000    ; pass active below this camera altitude [km]

HazeBase = 470       ; photochemical haze, 0.3-0.03 bar, ~30 km scale height
HazeTop = 560
HazeExt = 0.0015     ; extinction at its base [1/km] (more = brighter limb glow)
NH3Base = 445        ; ammonia ice deck, 0.9-0.4 bar: the visible clouds (thick and high in zones)
NH3Top = 475
NH3Dens = 1.0
NH4SHBase = 390      ; ammonium hydrosulfide deck, ~2 bar: brown, seen through the belts
NH4SHTop = 415
NH4SHDens = 0.8
H2OBase = 330        ; water clouds, 4-7 bar: sparse towers, lightning
H2OTop = 370
H2ODens = 0.7
DeepAlt = 300        ; below: dark murk only

GlobalMix = 1.0      ; share of the real Jupiter map (belts, zones, the Great Red Spot) in colour and coverage
GlobalFlip = 0       ; 1 if the near clouds show the map mirrored against the distant stock layer
Lightning = 0        ; flashes in storm cells of the water clouds (off: they read as white flicker; 1 = on)
MapKm = 1700         ; flow map tile [km]: mid-scale swirls and streaks on top of the real map
NoiseKm = 120        ; cloud cell noise tile [km]: texture under the real map (structure > 100 km comes from the map)
DetailKm = 40        ; edge detail noise tile [km] (smaller = finer grain, more shimmer)
NearFadeKm = 12       ; clouds fade in over this distance from the camera (0 = right at the lens)
MaxDist = 2000       ; march range [km]; the stock layer shows beyond
Exposure = 1.25

; Quality: auto (default: starts at 72 steps, 1/2 resolution, then picks the resolution that keeps the pass
; within BudgetMs of GPU time per frame), low (48 steps, 1/3), medium (72, 1/2), high (96, full).
; Steps = 16..128 and Downscale = 1..4 after the Quality line override the preset.
Quality = auto       ; auto | low | medium | high. auto keeps the pass within BudgetMs (3 ms keeps 144 Hz vsync on an RTX 4050 Laptop)
BudgetMs = 3

; === Io: the Prometheus plume (same pass, technique "Plume") ===
PlumeBody = Io
PlumeOn = 1
PlumeLng = -155.8     ; vent, east longitude [deg] (155.8 W): the active western flow front, ~70 km west of the IoLava cone
PlumeLat = -1.6       ; vent latitude [deg]
PlumeH = 75           ; canopy height [km] (Galileo PIA00703: 75 km); the frost ring falls at 2H = 150 km
PlumeExt = 0.0032     ; peak extinction in the canopy shell [1/km] (vertical optical depth ~0.03 with a 7 km shell)
PlumeShell = 7        ; canopy shell half-width [km] (thin = glassy bubble, thicker = loose umbrella)
PlumeColTop = 70      ; column over the vent: 3 km wide at the vent, 14 km at this height [km]
PlumeBright = 1.2     ; brightness of the scattered sunlight
PlumeMaxCamAlt = 6000 ; drawn while the camera is lower than this over Io [km]
