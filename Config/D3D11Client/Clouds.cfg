; D3D11Client volumetric clouds (src\Clouds.cpp, shaders\clouds.hlsl)
; Layer = <body> <deck|cumulus> <base m> <top m> <cover 0..1> <extinction 1/m> <feature size m> <wind m/s> <wind azimuth deg from N>
; Steps = <march steps per pixel> (half resolution)
;
; Titan, after Cassini/Huygens:
;  - a stratiform methane cloud, quasi-permanent, liquid methane-nitrogen drops up to ~15 km, drizzling to the surface
;    (Tokano et al. 2006, from the Huygens GCMS humidity); thin: vertical optical depth ~0.3 here. The surface itself is
;    at ~50 % humidity (DISR, Tomasko et al. 2005): no ground fog.
;  - convective methane cumulus: tops usually 14-25 km, parts up to ~42 km; VIMS: clouds at 5-25 km; patchy, a small
;    fraction of the disc; optical depths exponentially distributed (strong storms rare). Summer hemisphere's high
;    latitudes - our site (59 N) in June 2017, the northern solstice.
;  - (the north polar ethane hood, 51-68 N at 30-50 km, was a winter cloud, gone after the 2009 equinox: not here)
;  - tropospheric winds of ~1 m/s (Huygens DWE: weak below 10 km).
Layer = Titan deck    8000  15000 0.35 1.5e-4 40000 1.0 90
Layer = Titan cumulus 10000 18000 0.05 1.0e-3 12000 2.0 90
Steps = 64
