; D3D11Client: moving cyclones (src\Cyclone.cpp, shaders\cyclone.hlsl) - their clouds from afar (the 2D layer, over
; Orbiter's own) and near (the volumetric clouds, EarthClouds), their rain.
; Cyclone = <body> <extratropical|tropical> <lat deg> <lng deg> <MJD0: when the centre is there> <speed m/s>
;           <heading deg from N> <radius km> <stage 0 wave .. 1 occluded> <stage per day> <max wind m/s> <r of max wind km>
;
; Extratropical (mid-latitudes): 1000-3000 km across, 3-7 days, moving 8-17 m/s east to north-east (the steering flow);
;   the cold front a narrow line of Cb trailing south-south-west, the warm front's shield (Ns -> As -> Cs) up to ~1000 km
;   poleward-ahead, the comma head round the low, the dry slot behind the cold front.
; Tropical: 300-1000 km, an eye of 20-60 km, the eyewall's Cb to 15-17 km, spiral rain bands, 4-7 m/s.
;
; The test storm: a mature low east of Florida, its cold front over the Kennedy Space Center at MJD 51982.67
; (the scenario "Tests\Cyclone_KSC"), moving north-east at 12 m/s.
