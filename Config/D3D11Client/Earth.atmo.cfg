; D3D11Client FX atmosphere: Earth (src\FxAtmo.cpp; units: 1/m, m; channels R G B = 680 550 440 nm)
; Values: Bruneton 2017 "Precomputed Atmospheric Scattering: a New Implementation" (the reference Earth), also used by
;   Hillaire 2020 - Rayleigh from the US Standard Atmosphere 1976 number density, ozone from its mean profile.
Top             = 100000
RayleighScatter = 5.802e-6 13.558e-6 33.1e-6     ; air, sea level
RayleighH       = 8000
MieExt          = 4.44e-6 4.44e-6 4.44e-6        ; continental aerosol: scattering 3.996e-6, absorption 0.444e-6
MieSSA          = 0.9 0.9 0.9
MieG            = 0.8 0.8 0.8
MieH            = 1200
AbsorbExt       = 0.650e-6 1.881e-6 0.085e-6     ; ozone (Chappuis band) at its peak
AbsorbCentre    = 25000                          ; tent profile 10-40 km
AbsorbHalfWidth = 15000
GroundAlbedo    = 0.1 0.1 0.1                    ; global mean (oceans), Bruneton
