; D3D11Client engine/heat/particle effects (src\Exhaust.cpp, src\GpuParticles.cpp): 1 = on, 0 = off
Glow       = 0     ; heat nodes glowing: off - as in D3D9 the AtmoFX heat nodes drive the shimmer only; a module shows its own glow (oapiSetMaterialEx Emission: the jet pack chambers) - the user, 2026-10-19
Plumes     = 1     ; ray-marched exhaust plumes of AtmoFX jets
Particles  = 1     ; GPU ejecta, spray, mist, splashes, AtmoFX_Emit particles
Shimmer    = 1     ; heat shimmer (refraction) in air
Kabs       = 20    ; heavy (hydrocarbon) exhaust's visible absorption [m2/kg]
H2Flame    = 1     ; hydrogen jets (the jet pack) by their chemistry: the blue continuum ~ [OH]^2 of the mix with the air;
                   ; 0: the jet pack's textured volume as in the D3D9 fork
Humidity   = 0.6   ; Earth's relative humidity for the condensation trail
Smoke      = 1     ; the engines' condensate/smoke as a 3D flow (GPU solver round the focus); 0: as particles
SmokeCell  = 0.2   ; its cell [m] (128 x 64 x 128 cells: 25.6 x 12.8 x 25.6 m)
SmokeConfine = 0.4 ; vorticity confinement (keeps the thin eddies)
SmokeIters = 30    ; pressure iterations
Emissivity = 0.8   ; hot metal
Steps      = 40    ; plume ray-march steps
; test runs only (D3D11CLIENT_TEST=1): jets / hot nodes on the focus vessel, vessel frame
; TestJet = x y z  dx dy dz  thrust[N] ve[m/s] Texit[K] rExit[m] ground wet
; TestHeat = x y z  r[m] dT[K]
