; D3D11Client engine/heat/particle effects (src\Exhaust.cpp, src\GpuParticles.cpp): 1 = on, 0 = off
Glow       = 1     ; hot metal round AtmoFX heat nodes: blackbody emission
Plumes     = 1     ; ray-marched exhaust plumes of AtmoFX jets
Particles  = 1     ; GPU ejecta, spray, mist, splashes, AtmoFX_Emit particles
Shimmer    = 1     ; heat shimmer (refraction) in air
Kabs       = 20    ; heavy (hydrocarbon) exhaust's visible absorption [m2/kg]
KabsH2     = 0.002 ; hydrogen exhaust: H2 has no visible transitions (only IR collision-induced absorption) and on Titan
                   ; nothing burns it - the jet is invisible; seen are the hot nozzle (Glow) and the air trembling (Shimmer)
Emissivity = 0.8   ; hot metal
Steps      = 40    ; plume ray-march steps
; test runs only (D3D11CLIENT_TEST=1): jets / hot nodes on the focus vessel, vessel frame
; TestJet = x y z  dx dy dz  thrust[N] ve[m/s] Texit[K] rExit[m] ground wet
; TestHeat = x y z  r[m] dT[K]
