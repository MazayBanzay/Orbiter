; D3D11Client FX atmosphere: Mars (src\FxAtmo.cpp; units: 1/m, m; channels R G B ~ 610 550 465 nm)
; Gas: CO2, 610 Pa / 210 K at the datum -> 2.1e23 /m3 (0.0083 of Earth's sea level); CO2's Rayleigh cross-section
;   ~2.45x air's (refractivity and King factor) -> 0.020 x Earth's Rayleigh. Scale height ~11.1 km.
; Dust (the colour of the sky): typical clear-season visible optical depth 0.5 (MER Pancam, Lemmon et al. 2015: 0.3-1.0),
;   well mixed, scale height ~11 km -> extinction 0.5 / 11 km. Single-scattering albedo in the visible ~0.70-0.95,
;   lowest in the blue (Wolff et al. 2009, CRISM; Maattanen et al. 2009); HG asymmetry 0.63 near-IR (Ockert-Bell et al.
;   1997), the slightly stronger forward peak towards the blue gives the blue sunset (estimate per channel).
