; D3D11Client: Earth's storm - one tropical cyclone, volumetric (src\Storm.cpp, shaders\storm.hlsl). Read once per session.
; The structure follows observed hurricanes (NOAA P-3 radar and dropsonde work, Houze 2010 "Clouds in tropical cyclones"):
; an eye 20-60 km across, the eyewall's towers to the tropopause (~15-16 km) leaning outwards ("stadium"), spiral rain
; bands pitched ~15-20 degrees, a cirrus canopy (the central dense overcast) ~500 km across with anticyclonic outflow
; streaks, and outer cumulus fields. Northern hemisphere: it turns counter-clockwise.
Enabled       = 1
Body          = Earth
Lat           = 26.5      ; the centre [deg N] at MJD0 (east of the Bahamas: the outer bands reach Florida and KSC)
Lon           = -76.0     ; [deg E]
MJD0          = 0         ; 0: at the session's start
Speed         = 5         ; the storm's drift [m/s] (typical 4-7)
Heading       = 305       ; towards [deg from north]: west-north-west
EyeKm         = 20        ; the eye's radius
EyewallKm     = 24        ; the eyewall's width
CanopyKm      = 200       ; the cirrus canopy's radius
OuterKm       = 900       ; the outermost cloud
Base          = 550       ; the cloud base [m]
Top           = 15500     ; the highest tops (the eyewall) [m]
CanopyBase    = 10500     ; the cirrus canopy [m]
CanopyTop     = 15200
ExtConvective = 0.025     ; extinction in the convective cores [1/m] (visibility inside ~120 m)
ExtStratiform = 0.008     ; in the stratiform rain clouds
ExtCanopy     = 0.0018    ; in the cirrus canopy (optical depth ~5-8)
BandTurnHours = 9         ; the band pattern turns once in this time
Steps         = 64        ; march steps (24..192)
DetailKm      = 70        ; the 3D cells fade out by this distance (farther: the map's 2D cover)
Shadows       = 1         ; the clouds' shadows on the ground and the vessels
Physics       = 1         ; turbulence for the vessels flying through the cloud
Gust          = 1.0       ; its strength (1: as measured in hurricanes; 0 off)
Debug         = 0         ; 1 the opacity, 3 the Sun's shadow alone
