; D3D11Client: the atmosphere of Titan as the client draws it (linear colours).
; Colours: Config\GC\Titan.atm.cfg (AtmoFX_SkyHorizon 0.95 0.71 0.42, AtmoFX_SkyZenith 0.80 0.60 0.36,
;   AtmoFX_GroundLight 0.96 0.66 0.35 - tuned in the D3D9 client's gamma space, linearised here).
; Haze: Huygens DISR / Cassini - extinction ~0.075/km at 560 nm near the surface (visibility ~52 km), uniform in the
;   lowest ~20-55 km, spectral 0.8/1/1.3 (R/G/B) from the vertical optical depths 3.0/4.0/5.5 at 650/560/480 nm.
; Sun: ~90 % of the light at the surface comes from the sky (DISR); the direct beam is weak and red.
SkyHorizon  = 0.89 0.46 0.15
SkyZenith   = 0.60 0.32 0.11
Ambient     = 0.91 0.39 0.10
Sun         = 0.30 0.17 0.065
HazeExt     = 7.5e-5
HazeRGB     = 0.8 1.0 1.3
ScaleHeight = 40000
Top         = 700000
; The haze shell seen from space (D3D11Client effects, FxAtmo.cpp): Huygens DISR (Tomasko 2008, as in Config\GC\Titan.atm.cfg):
;   haze scale height ~60 km, single-scattering albedo 0.9/0.75/0.5 at 650/560/480 nm, HG asymmetry 0.6.
HazeH       = 60000
HazeSSA     = 0.9 0.75 0.5
HazeG       = 0.6
