; D3D11Client FX atmosphere: Venus (src\FxAtmo.cpp; units: 1/m, m; channels R G B ~ 610 550 465 nm)
; Gas: CO2, 9.2 MPa / 737 K at the surface -> 9.05e26 /m3 (35.5x Earth's sea level) x CO2's Rayleigh cross-section
;   (~2.55x air) -> 90x Earth's Rayleigh. Density profile from VIRA (Seiff et al. 1985): 60 km 236 kPa / 263 K,
;   70 km 36.9 kPa / 230 K -> mean density scale height 22.9 km from the surface to 60 km, 5.7 km above.
; Clouds: H2SO4 droplets, 48-70 km, total visible optical depth ~25-30 (Pioneer Venus, Venera); cloud top (tau 1) ~70 km
;   with an aerosol scale height ~4-5 km above (Venus Express). Single-scattering albedo from the fit to Venus's spherical
;   albedo (Hansen & Hovenier 1974 models: 0.9974 at 491 nm, 0.9994 at 623 nm, lower towards the UV absorber):
;   interpolated to 465/550/610 nm. Asymmetry of the 1 um droplets ~0.72 (Hansen & Hovenier 1974).
Top             = 120000
RayleighScatter = 5.22e-4 1.22e-3 2.98e-3
RayleighH       = 22900
RayleighBreak   = 60000
RayleighH2      = 5700
MieExt          = 1.4e-3 1.4e-3 1.4e-3           ; tau 30 over the 48-65 km layer and its tail
MieSSA          = 0.9993 0.9983 0.9950
MieG            = 0.72 0.72 0.72
MieH            = 4500
MieLayer        = 48000 65000
GroundAlbedo    = 0.10 0.10 0.10                 ; basalt (estimate)
