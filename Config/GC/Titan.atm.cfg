; AtmoFX fork: particles (dust, exhaust smoke) take Orbiter's random wind (up to 25 m/s) scaled by this: Titan surface wind < 1 m/s (Huygens)
AtmoFX_ParticleWind = 0.03
; AtmoFX fork: the view from under the seas (LiquidVolume): level [m from the mean radius], extinction [1/m], scattered colour, index
AtmoFX_LiquidLevel = -617.25
AtmoFX_LiquidExt = 0.3       ; dark clear liquid: the bottom shows only in the first metres (no optical measurement; seas are the darkest surfaces in Cassini ISS/VIMS)
AtmoFX_LiquidColor = 0.40 0.30 0.14
AtmoFX_LiquidIndex = 1.29
; AtmoFX fork: headlight beams: scattering of the air near the surface [1/m] = haze (0.068/km, the TitanFX model) + N2 Rayleigh at 5.4 kg/m3
AtmoFX_BeamScatter = 1.2e-4
