; = Shader(s) = [Earth, Mars, Moon, Giant, Auto]
Shader = Mars
Planet = Titan
ConfigName = Custom
; AtmoFX: physical haze from Huygens DISR (Tomasko 2008): vertical extinction 3.0/4.0/5.5 at 650/560/480 nm,
; single-scattering albedo 0.9/0.75/0.5 (flat scattering MPwr 0 + tholin absorption below), haze H 60 km, g 0.6;
; N2 Rayleigh tau(480) ~1.5, H 20.6 km. Stock copy: Titan.atm.cfg.stock
; The stock model is single-scattering: with the full optical depths the surface sky goes black. Effective depths
;   (RayO 0.8, MieO 1.6: about 1/4-1/5 of the measured) stand in for the multiple scattering; spectra and absorption kept.
;   Checked numerically: surface zenith ~(0.61 0.46 0.27), horizon orange-brown, direct sun ~16% red.
; Used only with TileFormat 2 in Config/Titan.cfg (the legacy tile engine never reads this file).
AtmoFX_MieAbs = 0.041 0.247 0.557
; lakes: mask alpha 0 = liquid hydrocarbons, Mars shader + water variant; no ocean-blue tint (WTrsn 0)
AtmoFX_Water = 1
; reflected sky for the liquid: the haze sky the viewer sees (from in-game shots: away from the Sun ~(0.45 0.20 0.05) on screen,
;   towards it ~2x brighter); pre-HDR linear units, w of SkyHorizon = sun-side boost
AtmoFX_SkyHorizon = 0.95 0.71 0.42 1.0
AtmoFX_SkyZenith = 0.80 0.60 0.36
; ground and vessel light under the haze (Huygens: ~90% from the sky, faint shadows, tan hue): diffuse sky rgb, direct-sun scale
; liquid: smooth (no ground micro texture), faint animated ripples (WNrml 0.35: radar waves < ~1 cm),
;   see-through shallows from mask G (depth gain; 0 = off until the depth channel exists), bottom albedo
AtmoFX_Liquid = 1 0 0.35
; liquid level / extinction / colour / index: one set for both views, at the end of this file (with the LiquidVolume block)
AtmoFX_GroundLight = 0.96 0.66 0.35 1.0
AtmoFX_WaterDebug = 0   ; 1 = debug view (paints ALL terrain: R mask, G sun glint, B reflected sky)
; WNrml: the shader scales the ripple normal z by 1/WNrml, so SMALLER = flatter. 0.08: near mirror (Cassini radar: seas smooth to ~mm).
OrbitAlt = 600000
AtmoVisualAlt = 700000   ; AtmoFX: shell above the haze, so its edge is not seen through the TitanFX volume
Red = 0.65
Blue = 0.48
SunI = 1                 ; AtmoFX: was 10 - the client caps sunlight at 1, so 10 undid the haze dimming (Earth-like hard light); 1 keeps it dim and red
zcolor = 1 0.7 0.15
hcolor = 1 0.5 0.1
acolor = 0.9 0.9 1
