; OrbiterCrew - the stock Delta Glider for the crew: its nose airlock in the crew's menu (F, the wheel, Alt).
; Its own module is not changed: the keys are given to it as if pressed, its animations are read back.
LABEL носовой шлюз | nose airlock
NODE 0 -0.49 10.40    ; the airlock's outer opening at the nose (ship frame, m)
REACH 3.2             ; from her eyes (the nose stands high over the ground)
OPEN K 17 O 11        ; to open: K the nose cone (animation 17), O the outer door (animation 11)
CLOSE O 11 K 17       ; to close
IN 11 17              ; in and out when both are open
EXIT 0 0 12.5         ; where she steps out: on the ground before the nose
