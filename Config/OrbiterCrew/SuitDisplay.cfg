; OrbiterCrew - the suit computer's display, the user's settings (kept across all scenarios)
LOOK 1        ; 0 holo, 1 photonics, 2 electroluminescent
PALETTE 0     ; holo colours: 0 cyan+orange, 1 orange+cyan, 2 white+orange
BRIGHT_AUTO 0
BRIGHT 0.7
MAP_MONO 0
RESOLUTION 1  ; 1 = 1:1 with the screen, 2 = 2x smoothed
HORIZON 0     ; pitch ladder: 0 auto (flight, space), 1 always, 2 off
SYNTH 0       ; terrain contours on the ground (the AtmoFX D3D9 client)
SUN_FILTER 0  ; the visor's sun filter (D3D11): 0 grey, 1 H-alpha
HUD_THEME 3   ; the light suit's display: 0 laser, 1 projector, 2 augmented reality, 3 high contrast
HIDE_LADDER 1   ; the pitch ladder hidden
HUD_MIN 1   ; the light suit's HUD down to its top arc
MFD_SIDE 0   ; the MFDs on the helmet's glass: 0 in front, 1 at the sides
SHADE 2   ; the visor's shading behind the light suit's display, 0 .. 2
