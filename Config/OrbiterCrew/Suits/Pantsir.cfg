; OrbiterCrew suit class 2 "Pantsir": radiation and heat protection - Io, Jupiter's belts, hot zones (HEAVY_SUIT.md)
; the protection costs power: the field's level against the battery; the heat against the pump's COP and the supply.
; The limit floats: the field is shed first over the supply, the coils heat the equipment, the evaporator buys time.
Title = Pantsir
Mass = 130           ; kg: the shell with its shield 85, life support and battery 45 - carried by the drives
ShieldGcm2 = 4.0     ; g/cm2 polyethylene
BremsFactor = 0.35   ; tantalum liner: the bremsstrahlung the field cannot turn away
FieldW = 2000        ; W at full level
FieldFactor = 61     ; 1 + 60 at full level (31 at half)
FieldHeat = 0.08     ; of the field draw left in the equipment as heat
FieldSteps = 1       ; 25 / 50 / 75 / 100 %
Battery = 20.0       ; kWh
SupplyW = 2500       ; W
LiftKg = 350         ; kg anyone in it lifts and carries, drives on (stronger motors, 2.5 kW supply)
LifeW = 80
Conductance = 0.8    ; W/K in vacuum: multilayer insulation and ceramics
HeatMaxW = 600
CoolMaxW = 1500
Cop = 3              ; at +27 C
CopMin = 0.5
CopHotK = 753        ; +480 C: the radiator can no longer run hotter than the surroundings
EvapWater = 6.0      ; kg boiled off when the pump cannot keep up
EvapMaxW = 1000
TMinC = -200
TMaxC = 430
PMaxOutKPa = 600     ; the hard shell
O2 = 2.0             ; kg
Sorbent = 3.2        ; kg CO2
Water = 3.0          ; kg drink
EquipC = 16000       ; J/K: more equipment, slower to heat
WalkFactor = 0.6     ; a heavy suit walks slower: 130 kg on the drives, a deliberate cadence
StepPitch = 0.75     ; its footfall lower and heavier
EquipG = 16          ; W/K to the cooling loop: a larger cold plate
LocksUpright = 1     ; the ring drives brake when she stops acting or the power fails: the shell stays standing
DamageC = 500        ; the materials' onset: the insulation's spacers and bonds, then the joint seals; nominal 430
ColdC = -220        ; cold: the joint seals (experimental elastomers) turn glassy and crack
SealDepth = 0.6     ; the seals under the shield and the insulation
ShellArea = 3.4     ; m2 outer surface
ShellEps = 0.5      ; its emissivity (mirror and borazon plates, enamel)
ContactC = 1200     ; the boots' outer shell on a brief contact (borazon, refractory mirror)
LegSoakS = 1200     ; s: the seals under 30 mm of insulation follow the outer shell this slowly
ArmOutDeg = 26      ; the stance its mesh is built for: the sleeves sit on arms 32 deg out (the clip hangs ~6)
LegOutDeg = 6       ; the legs ~6 deg out: the inner thigh plates meet without crossing
Computer = Pantsir       ; the suit's own computer and model (Pantsir: radiative leak, heat damage, faults)
