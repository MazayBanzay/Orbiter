; =====================================================================================================
; Тантра: силовая установка (ионно-триггерные моторы) — пороги, риск, отказы.
; Читается кораблём при запуске сценария. Строки "ключ = значение"; ';' — комментарий
; (кроме строк ru/en — там весь текст до конца строки). Правьте числа и тексты как угодно.
; Модель и обоснование: Tantra_Design/tantra_plant.html, tantra_plant_screen.html, DESIGN_LOCAL.md.
; =====================================================================================================

[reaction]
chi = 0.00001            ; доля энергии реакции в проникающее излучение: «чистый» ионно-триггерный каскад (0,001 %)

[risk]
; вероятность отказа узла за минуту при превышении e (доля сверх нормы):  risk0 * (exp(risk_k * e) - 1)
; +20 % -> 0,06 %/мин; +50 % -> 0,65 %/мин; +90 % -> 11 %/мин; +120 % -> 89 %/мин
; превышение обмотки: (B/12,1 Тл)^2 - 1 плюс её нагрев сверх 23 К; мощности: сверх того, что держит поле;
; кормы: (T - t_safe) / t_safe
risk0 = 0.0002
risk_k = 7

[stern]
t_safe = 800             ; К: выше — обмотка теплеет, растёт риск по корме
t_boil = 1100            ; К: рабочая масса кипит в рубашке — отвод тепла падает
t_soft = 1400            ; К: композит кормы размягчается
t_breach = 1700          ; К: рубашка чаши прорвана — плазма на чашу, нагрев разгоняется
t_lost = 2300            ; К: корма прогорела — корабль потерян
stern_store = 1.0e12     ; Дж: теплоёмкость кормы от 300 до 1700 К (~1 кт конструкции)
limiter_hot = 250        ; К сверх t_safe, при которых ограничитель уже снял всю мощность
quench_cool = 20         ; с: охлаждение обмотки после срыва поля

[heat]
leak = 0.0045            ; прорыв плазмы через поле: мощность струи * leak * (превышение)^2
reflect_argon = 0.002    ; отражение струи от грунта на корму (у стартового стола), доля мощности струи
reflect_iron = 0.004
reflect_products = 0.01
air_iron = 0.002         ; слой смешения быстрой струи с воздухом (у земли) светит на корпус
air_products = 0.003

; ---------------------------------------------------------------------------------------------------
; Отказы. Каждый блок [failure] — один отказ.
;   cause  = field (обмотка: поле, нагрев) | power (мощность сверх поля, поджиг) | heat (температура кормы)
;   weight = вес среди отказов той же причины
;   effect = quench (срыв поля) | coils (обмотка, доля тяги) | coil_cap (предел обмотки) | dip (провал тяги, с)
;            | drivers (триггер, доля мощности) | jacket (рубашка, доля охлаждения) | radiators (гребни) | cryo
;   value  = что остаётся от узла (0,7 = −30 %) или секунды для dip
;   heat   = К, добавленные корме сразу;  quench = 1 — поле тоже срывается
;   ru/en  = сообщение
; ---------------------------------------------------------------------------------------------------
[failure]
cause = field
weight = 5
effect = quench
quench = 1
ru = Срыв поля (потеря сверхпроводимости) — тяга ноль, охлаждение обмотки
en = Field quench - no thrust while the windings cool

[failure]
cause = field
weight = 3
effect = coils
value = 0.7
quench = 1
ru = Сгорела секция обмотки — тяга −30 % до станции
en = A winding section burnt - thrust -30 % until a station

[failure]
cause = field
weight = 1
effect = coil_cap
value = 0.5
quench = 1
ru = Лопнула опора обмотки — поле не выше 12 Тл до станции
en = A winding support cracked - the field is capped until a station

[failure]
cause = power
weight = 4
effect = dip
value = 1.5
ru = Серия пропусков поджига — провал тяги
en = A series of trigger misfires - the thrust dips

[failure]
cause = power
weight = 3
effect = drivers
value = 0.75
ru = Сгорел модуль ионного триггера — мощность −25 % до станции
en = An ion trigger module burnt - power -25 % until a station

[failure]
cause = power
weight = 2
effect = jacket
value = 0.7
heat = 120
ru = Плазма прорвала поле и ударила в чашу — охлаждение −30 %
en = Plasma broke through the field into the cup - cooling -30 %

[failure]
cause = heat
weight = 3
effect = radiators
value = 0.8
ru = Покоробилась панель гребня — сброс тепла −20 %
en = A crest panel warped - heat rejection -20 %

[failure]
cause = heat
weight = 3
effect = jacket
value = 0.7
heat = 80
ru = Лопнул канал рубашки — охлаждение −30 %
en = A jacket channel burst - cooling -30 %

[failure]
cause = heat
weight = 2
effect = cryo
value = 0.6
ru = Отказ линии криогеники — обмотка теплеет
en = A cryo line failed - the windings warm up

[failure]
cause = heat
weight = 1
effect = quench
quench = 1
ru = Срыв поля от нагрева обмотки
en = Field quench - the windings overheated
