; AtmoFX fork: Titan's haze and methane clouds (TitanVolume.cpp, Modules\D3D9Client\TitanFX_Volume.fx). Re-read each session.
; Haze: Huygens DISR, vertical optical depth ~3-5 in the visible: diving in, outlines and contrast are lost.
; Clouds (Cassini): northern summer 2016-2017 - long E-W streaks at 45-55 N, drifting 7-10 m/s, living hours;
; rare convective storms (2010 equatorial "arrow", ~1200-1500 km). Global cloud fraction is small (~0.2-0.6 %).
Enabled = 1
Body = Titan
Quality = auto        ; low / medium / high / auto
BudgetMs = 3
Clouds = summer2016   ; summer2016 / storm / none (keys below override the preset)
; storm preset: centre of the cluster (east longitude) and radius
StormLat = 57.5
StormLon = 41.0
; haze: k(h) = KLow exp(-h/HLow) + KUp exp(-h/HUp) [1/km]
HazeKLow = 0.025
HazeHLow = 60
HazeKUp = 0.043       ; upper haze: same column (~1.95) as 0.03 x 65 km, sharper limb (Cassini: limb falls off within ~1 scale height)
HazeHUp = 45
HazeLight = 1.00 0.78 0.48
HazeAbs = 0.20 0.45 0.85
HazeBright = 1.0
HazeRedCap = 0.25      ; below ~80 km the sky light stops reddening (Huygens DISR: surface sky tan, R/G ~1.34, G/B ~1.67); 0 = off
HazeLowBright = 1.5     ; below ~80 km: sky brightness (Huygens: sky ~1.25x the ground, also away from the Sun)
HazeLowForward = 0.12   ; below ~80 km: forward-scatter share (multiple scattering flattens the glow around the Sun)
Ground = -0.617       ; northern sea level [km]
MaxCamAlt = 2000000   ; drawn below this camera altitude [km]: the volumetric haze also makes the disk and limb from orbit
; --- AtmoFX fork: near haze and fog ---
; Near haze is drawn in depth-tested slices up to NearKm, so hills and hulls get only the haze in front of them.
NearKm = 80
Slices = 12
; Fog at the summer pole over evaporating methane (Cassini VIMS, Brown et al. 2009, ApJ 706 L110):
; optical depth ~0.25, scattering near 0.75 km, tops above 3 km excluded; it came and went between observations.
; Patch size and life are not measured: chosen inside the scales of the VIMS images (fog areas ~100s of km apart).
FogTau = 0.25
FogTop = 1.5          ; [km]
FogLat = 60           ; polar edge [deg towards the summer pole]
FogCoverage = 0.3
FogPatchKm = 150
FogLifeH = 30
