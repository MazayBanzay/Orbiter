; === OrbiterCrew: Niza Krit, astronavigator of the 37th star expedition ===
; Mesh, skeleton and mocap clips are generated by Tantra_Design\blender (MakeHuman/MPFB CC0 assets, CMU mocap).
ClassName = OrbiterCrew\Astronavigator
Module = OrbiterCrew\CrewMember

Name = Niza Krit
Role = astronavigator
Voice = female1        ; XRSound\OrbiterCrew\voice\<Voice>: breathing takes
BodyMass = 62          ; kg
VO2max = 48            ; ml/kg/min, fit woman
Sex = female           ; a description: abilities below are set per person, not derived from sex or age
;Age =                 ; years (canon value to be set)
Height = 1.74          ; m
LiftMax = 60           ; kg she can lift briefly; carrying on the move about a third
BodyFat = 12           ; kg of usable fat reserve
StandHeight = 0.930    ; model origin above the soles, m
EyePos = 0 0.69 0.17   ; first-person eye point (rest pose), just in front of the eyes
WalkSpeed = 1.45       ; m/s
RunSpeed = 5.0         ; m/s, fresh legs

; variant 2: shipboard coverall (breathable air)
BodySkin = Tantra\Astronavigator
BodyClips = Tantra\anim
; variant 1: space suit "Karkas" - pressure suit with an integrated light exoskeleton and an RCS pack
SuitSkin = Tantra\AstronavigatorSuit
SuitClips = Tantra\anim_suit
SuitMass = 42          ; kg: suit 38 + RCS pack 4
SuitO2 = 1.0           ; kg in the tank
SuitSorbent = 1.6      ; kg of CO2 the sorbent holds
SuitBattery = 6.0      ; kWh: one battery for life support, thermal control and the drives
SuitPressure = 30      ; kPa, pure O2
DebugLog = 1           ; test lines in Orbiter.log (the seated hands, clicks, the head camera); 0 for play
