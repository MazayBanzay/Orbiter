; PERFORMANCE TEST copy of AstronavigatorPantsir.cfg: the same suit without reflection/roughness maps
; === OrbiterCrew: Niza Krit, astronavigator of the 37th star expedition ===
; Mesh, skeleton and mocap clips are generated by Tantra_Design\blender (MakeHuman/MPFB CC0 assets, CMU mocap).
ClassName = OrbiterCrew\AstronavigatorPantsirNR
Module = OrbiterCrew\CrewMember

Name = Niza Krit
Role = astronavigator
Voice = female1        ; XRSound\OrbiterCrew\voice\<Voice>: breathing takes
BodyMass = 62          ; kg
VO2max = 48            ; ml/kg/min, fit woman
Sex = female           ; a description: abilities below are set per person, not derived from sex or age
;Age =                 ; years (canon value to be set)
Height = 1.74          ; m
LiftMax = 60           ; kg she can lift briefly; carrying on the move about a third
BodyFat = 12           ; kg of usable fat reserve
StandHeight = 0.989    ; model origin above the soles, m: the suit's 64 mm insulated sole under her feet
EyePos = 0 0.69 0.17   ; first-person eye point (rest pose), just in front of the eyes
WalkSpeed = 1.45       ; m/s
RunSpeed = 5.0         ; m/s, fresh legs

; variant 2: shipboard coverall (breathable air)
BodySkin = Tantra\Astronavigator
BodyClips = Tantra\anim
; variant 1: heavy suit "Pantsir" (class 2, Orbitersdk\OrbiterCrew\HEAVY_SUIT.md): Io radiation and +500 C heat;
; the hybrid shield (ceramic on the impact zones, gold foil elsewhere), the hand in a capsule, the helmet's upper part lifts
SuitSkin = Tantra\AstronavigatorPantsirNR
SuitClass = Suit_T30   ; Config\OrbiterCrew\Suits\Suit_T30.cfg («Ïàíöèðü»): shield, field, battery, cooling, walk factor
SuitClips = Tantra\anim_suit
SuitMass = 130         ; kg: the shell with its shield 85, life support and battery 45 (no jet pack)
SuitO2 = 1.0           ; kg in the tank
SuitSorbent = 1.6      ; kg of CO2 the sorbent holds
SuitBattery = 6.0      ; kWh: one battery for life support, thermal control and the drives
SuitPressure = 30      ; kPa, pure O2
; the helmet's V1 cap (mesh groups HelmCap...): hinge behind the crown, rest pose, model frame (from the exported mesh)
HelmCapHinge = 0 0.8195 -0.0526
HelmCapAxis = -1 0 0
HelmCapOpen = 65      ; deg, up and back
; parts that can get red-hot (D3D9Client _heat maps): 0-based material index in Meshes\Tantra\AstronavigatorPantsir.msh
HeatCeram = 6         ; ceramic plates - at the surroundings' temperature
HeatSole = 12         ; soles and studs - at the ground's
HeatRad = 15          ; radiator fins - at the radiator's
DebugLog = 1           ; test lines in Orbiter.log (the seated hands, clicks, the head camera); 0 for play
