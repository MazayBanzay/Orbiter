; at sea level, hours of hover on 20 kg; an aerospike boost at each wing tip (600 N) for thin air and vacuum.
; Carried on the ground by the suit's frame («Каркас», servos on): 85 kg with the fuel (Orbitersdk\OrbiterCrew\JETPACK_FAN.md).
