; === OrbiterCrew: the experimental modular jet pack "Трилистник" v2, lying about (no module: a plain Orbiter vessel) ===
; The base is «Наплечный»'s core with its capsule pods (the boost, 500 N each); the atmo kit adds an arm a side carrying a
; gondola - the capsule under its hub, three ducted fans round it (D 0.23 m, their rotors and exit vanes seen working) -
; and a 300 kW metallic hydrogen power unit under the core: 2 x 1.4 kN at sea level, ~4 h of hover.
; The arm's root joint turns the arm and the gondola as one (the vector's pitch) and folds them back behind her.
; Worn (suit on, B next to it) it becomes part of the crew member; G starts the power unit and spreads the arms.
; Experimental, for the tests (Tantra_Design/tools/build_jetpack_trefoil.py).
