ClassName = Tantra
Module = Tantra

; Язык HUD: ru или en. D3D9Client рисует HUD только латиницей -> en.
; Русский текст - на 2D-панели корабля (F8).
HudLanguage = en

; ---------------------------------------------------------------------------
; Параметры корабля. Строка без ";" в начале перекрывает встроенное значение.
; Значения ниже - встроенные (docs/DESIGN.md). Единицы СИ.
; ---------------------------------------------------------------------------
; Массы, кг
;DryMass = 1.786e6
;TrapStructMass = 1.64e5        ; конструкция одной ловушки
;TrapFuelMass = 9.37e6         ; анамезон в одной ловушке
;IonChargeMass = 4.4e6          ; ионно-триггерные заряды

; Анамезонные камеры (4 шт.)
;AnaThrust = 2.17e10            ; Н на камеру (~200 g при ~44 кт)
;AnaExhaustC = 0.98             ; скорость истечения, доля c
;PelletRate = 2.0e4             ; Гц на камеру при полной тяге
;MassToEnergy = 0.80            ; доля массы гранулы, уходящая в энергию
;ChamberFieldEnergy = 1.56e14   ; Дж поля одной камеры (~1000 Тл, 390 м3)
;FieldStoreCapacity = 7.0e14    ; Дж, накопитель поля
;FieldRoundTrip = 0.95          ; возврат энергии поля при останове
;RecoveryFraction = 1.0e-3      ; индукционный возврат, доля мощности струи
;CompWattPerNewton = 1.0e5      ; Вт компенсатора на погашенный ньютон
;CompMaxG = 200                 ; сколько g компенсатор может погасить
;PlantPower = 2.0e9             ; Вт, ВЭУ
;Housekeeping = 3.0e7           ; Вт, ловушки + жизнеобеспечение + системы

; Блокировка горячего старта в атмосфере: h_min = Base + PerDecade * lg(P / RefPower)
;HotStartBaseAlt = 5.0e4
;HotStartPerDecade = 1.0e4
;HotStartRefPower = 1.2e17

; Планетарные (ионно-триггерные) моторы
;PlanThrustTotal = 1.36e9       ; Н, 12 чаш кольца в корме (вертикальный взлёт)
;PodThrustTotal = 1.5e8         ; Н, две вспомогательные гондолы на плече (висение лёгкого корабля)
;PlanExhaust = 3.0e5            ; м/с

; Микромоторы ориентации
;AttAngAccel = 0.01             ; рад/с2
;AttMaxThrust = 4.0e6           ; Н на мотор
;AttAxialAccel = 0.2            ; м/с2

; Ограничитель ощущаемой перегрузки по умолчанию, g
;GLimitDefault = 5.0
