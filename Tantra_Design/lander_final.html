/* ---------- 2D silhouettes ---------- */
function mirrorTop(h){ var a=h.map(function(p){return [p[0],p[1]];}); for(var i=h.length-1;i>=0;i--){ if(Math.abs(h[i][1])>1e-6) a.push([h[i][0],-h[i][1]]); } return a; }
function frontPts(h){ // returns [w,h] pairs; detect which column is height (has negative values)
  var c0neg=h.some(function(p){return p[0]<0;}), c1neg=h.some(function(p){return p[1]<0;});
  var hFirst=c0neg&&!c1neg;
  var P=h.map(function(p){ return hFirst? [p[1],p[0]] : [p[0],p[1]]; });
  var a=P.slice(); for(var i=P.length-1;i>=0;i--){ if(Math.abs(P[i][0])>1e-6) a.push([-P[i][0],P[i][1]]); } return a;
}
function path(pts,tf){ return 'M'+pts.map(function(p){ var q=tf(p[0],p[1]); return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' L')+' Z'; }
function bounds(pts){ var b={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9}; pts.forEach(function(p){ b.x0=Math.min(b.x0,p[0]); b.x1=Math.max(b.x1,p[0]); b.y0=Math.min(b.y0,p[1]); b.y1=Math.max(b.y1,p[1]); }); return b; }
function topSVG(v,k,opt){
  opt=opt||{}; var s=v.silhouettes||{}, pal=v.palette||{};
  var pts=mirrorTop(s.top_half||[]), b=bounds(pts), L=Math.max(20.2,b.x1-b.x0), W=Math.max(16,2*Math.max(Math.abs(b.y0),Math.abs(b.y1)));
  var pad=opt.mini?3:18, w=L*k+2*pad, h=W*k+2*pad+(opt.mini?0:14);
  var ox=pad+(L-(b.x1-b.x0))/2*k-b.x0*k, oy=pad+(opt.mini?0:14)+W/2*k;
  var tf=function(x,y){ return [ox+x*k, oy-y*k]; };
  var g='';
  if(!opt.mini){
    var fx=ox+((b.x0+b.x1)/2-10.1)*k; g+='<rect class="hangar" x="'+fx.toFixed(1)+'" y="'+(oy-8*k).toFixed(1)+'" width="'+(20.2*k).toFixed(1)+'" height="'+(16*k).toFixed(1)+'"/>';
    g+='<line class="ax" x1="'+(pad-6)+'" y1="'+oy+'" x2="'+(w-pad+6)+'" y2="'+oy+'"/>';
    g+='<text class="lab" x="'+pad+'" y="13">'+esc(opt.label||'Сверху · рамка — ангар 20,2 × 16,0 м · нос слева')+'</text>';
  }
  g+='<path d="'+path(pts,tf)+'" fill="'+(pal.hull||'#1c1f26')+'" stroke="'+(pal.accent||'#c9a24a')+'" stroke-width="'+(opt.mini?0.8:1.4)+'" stroke-linejoin="round"/>';
  return '<svg class="'+(opt.mini?'mini':'sv')+'" viewBox="0 0 '+w.toFixed(1)+' '+h.toFixed(1)+'"'+(opt.mini?'':' style="max-width:'+Math.round(w)+'px"')+'>'+g+'</svg>';
}
function sideFrontSVG(v,k){
  var s=v.silhouettes||{}, pal=v.palette||{};
  var up=(s.side_up||[]).slice(), lo=(s.side_lo||[]).slice();
  if(up.length>1&&up[0][0]>up[up.length-1][0]) up.reverse(); if(lo.length>1&&lo[0][0]>lo[lo.length-1][0]) lo.reverse();
  var side=lo.concat(up.slice().reverse()), sb=bounds(side);
  var fr=frontPts(s.front_half||[]), fb=bounds(fr);
  var H=Math.max(5.4,sb.y1-sb.y0,fb.y1-fb.y0)+0.6, pad=18, top=16;
  var Ls=Math.max(20.2,sb.x1-sb.x0), Wf=Math.max(16,fb.x1-fb.x0);
  var w=Ls*k+Wf*k+3*pad+20, h=H*k+top+pad;
  var base=top+H*k-0.3*k; // ground line for frame
  var ox=pad-sb.x0*k, yz=function(y,b0){ return base-(y-b0)*k; };
  var g='';
  var fx=pad+((sb.x1-sb.x0)/2-10.1)*k;
  g+='<rect class="hangar" x="'+fx.toFixed(1)+'" y="'+(base-5.4*k).toFixed(1)+'" width="'+(20.2*k).toFixed(1)+'" height="'+(5.4*k).toFixed(1)+'"/>';
  g+='<path d="'+path(side,function(x,y){return [ox+x*k, yz(y,sb.y0)];})+'" fill="'+(pal.hull||'#1c1f26')+'" stroke="'+(pal.accent||'#c9a24a')+'" stroke-width="1.4" stroke-linejoin="round"/>';
  g+='<path d="'+path(lo.concat(lo.slice().reverse().map(function(p){return [p[0],p[1]+0.25];})),function(x,y){return [ox+x*k, yz(y,sb.y0)];})+'" fill="'+(pal.belly||'#2b2624')+'" stroke="none"/>';
  g+='<text class="lab" x="'+pad+'" y="12">Сбоку · рамка 20,2 × 5,4 м · нос слева</text>';
  var cx=pad*2+Ls*k+20+Wf*k/2;
  g+='<rect class="hangar" x="'+(cx-8*k).toFixed(1)+'" y="'+(base-5.4*k).toFixed(1)+'" width="'+(16*k).toFixed(1)+'" height="'+(5.4*k).toFixed(1)+'"/>';
  g+='<path d="'+path(fr,function(x,y){return [cx+x*k, yz(y,fb.y0)];})+'" fill="'+(pal.hull||'#1c1f26')+'" stroke="'+(pal.accent||'#c9a24a')+'" stroke-width="1.4" stroke-linejoin="round"/>';
  g+='<text class="lab" x="'+(cx-8*k)+'" y="12">Спереди · рамка 16,0 × 5,4 м</text>';
  return '<svg class="sv" viewBox="0 0 '+w.toFixed(1)+' '+h.toFixed(1)+'" style="max-width:'+Math.round(w)+'px">'+g+'</svg>';
}

function mat(role,pal){
  var key=role+'|'+(pal||''); if(MC[key]) return MC[key];
  var p={color:ROLE_C[role]||ROLE_C.other,roughness:0.7,metalness:0.2,flatShading:true};
  if(role==='cup'){ p.metalness=0.65; p.roughness=0.35; p.side=THREE.DoubleSide; if(pal&&pal.metal) p.color=new THREE.Color(pal.metal); }
  if(role==='coil'){ p.metalness=0.7; p.roughness=0.3; if(pal&&pal.accent) p.color=new THREE.Color(pal.accent); }
  if(role==='tank'){ p.transparent=true; p.opacity=0.55; p.emissive=new THREE.Color(0x0d2a3c); }
  if(role==='charges'){ p.emissive=new THREE.Color(0x4a2c00); }
  if(role==='cabin'){ p.transparent=true; p.opacity=0.35; p.depthWrite=false; }
  if(role==='door'&&pal&&pal.metal) p.color=new THREE.Color(pal.metal);

  return MC[key]=new THREE.MeshStandardMaterial(p);

function buildHull(secs,pal){
  if(!Array.isArray(secs)||secs.length<2) return null;
  secs=secs.slice().sort(function(a,b){return a.x-b.x;});
  var rings=secs.map(function(s){
    var hw=Math.max(0.05,+s.hw||0.5), yt=+s.yt, yb=+s.yb; if(!(yt>yb)) { yt=yb+0.05; }
    var hh=(yt-yb)/2, ch=(typeof s.ch==='number')? s.ch : 0.22*Math.min(hw,hh); ch=Math.max(0,Math.min(ch,hw*0.98,hh*0.98));
    return [[yt,-hw+ch],[yt,hw-ch],[yt-ch,hw],[yb+ch,hw],[yb,hw-ch],[yb,-hw+ch],[yb+ch,-hw],[yt-ch,-hw]].map(function(p){ return new THREE.Vector3(+s.x||0,p[0],p[1]); });
  });
  var pos=[]; function tri(a,b,c){ pos.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z); }
