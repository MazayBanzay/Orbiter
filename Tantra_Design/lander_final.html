<style>
:root{--bg:#eef1f4;--panel:#ffffff;--ink:#1d2430;--muted:#5d6878;--line:#d5dbe3;--ok:#1f8a4c;--warn:#b7791f;--bad:#c53030;--acc:#2b6cb0}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#top{padding:12px 16px 4px}
h1{font-size:18px;margin:0 0 4px}
h2{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h3{font-size:15px;margin:4px 0 6px}
.note{font-size:12px;color:var(--muted)}
#tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
button{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#f7f9fb;color:var(--ink);cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pane{display:none;padding:10px 16px 30px}
.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px 6px;border-bottom:1px solid #eef1f4;vertical-align:middle;text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.fin{background:#f2f7fd}
tr.fin td:first-child{border-left:4px solid var(--acc)}
.bar{display:inline-block;height:6px;background:var(--acc);border-radius:3px;vertical-align:middle;margin-left:4px;opacity:.55}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chk{display:inline-flex;gap:5px;align-items:center;margin-right:12px;font-size:13px}
#view3d{position:relative;height:520px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#0b0e14}
#view3d canvas{display:block}
#vhud{position:absolute;left:10px;top:10px;color:#fff;font-size:12px;background:rgba(0,0,0,.5);padding:6px 9px;border-radius:6px;pointer-events:none;max-width:70%}
#vbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
#vbar button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);font-size:12px;padding:3px 8px}
#fail{position:absolute;inset:0;color:#eee;padding:20px;display:none}
svg.sv{width:100%;height:auto;display:block}
svg .hangar{fill:none;stroke:#9aa6b6;stroke-dasharray:6 4;stroke-width:1.2}
svg .lab{font-size:12px;fill:#5d6878}
svg .ax{stroke:#c3cad4;stroke-width:.8}
.mini{width:96px;height:auto;display:block}
.txt p{margin:4px 0}
ul{margin:4px 0 4px 18px;padding:0}
li{margin:2px 0}
.pmr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#e6eef8;color:#2b6cb0;border:1px solid #c5d7ee;margin-left:6px}
.cmp td{min-width:120px}
.cmp td:first-child{font-weight:600;min-width:220px}
.best{color:var(--ok);font-weight:700}
@media (max-width:980px){.grid2,.pmr{grid-template-columns:1fr}#view3d{height:400px}}
</style>
</head>

: [-1, -0.6, 4.5], "span": 2.5, "root_chord": 8, "tip_chord": 5.22, "le_sweep_deg": 48, "thickness": 0.35, "dihedral_deg": 0}, {"side": "L", "group": "tip_L", "root_le": [-3.78, -0.6, -7], "span": 2.4, "root_chord": 5.22, "tip_chord": 2.55, "le_sweep_deg": 48, "thickness": 0.2, "dihedral_deg": 0}, {"side": "R", "group": "tip_R", "root_le": [-3.78, -0.6, 7], "span": 2.4, "root_chord": 5.22, "tip_chord": 2.55, "le_sweep_deg": 48, "thickness": 0.2, "dihedral_deg": 0}], "movers": [{"group": "marsh_L", "pivot": [-7, 0.3, -1.1], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 45, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": 0, "max_deg": 95, "note_ru": "95° — торможение вперёд-вниз"}, {"group": "marsh_R", "pivot": [-7, 0.3, 1.1], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 45, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": 0, "max_deg": 95}, {"group": "lift_L", "pivot": [5.4, -0.7, -1], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": 0, "max_deg": 90, "note_ru": "Выход из ниши струёй вниз"}, {"group": "lift_R", "pivot": [5.4, -0.7, 1], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": 0, "max_deg": 90}, {"group": "tip_L", "pivot": [-5, -0.6, -7], "axis": [1, 0, 0], "hover_deg": 0, "transition_deg": 0, "cruise_deg": 0, "stowed_deg": 90, "entry_deg": 0, "min_deg": -15, "max_deg": 90, "note_ru": "Складка вверх для ангара"}, {"group": "tip_R", "pivot": [-5, -0.6, 7], "axis": [1, 0, 0], "hover_deg": 0, "transition_deg": 0, "cruise_deg": 0, "stowed_deg": -90, "entry_deg": 0, "min_deg": -90, "max_deg": 15}, {"group": "gear_N", "pivot": [7.1, -0.8, 0], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": 0, "max_deg": 90}, {"group": "gear_L", "pivot": [-3.9, -0.9, -3.4], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": 0, "max_deg": 90}, {"group": "gear_R", "pivot": [-3.9, -0.9, 3.4], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": 0, "max_deg": 90}], "thrusters": [{"id": "marsh_L", "group": "marsh_L", "origin": [-8.7, 0.3, -1.1], "dir": [-1, 0, 0], "thrust_MN": 0.22, "vector_cone_deg": 8}, {"id": "marsh_R", "group": "marsh_R", "origin": [-8.7, 0.3, 1.1], "dir": [-1, 0, 0], "thrust_MN": 0.22, "vector_cone_deg": 8}, {"id": "lift_L", "group": "lift_L", "origin": [4.4, -0.55, -1], "dir": [-1, 0, 0], "thrust_MN": 0.26, "vector_cone_deg": 0}, {"id": "lift_R", "group": "lift_R", "origin": [4.4, -0.55, 1], "dir": [-1, 0, 0], "thrust_MN": 0.26, "vector_cone_deg": 0}]}}, {"id": "Т1Б", "name_ru": "«Грань»", "tagline_ru": "Горячий кристалл: острая трапеция из боразона и боридов, 2 маршевых с УВТ ±15° и 4 скрытые подъёмные чаши", "concept_ru": "Цельное тело-трапеция длиной 20,0 м: острый нос (R 0,15 м), стреловидные грани корпуса Λ 74° переходят в несущие плоскости Λ 55°, плоское днище 168 м². Теплозащита пассивная: нагрузку держит сама горячая оболочка из боразона и борных керамик, тепло уходит излучением. Острые кромки дают гиперзвуковое качество 2,4 при α 20°. Аварийный баллистический вход идёт днищем поперёк потока: эффективный радиус 6 м вместо 0,15 м. Висение обеспечивают 4 чаши по 330 кН вокруг ЦМ, они скрыты за створками заподлицо. Концевые части крыла 1,3 м работают как килевые плоскости (60°) на гиперзвуке и складываются на 90° для ангара.", "thermal_ru": "Пассивная горячая конструкция, ε 0,85. Планирование при α 40°, 7,8 км/с, β 518 кг/м²: пик на носу R 0,15 м около 1,0 МВт/м² при 6,5 км/с, T ≈ 2150 K. Кромки граней (R 3 см, Λ 68–74°) дают 0,66 МВт/м², ~1920 K. Кромка крыла (R 5 см, Λ 55°) — 0,93 МВт/м², ~2100 K. Днище — ниже 1500 K. Предел боридов циркония/гафния с боразоном — около 2400–2500 K, запас ~250 K. Тепловой поток метод не снижает (0 %), всё делает геометрия: стреловидность ×cos^1,2(Λ) срезает поток на кромке на 69 % по сравнению с прямой кромкой, а баллистический вход днищем снижает поток на 84 % по сравнению с входом носом вперёд (0,36 против 2,28 МВт/м²).", "materials_ru": "Нос и кромки — монолит из борида гафния/циркония с боразоновой армирующей фазой, «кристаллически перестроенная» мелкозернистая структура (рабочая T 2400 K). Обшивка — панели из композита боразона и ZrB₂ толщиной 6–10 мм на горячем боразоновом каркасе, покрыты тёмным боразоно-циркониевым лаком (ε 0,85). Внутренний барьер — пористая борная керамика 40 мм, кабина держится не выше 320 K. Шарниры складывания, кольца приводов и УВТ — бериллиевая бронза с боразонным покрытием. Иридий не используется.", "ballistic_ru": "Аварийный баллистический вход: аппарат разворачивается днищем поперёк потока (α 90°, CD 1,3), β 220 кг/м², γ −2°, вход на 7,8 км/с. Пиковая перегрузка ≈ V²·sinγ/(2e·g·H) = 5,5 g; кресла с поглотителем инерции переносят её без труда. Нагрев: ρ ≈ β·sinγ/(3H), V ≈ 6,6 км/с, днище R_eff 6 м → 0,36 МВт/м², T ≈ 1690 K. Если бы аппарат вошёл носом вперёд (R 0,15 м), было бы 2,3 МВт/м² и ~2620 K, выше предела, поэтому режим «днищем» обязателен. Удерживают его аналоговый резервный автомат и элевоны. Кромки в тени, ниже 1500 K.", "hypersonic_ru": "Острый нос и кромки дают L/D ≈ 2,4 при α 20° и 1,15 при α 40° (участок пикового нагрева). Боковая дальность — около 2000 км. Путевая устойчивость — от концевых плоскостей, поднятых на 60° (работают как два наклонных киля). Тангаж и крен управляются двумя элевонами на задней кромке и УВТ маршевых ±15°. Ничего не выступает: створки чаш закрыты заподлицо, шасси убрано.", "hover_ru": "4 подъёмные чаши по 330 кН в точках (±3,0; ±2,6) м от ЦМ, струя вниз на 15 км/с. Т/В на Земле 2,24 при 60 т. Если одна чаша отказывает, оставшиеся три не дают баланса моментов, поэтому висение держит диагональная пара (вторая уцелевшая уходит в малый газ). Пара в аварийном режиме (11,5 км/с, тяга ×1,30, 30–60 с) даёт Т/В 1,46; на номинале было бы 1,12. Расход аргона на висении 88 кг/с, запаса хватает на ~200 с полного висения. Маршевые в висении не участвуют.", "ttx": {"length_m": 20, "span_m": 18, "span_stowed_m": 15.6, "height_m": 3.4, "planform_area_m2": 168, "mtom_t": 60, "dry_t": 30, "payload_t": 10, "reaction_mass_t": 18, "T_lift_max_K": 2150, "T_ball_max_K": 1690, "n_ball_g": 5.5, "beta_lift_kgm2": 518, "beta_ball_kgm2": 220, "nose_R_m": 0.15, "heat_reduction_pct": 69, "ld_hypersonic": 2.4, "ld_subsonic": 4.5, "v_land_power_off_ms": 65, "tw_earth": 2.24, "tw_one_unit_out": 1.46, "thrust_total_MN": 2.22, "tvc_range_deg": 15, "units_total": 6, "moving_parts": 17}, "propulsion_ru": "Всего 6 ионно-триггерных моторов, импульсный синтез в магнитной чаше со сверхпроводящими катушками (12,1 Тл, 58,3 МПа; площади среза хватает с запасом — 0,006 м² на 330 кН). Маршевые: 2 × 450 кН в корме, УВТ ±15°, в пустоте 30–60 км/с. Выход на орбиту (Δv 9,3 км/с при 40 км/с) требует ~12 т аргона. Подъёмные: 4 × 330 кН, мощность ~2,5 ГВт на чашу (F = 2P/v). Рабочее тело — жидкий аргон 18 т (12,9 м³) из запаса «Тантры», ионные заряды 2 т. Теневой экран 25 г/см² между чашами и салоном.", "lift_units_ru": "4 подъёмные чаши лежат в корпусе плашмя, каждая за парой створок заподлицо с днищем. Для висения чаша поворачивается на 90° в вертикаль, срез выходит на 0,8 м под днище. Управляемы (качание ±8°) только две передние; задние неподвижны, баланс держится дросселированием. Расставлены по квадрату вокруг ЦМ, поэтому при отказе одной висение продолжает диагональная пара. На входе и в крейсере чаши убраны, створки закрыты.", "wings_ru": "Несущие плоскости Λ 55°, корневая хорда 10,8 м, размах 18,0 м. Концевые части по 1,3 м складываются вверх: 0° — дозвук и посадка (L/D 4,5), 60° — гиперзвук и вход (работают как кили), 90° — ангар (размах 15,6 м). Задняя кромка — по одному элевону на сторону. Днище плоское несущее.", "layout_ru": "Нос (x +11…+6): датчики фотонной полосы, за ними виртуальный кокпит на 2 .2, 0.2, -1.8], "dir": [-1, 0, 0], "thrust_MN": 0.45, "vector_cone_deg": 15}, {"id": "main_R", "group": "main_R", "origin": [-9.2, 0.2, 1.8], "dir": [-1, 0, 0], "thrust_MN": 0.45, "vector_cone_deg": 15}, {"id": "lift_FL", "group": "lift_FL", "origin": [3, -1.9, -2.6], "dir": [0, -1, 0], "thrust_MN": 0.33, "vector_cone_deg": 8}, {"id": "lift_FR", "group": "lift_FR", "origin": [3, -1.9, 2.6], "dir": [0, -1, 0], "thrust_MN": 0.33, "vector_cone_deg": 8}, {"id": "lift_RL", "group": "lift_RL", "origin": [-3, -1.9, -2.6], "dir": [0, -1, 0], "thrust_MN": 0.33, "vector_cone_deg": 0}, {"id": "lift_RR", "group": "lift_RR", "origin": [-3, -1.9, 2.6], "dir": [0, -1, 0], "thrust_MN": 0.33, "vector_cone_deg": 0}]}}, {"id": "Т2А", "name_ru": "«Щит-Т» (Т2А)", "tagline_ru": "Тёмный кристаллический клин, который отодвигает пламя входа собственным полем", "concept_ru": "Несущий корпус-трапеция 19,9 м с плоским днищем; две маршевые чаши по бортам кормы поворачиваются на 0–95°, две неуправляемые подъёмные чаши выдвигаются из ниш днища впереди ЦМ. Сверхпроводящие катушки всех 4 чаш и носовая катушка на входе образуют магнитный щит: отодвигают ионизированный ударный слой (−42 % потока на носу и кромках) и дают боковое и тангажное управление на гиперзвуке без рулей. Одна деталь на два дела: катушка = двигатель + теплозащита + руль. Внешние консоли складываются вверх (кили на входе) и на спину (ангар).", "thermal_ru": "Активный слой: магнитный щит. Поле у стенки ≈3 Т (носовая катушка 12,1 Т в ядре), проводимость ударного слоя ≈60 См/м, параметр взаимодействия Q = σB²L/(ρV) ≈ 57 ≫ 1 — ударный слой отодвигается, поток к носу и кромкам падает на 42 %, к днищу на 20 % (поле там слабее). Пассивный слой: боразоно-циркониевый лак ε 0,85 по корпусу из борной керамики. Планирующий вход (α 40°, 7,8 км/с): нос 456→264 кВт/м² (1754→1530 К), кромка Λ60° 435→252 кВт/м² (1512 К), днище 1427 К. Баллистический: нос 853→495 кВт/м² (2050→1790 К), кромка 813→472 (≈1770 К), днище 467→374 (≈1670 К). Без щита максимум 2050 К — в пределах боридов Zr/Hf (≤2300 К): щит даёт запас, а не держит жизнь.", "materials_ru": "Нос, кромки, кольца ниш: бориды гафния/циркония с кристаллически перестроенной структурой (до 2300 К). Днище и корпус: композит боразон + ZrB₂, сверху боразоно-циркониевый лак (тёмный, ε 0,85). Створки ниш и шарниры консолей: кольца бериллиевой бронзы с боразонным покрытием. Чаши: сверхпроводящие катушки в боразоновом корпусе. Теневой экран между кормой и салоном: 25 г/см². Иридий не применяется.", "ballistic_ru": "Днищем вперёд, без подъёмной силы, γ −2°, масса 49 т, площадь в плане на входе 173 м², Cd 1,35 → β ≈ 210 кг/м². Пиковая перегрузка ≈ V²·sinγ/(2e·g·H) = 5,5 g (лёжа в креслах с поглотителем инерции — переносимо). Пик нагрева при ρ ≈ 3,4·10⁻⁴ кг/м³, V ≈ 6,6 км/с: нос 495 кВт/м² (1790 К) со щитом, 853 кВт/м² (2050 К) без него. Консоли на 60° работают как кили и дают устойчивость по курсу; щит, если жив, ещё и стабилизирует по крену.", "hypersonic_ru": "Планирование днищем α ≈ 40°, L/D ≈ 0,83, β ≈ 380 кг/м². Управление без отклоняемых рулей: асимметрия поля левой и правой катушек чаш смещает ударный слой и даёт крен и рыскание, носовая катушка с кормовыми дают тангаж; консоли-кили на 60° держат курс. Боковая дальность ±600 км. Ничего не торчит: чаши и опоры убраны, створки заподлицо.", "hover_ru": "Тяга 0,86 МН, Т/В 1,46 при 60 т. Маршевые чаши на 90° (2×0,184 МН, x −7,5) и подъёмные (2×0,246 МН, x +5,6) уравновешены по тангажу. Мощность струи 6,4 ГВт при 15 км/с у грунта; расход 57 кг/с → 11 т аргона ≈ 190 с висения. Отказ любой чаши: остальные в аварийном режиме 11,5 км/с (тяга ×1,30 при той же мощности, 30–60 с), маршевые разводятся по тяге для баланса по крену → Т/В 0,95 при 60 т, 1,17 при посадочных 49 т: с полной заправкой — сброс аргона и управляемое снижение, на посадке — висение сохраняется.", "propulsion_ru": "4 ионно-триггерные чаши, импульсный синтез в магнитной чаше, поле 12,1 Т (форсаж 16 Т). Площадь среза по давлению поля нужна ≥0,0042 м² на чашу — запас многократный. Маршевые: в корме по бортам, z ±3,2, поворот 0° (назад, марш) → 90° (вниз, висение) → 95° (вперёд-вниз, торможение); в пустоте струя 30–100 км/с. Подъёмные: неуправляемые по направлению (только дросселирование), в нишах днища z ±1,6. Срыв поля: тяга до нуля за ~1 с.", "lift_units_ru": "2 подъёмные чаши по 0,246 МН. В нишах днища за створками заподлицо (бериллиевая бронза с боразоном). Выдвижение: створка вбок, чаша поворачивается на 90° из горизонтального положения в нише в положение «срез вниз». Направление не управляется, только тяга; управление по тангажу и крену висения — дросселированием и поворотом маршевых чаш. На входе, в марше и в ангаре убраны.", "wings_ru": "Корпус-трапеция: ширина в корме 12,4 м, площадь 160 м². Внешние консоли: размах 3,4 м, хорды 5,8/2,0 м, стреловидность 55°, площадь 2×13,3 м². Положения: 0° (размах 19,2 м, дозвук, L/D 4,5, посадка без тяги 62 м/с), 60° вверх — кили на входе, 165° — лежат на спине в ангаре (ширина 12,4 м).", "layout_ru": "Нос (x +10…+6): носовая катушка щита, фотонная полоса датчиков по кромке. x +6…+3: виртуальный кокпит на 2 (экраны, без окон), под ним ниши подъёмных чаш. x +3…−3: салон на 12, шлюз, аварийный O₂ на 14. x −3…−5: теневой экран 25 г/см². x −5…−9,5: 2 бака аргона (перекрёстная подача), ионные заряды, криокулеры ×2, маршевые чаши по бортам. Грузовой отсек 10 т — под салоном между нишами и экраном.", "mass_table_ru": "Корпус+теплозащита 9,5 т; катушки и 4 чаши 7,0; теневой экран 2,5; энергетика/заряды 6,0; опоры 1,8; салон+жизнеобеспечение на 14 3,5; фотоника 0,8; консоли+приводы 2,4; резервы (O₂, 2-й криокулер, 2-й инжектор) 1,2; баки 1,3; прочее 2,0 → сухая 38 т. Груз 10 т, аргон 11 т (7,9 м³), ионные заряды 1 т → взлётная 60 т; посадочная ≈49 т.", "emergencies": [{"regime_ru": "Планирующий вход", "failure_ru": "Отказ магнитного щита (срыв поля носовой катушки)", "action_ru": "Продолжить вход на пассивной керамике, α увеличить до 45° для снижения пика", "reserve_ru": "Нос 1754 1, 0, 0], "thrust_MN": 0.246, "vector_cone_deg": 0}, {"id": "lift_R", "group": "lift_R", "origin": [4.9, -1, 1.6], "dir": [-1, 0, 0], "thrust_MN": 0.246, "vector_cone_deg": 0}]}, "ttx": {"length_m": 19.9, "span_m": 19.2, "span_stowed_m": 12.4, "height_m": 3.6, "planform_area_m2": 187, "mtom_t": 60, "dry_t": 38, "payload_t": 10, "reaction_mass_t": 11, "T_lift_max_K": 1530, "T_ball_max_K": 1790, "n_ball_g": 5.5, "beta_lift_kgm2": 380, "beta_ball_kgm2": 210, "nose_R_m": 1.2, "heat_reduction_pct": 42, "ld_hypersonic": 0.83, "ld_subsonic": 4.5, "v_land_power_off_ms": 62, "tw_earth": 1.46, "tw_one_unit_out": 0.95, "thrust_total_MN": 0.86, "tvc_range_deg": 95, "units_total": 4, "moving_parts": 11}}, {"id": "Т2Б", "name_ru": "Т2Б «Щит»", "tagline_ru": "Гранёная треугольная плита из боразона: одни и те же сверхпроводящие катушки поднимают аппарат с грунта и отодвигают от него плазму", "concept_ru": "Несущий корпус треугольный в плане (стреловидность передней кромки 65°), 19,8 м; днище плоское; трапециевидные консоли, внешние панели складываются вверх. Носовая катушка и катушки 4 подъёмных чаш на входе питаются от общего контура и создают поле 1–1,5 Тл в ударном слое. Поле отодвигает ионизированную плазму от днища (−38 % потока у носа), а асимметрией тока по четырём точкам даёт момент по крену и рысканию без рулей. 2 маршевые чаши с УВТ ±15° для полёта, 4 выдвижные подъёмные — только для висения. На входе всё убрано заподлицо.", "thermal_ru": "Пассивная основа — днище и кромки из борной ультракерамики (ZrB2/HfB2 + боразон) под боразоно-циркониевым лаком, ε 0,85, предел ~2400 K. Активная часть — МГД-щит. При V > 5 км/с ударный слой ионизирован, σ ≈ 2000 См/м. B у носа 1,5 Тл, R 1,4 м. Параметр взаимодействия Q = σB²L/(ρV) ≈ 2600, с учётом эффекта Холла (β_H ≈ 10) эффективно ~25. При Q ~ 10 снижение потока в точке торможения 20–50 %, принято 38 %. На кромках консолей катушки дальше, поэтому только 20 %, на корме ~10 %. Планирующий вход: нос 373 → 231 кВт/м², T 1667 → 1480 K; кромка до 1590 K. Баллистический вход: нос 822 → 510 кВт/м², T 2030 → 1810 K; кромка 1920 K. Без щита все точки ≤ 2040 K, то есть ниже предела материала, запас ~360 K.", "materials_ru": "Днище, нос и кромки: композит HfB2/ZrB2 + кубический BN с кристаллически перестроенной структурой, лак боразоно-циркониевый (тёмный). Каркас: боразоновые фермы. Кольца приводов и шарниры чаш: бериллиевая бронза с боразонным покрытием. Катушки: сверхпроводник в криостате, 12,1 Тл номинал. Теневые экраны чаш: ~25 г/см². Иридий не используется.", "ballistic_ru": "Аварийный вход днищем без подъёмной силы, γ −2°, 7,8 км/с. β = 60 000/(1,55·170) ≈ 228 кг/м². Пиковая перегрузка n = V²sinγ/(2e·g·H) ≈ 5,5 g; ложементы с поглотителем инерции, люди лежат спиной к днищу. Пик нагрева при ρ ≈ 3,7·10⁻⁴ кг/м³, V ≈ 6,6 км/с: нос 822 кВт/м² (2030 K), со щитом 510 кВт/м² (1810 K); кромки 1920 K. Щит работает от аккумулированных зарядов и не требует тяги. Ориентацию держит поле катушек (крен/рыскание) и аэродинамическая устойчивость плоского днища.", "hypersonic_ru": "Планирование днищем, α 30–40°, K_гз ≈ 1,4. Управление на гиперзвуке без выступающих рулей: дифференциальный ток в 4 катушках чаш и носовой смещает точку отрыва ударного слоя и даёт моменты по крену и рысканию; тангаж — носовая катушка плюс балансировочный угол консолей. Пиковый поток 231 кВт/м² со щитом, перегрузка ≤ 1,8 g, боковая дальность ±1200 км.", "hover_ru": "4 выдвижные подъёмные чаши по 0,30 МН стоят симметрично вокруг ЦМ (x ±3,0, z ±2,6). Тяга 1,2 МН, Т/В 2,04. Передняя пара отклоняется ±10°, задняя неподвижна. Расход Ar 80 кг/с на полной тяге, 39 кг/с при висении (60 т). Отказ одной чаши: Т/В 1,53, противоположную дросселируют до баланса, маршевые с УВТ −15° добавляют момент → Т/В 1,79. Аварийный форсаж струи 11,5 км/с: 0,39 МН на чашу, Т/В 1,99 на трёх чашах в течение 30–60 с.", "ttx": {"length_m": 19.8, "span_m": 19.2, "span_stowed_m": 15.4, "height_m": 4.9, "planform_area_m2": 170, "mtom_t": 60, "dry_t": 36, "payload_t": 10, "reaction_mass_t": 14, "T_lift_max_K": 1590, "T_ball_max_K": 1920, "n_ball_g": 5.5, "beta_lift_kgm2": 840, "beta_ball_kgm2": 228, "nose_R_m": 1.4, "heat_reduction_pct": 38, "ld_hypersonic": 1.4, "ld_subsonic": 4.2, "v_land_power_off_ms": 85, "tw_earth": 2.04, "tw_one_unit_out": 1.53, "thrust_total_MN": 1.8, "tvc_range_deg": 15, "units_total": 6, "moving_parts": 15}, "propulsion_ru": "Ионно-триггерные моторы, импульсный синтез в магнитной чаше, 12,1 Тл (58,3 МПа на стенку). Всего 6 чаш по 0,30 МН, сумма 1,8 МН. Мощность каждой чаши P = F·v/2 ≈ 2,25 ГВт при струе 15 км/с. Маршевые ×2 в корме, УВТ ±15° кольцом бериллиевой бронзы; в пустоте струя 30–100 км/с. Рабочее тело — жидкий Ar 14 т (10 м³) в 2 баках с перекрёстной подачей. Струя разрушительна, поэтому висение выше 30 м над грунтом, касание выполняется на последних метрах с дросселированием.", "lift_units_ru": "4 подъёмные чаши лежат в нишах днища плашмя, створки заподлицо. Для висения чаша поворачивается на 90° вокруг поперечной оси соплом вниз. Передние 2 отклоняются ±10° (тангаж/крен/малое смещение), задние 2 неподвижные. На входе катушки убранных чаш работают как элементы МГД-щита. Вес чаши с приводом 1,5 т.", "wings_ru": "Внутренние консоли: корневая хорда 8,9 м, концевая 3,4 м, размах 3,4 м на сторону, стреловидность 58°. Внешние панели: хорды 3,4/1,2 м, размах 2,0 м, стреловидность 40°. Внешние панели складываются вверх на 90°: на входе они работают как кили, в ангаре сокращают размах с 19,2 до 15,4 м. На дозвуке панели раскрыты, K 4,2.", "layout_ru": "Нос (x +7…+10): носовая катушка в криостате, фотонная полоса датчиков по граням. Кокпит на 2 (x +4…+7), окон нет, экраны, аналоговый резервный пульт. Салон 12 ложементов (x −2…+4), шлюз и грузовой отсек 10 т (x −6…−2), баки Ar ×2 по бортам у ЦМ. В нишах днища 4 подъёмные чаши вокруг ЦМ. Корма (x −9,4…−6): 2 маршевые чаши и криокулеры ×2. Шасси: передняя опора и 2 основные.", "mass_table_ru": "Корпус с ТЗП 9,5; консоли со складыванием 2,6; маршевые ×2 3,6; подъёмные ×4 с приводами 6,0; катушки, криостаты и носовая катушка 2,4; шасси 1,8; накопители ионных зарядов 3,0; салон, ложементы и СЖО (в т. ч. аварийный O₂ на 14) 4,5; фотонная авионика 1,0; теневые экраны 1,6. Сухая масса 36,0 т; нагрузка 10 т; Ar 14 т; взлётная 60 т.", "emergencies": [{"regime_ru": "Висение", "failure_ru": "отказ одной подъёмной чаши", "action_ru": "дросселировать противоположную, добавить маршевые с УВТ −15°", "reserve_ru": "Т/В 1,53 на трёх чашах, 1,79 с маршевыми"}, {"regime_ru": "Висение", "failure_ru": "срыв поля в чаше (тяга ноль за ~1 с)", "action_ru": "аварийный режим струи 11,5 км/с на оставшихся", "reserve_ru": "Т/В 1,99 на 30–60 с, второй инжектор"}, {"regime_ru": "Гиперзвук", "failure_ru": "отказ МГД-щита", "action_ru": "продолжать вход на пассивной ТЗП, α 40°", "reserve_ru": "T ≤ 1670 K при пределе материала 2400 K"}, {"regime_ru": "Гиперзвук", "failure_ru": "отказ катушки управления", "action_ru": "перераспределить ток в 3 оставшиеся катушки, тангаж консолями", "reserve_ru": "управление по крену и рысканию сохраняется на 3 точках"}, {"regime_ru": "Вход", "failure_ru": "потеря подъёмной силы или управления", "action_ru": "баллистический спуск днищем, щит включён", "reserve_ru": "5,5 g, 1810–1920 K; без щита 2040 K < 2400 K"}, {"regime_ru": "Маршевый полёт", "failure_ru": "отказ одного маршевого", "action_ru": "парировать УВТ второго (±15°) и током катушек", "reserve_ru": "0,30 МН, полёт на орбиту продолжается с большим расходом Ar"}, {"regime_ru": "Посадка", "failure_ru": "отказ всех чаш", "action_ru": "планирование на раскрытых консолях, посадка на шасси", "reserve_ru": "K 4,2, посадочная скорость 85 м/с"}, {"regime_ru": "Любой", "failure_ru": "отказ подачи или криокулера", "action_ru": "перекрёстная подача из 2-го бака, 2-й криокулер, двойные обмотки приводов, ручной аналоговый пульт", "reserve_ru": "дублирование 100 %, аварийный O₂ на 14"}], "hangar": {"fits": true, "stowed_bbox_m": [19.8, 15.4, 4.9], "growth_ru": "Запас: 0,4 м по д ": 0, "cruise_deg": 90, "stowed_deg": 90, "entry_deg": 90, "note_ru": "неподвижная при висении"}, {"group": "lift_RR", "pivot": [-2.3, -1.2, 2.6], "axis": [0, 0, 1], "hover_deg": 0, "transition_deg": 0, "cruise_deg": 90, "stowed_deg": 90, "entry_deg": 90, "note_ru": "неподвижная при висении"}, {"group": "fold_L", "pivot": [-6.5, -0.1, -7.6], "axis": [1, 0, 0], "hover_deg": 0, "transition_deg": 0, "cruise_deg": 0, "stowed_deg": 90, "entry_deg": 60, "note_ru": "вверх, киль на входе"}, {"group": "fold_R", "pivot": [-6.5, -0.1, 7.6], "axis": [-1, 0, 0], "hover_deg": 0, "transition_deg": 0, "cruise_deg": 0, "stowed_deg": 90, "entry_deg": 60, "note_ru": "вверх, киль на входе"}, {"group": "tvc_L", "pivot": [-8.4, 0.2, -1.6], "axis": [0, 0, 1], "hover_deg": -15, "transition_deg": -8, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": -15, "max_deg": 15}, {"group": "tvc_R", "pivot": [-8.4, 0.2, 1.6], "axis": [0, 0, 1], "hover_deg": -15, "transition_deg": -8, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "min_deg": -15, "max_deg": 15}, {"group": "gear_N", "pivot": [6.5, -1.4, 0], "axis": [0, 0, 1], "hover_deg": 0, "transition_deg": 0, "cruise_deg": 90, "stowed_deg": 0, "entry_deg": 90}, {"group": "gear_L", "pivot": [-5, -1.4, -3.2], "axis": [0, 0, 1], "hover_deg": 0, "transition_deg": 0, "cruise_deg": 90, "stowed_deg": 0, "entry_deg": 90}, {"group": "gear_R", "pivot": [-5, -1.4, 3.2], "axis": [0, 0, 1], "hover_deg": 0, "transition_deg": 0, "cruise_deg": 90, "stowed_deg": 0, "entry_deg": 90}], "thrusters": [{"id": "main_L", "group": "tvc_L", "origin": [-9.5, 0.2, -1.6], "dir": [-1, 0, 0], "thrust_MN": 0.3, "vector_cone_deg": 15}, {"id": "main_R", "group": "tvc_R", "origin": [-9.5, 0.2, 1.6], "dir": [-1, 0, 0], "thrust_MN": 0.3, "vector_cone_deg": 15}, {"id": "lift_FL", "group": "lift_FL", "origin": [3, -1.9, -2.6], "dir": [0, -1, 0], "thrust_MN": 0.3, "vector_cone_deg": 10}, {"id": "lift_FR", "group": "lift_FR", "origin": [3, -1.9, 2.6], "dir": [0, -1, 0], "thrust_MN": 0.3, "vector_cone_deg": 10}, {"id": "lift_RL", "group": "lift_RL", "origin": [-3, -1.9, -2.6], "dir": [0, -1, 0], "thrust_MN": 0.3, "vector_cone_deg": 0}, {"id": "lift_RR", "group": "lift_RR", "origin": [-3, -1.9, 2.6], "dir": [0, -1, 0], "thrust_MN": 0.3, "vector_cone_deg": 0}]}}, {"id": "Т3А", "name_ru": "«Иней»", "tagline_ru": "Тёмный кристалл-трапеция, который дышит аргоном: один бак — и тяга, и холод кромок", "concept_ru": "Цельная трапеция 20,0 × 15,6 м: широкая лопатка носа, стреловидность 62°, плоское несущее днище, корма — монолитный блок двух поворотных маршевых чаш. Жидкий аргон (1,40 т/м³) из двух баков питает моторы и через пористый боразон носа и кромок испаряется в пограничный слой. Подъёмные чаши — в нишах днища за створками заподлицо. Концевые панели крыла складываются вверх и становятся килями. На входе ничего не выступает. Всего 4 агрегата и 10 подвижных частей.", "thermal_ru": "Пористый боразоно-циркониевый нос (R 1,2 м) и кромки (r 0,25 м, Λ 62°). Жидкий аргон проходит по капиллярам кристаллически перестроенного боразона: испарение (163 кДж/кг) и нагрев газа до ~1500 К (0,73 МДж/кг) снимают ~0,9 МДж/кг, а вдув утолщает пограничный слой (блокировка, принято ×1,5). В итоге поток на носу и кромках снижается на 55 %. Планирующий вход: нос 318 → 143 кВт/м², 1600 → 1310 К; кромка 281 → 126 кВт/м², 1550 → 1270 К. Баллистический: нос 765 → 344 кВт/м², 2000 → 1640 К; кромка 676 → 304 кВт/м², 1940 → 1590 К. Днище не охлаждается, оно из борид-циркониевой керамики: 279 кВт/м², 1550 К. Расход аргона: 0,75 т на планирующий вход и 0,26 т на баллистический, из основного бака. Если аргона нет совсем, керамика выдерживает и без охлаждения: ≤ 2000 К при допуске ZrB₂/HfB₂ ~2300 К.", "materials_ru": "Нос и кромки — пористый кубический нитрид бора (боразон) с перестроенной кристаллической структурой и капиллярами для аргона. Днище и корпус — композит ZrB₂/HfB₂–боразон под тёмным боразоно-циркониевым лаком. Оси поворота маршевых чаш и петли килей — кольца бериллиевой бронзы с боразонным покрытием. Чаши — сверхпроводящие катушки 12,1 Тл с теневым экраном 25 г/см². Иридий не применяется.", "ballistic_ru": "Аварийный вход днищем поперёк потока без подъёмной силы, γ −2°, 7,8 км/с. Cx ≈ 1,28, S 208 м², масса 45 т, β ≈ 169 кг/м². Пиковая перегрузка: V²·sinγ/(2e·g·H) ≈ 5,5 g, грудь–спина в креслах с поглотителем инерции. Пик нагрева при ρ ≈ 2,7·10⁻⁴ кг/м³ и V ≈ 6,6 км/с. Нос без охлаждения — 765 кВт/м² (2000 К), с вдувом аргона — 344 кВт/м² (1640 К). Аргона уходит 0,26 т, он отложен как неснижаемый резерв. Днищу выгодна широкая плоская форма: эффективный R ≈ 9 м, 1550 К. Устойчивость днищем вперёд дают маршевые чаши, откинутые на 0°: корма тяжёлая, ЦД позади ЦМ.", "hypersonic_ru": "Вход днищем при α ≈ 40°, β ≈ 407 кг/м². Плоская пластина даёт Cy 0,63 / Cx 0,53, качество ≈ 1,2; при α 25° — до ~2, но с бо́льшим нагревом. Боковое смещение ~±800 км. Крен и рыскание управляются разностным вдувом аргона по левой и правой кромке (асимметрия давления в носовой части) и малым отклонением маршевых струй (±5°) в разреженном слое. Кили в это время сложены в плоскость крыла, поэтому на входе ничего не торчит.", "hover_ru": "Висение на 4 агрегатах по 0,26 МН: маршевые повёрнуты на 90° вниз (x −8,6 м), подъёмные чаши выдвинуты (x +5,0 м) — плечи по тангажу почти равны. Т/В на Земле 1,77 при 60 т. Расход 69 кг/с, 60 с висения = 4,2 т аргона. Отказ одного маршевого: струя переводится на 11,5 км/с, тяга агрегата 0,34 МН (+30 % на 30–60 с). Крен компенсируется разной тягой подъёмных чаш (0,8 и 0,3 от маршевой), маршевые стоят на z ±1,2, близко к оси. Т/В 1,15 при 60 т и 1,54 при посадочных 45 т. Струя ~15 км/с разрушительна, поэтому выше 40 м — только над подготовленной площадкой.", "ttx": {"length_m": 20, "span_m": 15.6, "span_stowed_m": 13, "height_m": 3.4, "planform_area_m2": 208, "mtom_t": 60, "dry_t": 30, "payload_t": 10, "reaction_mass_t": 20, "T_lift_max_K": 1310, "T_ball_max_K": 1640, "n_ball_g": 5.5, "beta_lift_kgm2": 407, "beta_ball_kgm2": 169, "nose_R_m": 1.2, "heat_reduction_pct": 55, "ld_hypersonic": 1.2, "ld_subsonic": 4.5, "v_land_power_off_ms": 59, "tw_earth": 1.77, "tw_one_unit_out": 1.15, "thrust_total_MN": 1.04, "tvc_range_deg": 95, "units_total": 4, "moving_parts": 10}, "propulsion_ru": "Ионно-триггерные моторы: импульсный синтез в магнитной чаше, рабочая масса — аргон. Тяга агрегата 0,26 МН, мощность струи F·v/2 ≈ 1,95 ГВт при 15 км/с. Нужная площадь чаши при 58,3 МПа — всего 0,0045 м², то есть запас по полю 12,1 Тл огромный, форсаж 16 Тл не нужен. В пустоте струя 40 км/с, и выход на орбиту (Δv 9,3 км/с) требует 12,4 т аргона. 2 маршевые чаши поворачиваются на 0–95° (0 — марш, 90 — висение, 95 — торможение вперёд-вниз), УВТ ±5°. 2 подъёмные чаши выдвижные, без отклонения, но с регулировкой тяги.", "lift_units_ru": "Две неуправляемые подъёмные чаши Ø1,5 м в нишах днища: x +5,0, z ±2,0. Каждая сидит на поворотном рычаге: в полёте лежит в нише, а её днище служит створкой заподлицо с обшивкой. Для висения рычаг поворачивается на 90° вниз, и срез оказывается на 0,8 м ниже днища. Чаши управляются только тягой (дросселем), вектор не отклоняется. Шарниры и катушки двухобмоточные.", "wings_ru": "Неподвижное центральное крыло: корень 15,2 м, конец 8,8 м, Λ 62°, полуразмах 3,4 м. Складные концевые панели: 1,4 м, хорды 8,8→5,0. 0° — гиперзвук, планирование и вход: цельная трапеция. 40° — переход, панели работают как V-кили. 90° — висение и ангар: кили, размах 13,0 м. Удлинение 1,17, дозвуковое качество ≈ 4,5. Без тяги машина садится на 59 м/с.", "layout_ru": "Нос: пористый колпак и фотонная полоса датчиков по кромке лопатки. x +5…+8 — виртуальный кокпит на 2 места без окон (экраны, аналоговые органы резерва). x −2…+5 — салон: 12 кресел в 3 ряда по 4, все с поглотителем инерции. Слева люк. Под салоном ниши подъёмных чаш и передней опоры. x −6…−2 — 2 бака аргона по 7,2 м³ с перекрёстной подачей, криокулеры. x −8…−6 — ионные заряды и питание. Корма — 2 маршевые чаши на поворотных кольцах. Над салоном грузовой отсек на 10 т, крышка сверху для магнитного толкателя.", "mass_table_ru": "Корпус с теплозащитой — 9,5; крыло и кили — 2,5; маршевые чаши с катушками и поворотом — 4,0; подъёмные чаши с рычагами — 2,4; ионные заряды и питание — 3,0; кабина, кресла, жизнеобеспечение, O₂ на 14 — 4,0; фотоника и аналоговый резерв — 1,0; шасси — 1,6; баки — 1,2; криокулеры — 0,8. Сухая масса 30,0 т, нагрузка 10,0 т. Аргон 20,0 т: выход на орбиту 12,4, висение 4,2, охлаждение 0,75 + резерв баллистического спуска 0,26, запас 2,4. Взлётная масса 60,0 т.", "emergencies": [{"regime_ru": "Планирующий вход", "failure_ru": "Отказ подачи аргона к одной кромке", "action_ru": "Перекрёстная подача из второго бака через второй инжектор; при полном отказе — вход с α 45°", "reserve_ru": "Без охлаждения кромка 1550 К при допуске керамики ~2300 К"}, {"regime_ru": "Баллистический спуск", "failure_ru": "Потеря управления или ориентации на гиперзвуке", "action_ru": "Разворот днищем поперёк потока, γ −2°, вдув на нос из резерва 0,26 т", "reserve_ru": "5,5 g, нос 1640 К; без аргона 2000 К — всё ещё в допуске"}, {"regime_ru": "Висение", "failure_ru": "Отказ одного маршевого агрегата", "action_ru": "Струя 11,5 км/с на 30–60 с, крен парируется дросселем подъёмных чаш", "reserve_ru": "Т/В 1,15 при 60 т, 1,54 при 45 т"}, {"regime_ru": "Висение", "failure_ru": "Срыв поля подъёмной чаши (тяга в ноль за 1 с)", "action_ru": "Вторую чашу симметрично глушат, маршевые переводят на 60° (тяга и подъёмная сила крыла), посадка с пробегом", "reserve_ru": "Две маршевые на форсаже 0,68 МН, посадка 40–59 м/с"}, {"regime_ru": "Переход / марш", "failure_ru": "Заклинило поворот маршевой чаши", "action_ru": "Вторая обмотка привода; при заклинивании — механическая фиксация на 90° или 0° бронзовым кольцом", "reserve_ru": "0° — посадка по-самолётному, 90° — висение с подъёмными чашами"}, {"regime_ru": "Вход", "failure_ru": "Не выпускается подъёмная чаша или шасси", "action_ru": "Ручной аналоговый привод рычага; иначе посадка н : 0, "min_deg": -90, "max_deg": 0}], "thrusters": [{"id": "M_L", "group": "march_L", "origin": [-9.6, 0.2, -1.2], "dir": [-1, 0, 0], "thrust_MN": 0.26, "vector_cone_deg": 5}, {"id": "M_R", "group": "march_R", "origin": [-9.6, 0.2, 1.2], "dir": [-1, 0, 0], "thrust_MN": 0.26, "vector_cone_deg": 5}, {"id": "C_L", "group": "cup_L", "origin": [5, -2, -2], "dir": [0, -1, 0], "thrust_MN": 0.26, "vector_cone_deg": 0}, {"id": "C_R", "group": "cup_R", "origin": [5, -2, 2], "dir": [0, -1, 0], "thrust_MN": 0.26, "vector_cone_deg": 0}]}}, {"id": "Т3Б", "name_ru": "«Иней»", "tagline_ru": "Трапеция, которая потеет аргоном: одна рабочая масса и для тяги, и для холода", "concept_ru": "Низкое плоское тело-трапеция 19,6 × 12,4 м (крылья раскрыты 17,6 м) с затупленным носом R 1,6 м и стреловидными 62° кромками. Пористый боразон носа и кромок питается жидким аргоном из бака рабочей массы: испарение и вдув газа в пограничный слой снижают тепловой поток примерно на 45 %. Два маршевых мотора с УВТ ±15° стоят в корме. Четыре подъёмные чаши лежат ромбом вокруг ЦМ за створками днища заподлицо и выдвигаются только для висения. Без окон: виртуальный кокпит и фотонная полоса датчиков по кромке носа.", "thermal_ru": "Пористая обшивка из боразона и ZrB₂/HfB₂ на носу (≈5 м²) и передних кромках (≈10 м²). Жидкий Ar (87 K) подаётся под давлением, испаряется в порах (161 кДж/кг) и греется до ≈1800 K. Итого ≈1,05 МДж/кг, а вдув даёт блокировку с параметром B≈2: q/q₀ = ln(1+B)/B = 0,55. Поток снижается на 45 %. Планирующий вход: нос 0,31 МВт/м² → 1595 K без охлаждения, с охлаждением ≈1370 K. Расход ≈0,45 кг/с, на весь вход ≈0,2 т Ar. Баллистический вход: 0,64 МВт/м² → 1905 K без охлаждения, с охлаждением ≈1640 K. Расход ≈0,95 кг/с, нужно ≈0,07 т Ar. Неприкосновенный запас Ar на охлаждение 0,5 т в отдельном отсеке бака. Остальное днище работает радиационно при ≤1450 K (лак боразон-цирконий, ε 0,85).", "materials_ru": "Нос и кромки: пористый боразон с кристаллически перестроенной структурой, каркас ZrB₂–SiC. Днище: плиты HfB₂/ZrB₂ под боразоно-циркониевым лаком. Силовой каркас: композит боразон/борное волокно. Кольца чаш и шарниры крыльев: бериллиевая бронза с боразонным покрытием. Иридий не применяется.", "ballistic_ru": "Аварийный вход днищем поперёк потока без подъёмной силы: CD≈1,9, S≈170 м², масса на входе 50 т, β≈155 кг/м², γ −2°. Пиковая перегрузка n = V²·sinγ/(2e·g·H) ≈ 5,5 g (лёжа в креслах с поглотителем инерции — допустимо). Пиковый нагрев при ρ≈1,1·10⁻⁵ кг/м³, V≈6,6 км/с: нос 0,64 МВт/м² → 1905 K, кромка 0,48 МВт/м² → 1770 K. С вдувом аргона 1640/1520 K. Запаса Ar 0,5 т хватает в 7 раз. Без подачи Ar 1905 K остаётся ниже предела боридов (~2300 K).", "hypersonic_ru": "Вход на α≈40° плоским днищем: CL 0,63, CD 0,53, гиперзвуковое L/D≈1,2, на α 20° до ≈2. Управление креном и тангажем за счёт несимметричного вдува аргона по кромкам (±30 % расхода) и щитков-триммеров в корме. Крылья на входе отведены назад (стреловидность 70°) и лежат вдоль тела, ничего не торчит. Боковой манёвр ≈±600 км.", "hover_ru": "Висят только 4 подъёмные чаши по 0,215 МН (струя 15 км/с, расход 14,3 кг/с на чашу), Т/В на Земле = 1,46. Две передние чаши поворачиваются на ±10°, две задние неподвижны. Маршевые с УВТ ±15° дают тримминг. Отказ одной чаши: три оставшиеся переходят в аварийный режим 11,5 км/с, тяга ×1,30 → 0,84 МН, Т/В 1,43 на 30–60 с. Момент от потерянной чаши парируют задние маршевые, отклонённые вниз на 15°, и поворотные передние чаши.", "ttx": {"length_m": 19.6, "span_m": 17.6, "span_stowed_m": 13.4, "height_m": 3.3, "planform_area_m2": 170, "mtom_t": 60, "dry_t": 31.5, "payload_t": 10, "reaction_mass_t": 18.5, "T_lift_max_K": 1370, "T_ball_max_K": 1640, "n_ball_g": 5.5, "beta_lift_kgm2": 555, "beta_ball_kgm2": 155, "nose_R_m": 1.6, "heat_reduction_pct": 45, "ld_hypersonic": 1.2, "ld_subsonic": 4.5, "v_land_power_off_ms": 85, "tw_earth": 1.46, "tw_one_unit_out": 1.43, "thrust_total_MN": 1.36, "tvc_range_deg": 15, "units_total": 6, "moving_parts": 10}, "propulsion_ru": "Ионно-триггерные моторы: импульсный синтез в магнитной чаше (12,1 Тл, давление поля 58,3 МПа). Маршевые 2 × 0,25 МН с УВТ ±15°, в пустоте струя 30–100 км/с: при 60 км/с Δv ≈ 22 км/с на 18 т Ar. Подъёмные 4 × 0,215 МН, у грунта струя 15 км/с, мощность ≈1,6 ГВт на чашу. Суммарная тяга 1,36 МН. Теневой экран 25 г/см² между чашами и салоном. Форсаж 16 Тл запрещён, кроме аварии.", "lift_units_ru": "4 чаши ромбом вокруг ЦМ: передние x +3,2 / z ±2,4 (поворотные ±10°), задние x −3,6 / z ±3,4 (неподвижные). Каждая в нише днища за двустворчатой створкой заподлицо. На висении поворачивается на 90° вниз, срез на 0,4 м ниже днища. На входе, в крейсерском полёте и в ангаре убрана.", "wings_ru": "Внешние консоли 3,8 м, хорда 6,0→2,2 м, стреловидность передней кромки 50°, поворот вокруг вертикальной оси у корня. Висение и посадка 0° (размах 17,6 м, дозвуковое L/D 4,5), переход 15°, крейсер 35°, вход и ангар 70° (консоли вдоль борта, ширина 13,4 м).", "layout_ru": "Нос: фотонная полоса датчиков, кокпит на 2 (x +5…+7,5) с виртуальным обзором. Центр: салон на 12 кресел с поглотителем инерции (x −1…+5), под ним грузовой отсек 10 т с люком в днище. Вокруг ЦМ: ниши 4 подъёмных чаш. Бак Ar 13,2 м³ в двух половинах (лев/прав, перекрёстная подача) над чашами и за салоном; отсек 0,5 т — резерв охлаждения. Корма: ионные заряды, 2 маршевых мотора, криокулеры ×2.", "mass_table_ru": "Корпус+теплозащита 9,0; консоли 2,5; 6 моторов с катушками 7,5; кабина/кресла/жизнеобеспечение 4,0; баки 2,0; ионные заряды+энергетика 3,5; шасси 1,5; фотоника 1,5. Сухая 31,5 т + нагрузка 10 т (вкл. 14 чел.) + Ar 18,5 т (вкл. 0,5 т резерва охлаждения) = 60 т.", "emergencies": [{"regime_ru": "Висение", "failure_ru": "Отказ одной подъёмной чаши", "action_ru": "Три оставшиеся переходят на струю 11,5 км/с, маршевые отклоняются вниз на 15° и парируют момент, передние чаши поворачиваются", "reserve_ru": "Т/В 1,43 на 30–60 с — хватает на посадку"}, {"regime_ru": "Висение", "failure_ru": "Срыв поля в чаше (тяга ноль за 1 с)", дает с центром площади трапеции (7,8 м) — днищем вперёд аппарат устойчив и без подъёмной силы. Внешние консоли 3,1 м откидываются вверх в ангаре и на входе, в полёте раскрываются (размах 22 м). Всё, что выдвигается, на входе убрано заподлицо.", "thermal_ru": "Три слоя защиты. 1) Горячая конструкция: днище и кромки — силовая боразон-боридная (ZrB₂/HfB₂) керамика с кристаллически перестроенной структурой, под боразоно-циркониевым лаком, рабочая T до 2100 K. 2) Магнитный щит: катушки подъёмных чаш (12 Тл) включаются на пике нагрева и отодвигают ударную волну от днища; оценка — поток −38 % (×0,62). 3) Аргоновый вдув через пористые носовые плитки — только аварийный резерв на баллистике, ещё −30 %. Итог на баллистике: 442 → 274 → 192 кВт/м², T 1740 → 1544 → 1412 K (снижение −57 %).", "materials_ru": "Корпус и днище — боразон-боридные композиты ZrB₂/HfB₂ с кристаллически перестроенной структурой, лак боразоно-циркониевый (тёмный, ε 0,85). Шарниры консолей и оси маршевых чаш — кольца бериллиевой бронзы с боразонным покрытием. Катушки — сверхпроводник в криоконтуре, двойные обмотки. Иридий не применяется.", "ballistic_ru": "Аварийный вход днищем без подъёмной силы, 7,8 км/с, γ −2°, Cd 1,25, масса на входе 48 т: β 188 кг/м², пиковая перегрузка 5,5 g (лежа, кресла с поглотителем инерции). Пик нагрева: ρ 3,0·10⁻⁴ кг/м³, V 6,6 км/с, эффективный R днища 4 м → q 442 кВт/м², T 1740 K. С магнитным щитом — 274 кВт/м², 1544 K; с аргоновым вдувом в носу — 192 кВт/м², 1412 K. Запас до предела керамики ≥ 360 K даже без щита.", "hypersonic_ru": "Планирующий вход днищем, α ≈ 40°, β 247 кг/м², L/D гиперзвук 1,6 (консоли сложены вверх — работают как кили). Нос R 1,2 м: 478 кВт/м², 1774 K, со щитом — 1575 K; передняя кромка Λ 62°, R 0,15 м: 545 кВт/м², 1834 K, со щитом — 1628 K. Управление: щитки на задней кромке плюс дифференциальная сила поля щита (смещение ударной волны) по крену.", "hover_ru": "Висение: маршевые чаши повёрнуты на 90–95° вниз (x −6,7 м), подъёмные чаши выдвинуты из днища (x +9,2 м); моменты уравновешены: 0,52 МН·6,7 м = 0,38 МН·9,2 м. Т/В на Земле 1,53 (0,90 МН при 0,589 МН веса). Отказ одного маршевого: 1,09 на штатной струе, 1,29 на аварийной (11,5 км/с, 30–60 с); после балансировки по крену — 1,12. Тангаж и рысканье — поворотом маршевых чаш ±8° и дросселированием подъёмных.", "ttx": {"length_m": 20, "span_m": 22, "span_stowed_m": 15.8, "height_m": 5.2, "planform_area_m2": 204, "mtom_t": 60, "dry_t": 38, "payload_t": 10, "reaction_mass_t": 12, "T_lift_max_K": 1834, "T_ball_max_K": 1740, "n_ball_g": 5.5, "beta_lift_kgm2": 247, "beta_ball_kgm2": 188, "nose_R_m": 1.2, "heat_reduction_pct": 57, "ld_hypersonic": 1.6, "ld_subsonic": 4.2, "v_land_power_off_ms": 78, "tw_earth": 1.53, "tw_one_unit_out": 1.12, "thrust_total_MN": 0.9, "tvc_range_deg": 95, "units_total": 4, "moving_parts": 11}, "propulsion_ru": "Четыре ионно-триггерных импульсных мотора с магнитными чашами, катушки 12,1 Тл (форсаж 16 Тл — риск срыва поля). 2 маршевых по 0,26 МН, поворот 0–95° (назад — марш, вниз — висение, вперёд-вниз — торможение), конус УВТ ±8°. 2 подъёмных по 0,19 МН, неуправляемые, выдвижные. Струя у грунта 15 км/с: мощность 1,95 ГВт на маршевый; площадь горловины по пределу B²/(2μ0) — всего 0,0045 м², то есть запас по давлению поля огромный. В пустоте струя 30–100 км/с. Рабочая масса — жидкий аргон 12 т (8,6 м³) в 2 баках с перекрёстной подачей; χ = 0,1 %, теневой экран 25 г/см² между чашами и салоном.", "lift_units_ru": "Две подъёмные чаши в нишах днища впереди ЦМ (x +9,2, z ±2,2). Утоплены за двумя створками, которые закрываются заподлицо с днищем. Выдвигаются на 0,7 м только для висения, на входе служат катушками магнитного щита. Неуправляемые: тяга регулируется только дросселем.", "wings_ru": "Корпус-трапеция и есть крыло (Λ передней кромки 62°). Внешние консоли: корень 3,0 м, конец 1,6 м, размах 3,1 м, шарниры у кормы. В полёте раскрыты (размах 22 м, дозвуковое L/D 4,2). На входе подняты на 90° как кили — это гиперзвуковая устойчивость по курсу; в ангаре тоже подняты (ширина 15,8 м).", "layout_ru": "Нос: виртуальный кокпит на 2 места, без окон: экраны и фотонная полоса датчиков по носовой грани. Середина (x 0…+6): салон на 12 кресел с поглотителем инерции, под полом аварийный O₂ на 14 человек. Под салоном и позади ЦМ — грузовой отсек на 10 т с люком в днище. Корма (x −3…−7,5): 2 бака аргона, криокулеры и теневой экран; по бортам кормы — оси маршевых чаш. Шасси трёхопорное, убирается в днище.", "mass_table_ru": "Конструкция и теплозащита — 17 т. 4 чаши с катушками и инжекторами — 9 т. Криогеника и экран — 4 т. Кокпит, кресла, жизнеобеспечение — 4 т. Шасси и приводы — 2 т. Резервы — 2 т. Сухая масса 38 т + груз 10 т + аргон 12 т = 60 т взлётная. Масса на входе 48 т.", "emergencies": [{"regime_ru": "Висение", "failure_ru": "Отказ маршевой чаши", "action_ru": "Оставшиеся чаши переходят на аварийную струю 11,5 км/с; подъёмная чаша с борта отказа +, с противоположного −, исправный маршевый уходит на +8° по крену; вертикальная посадка с ходом", "reserve_ru": "Т/В 1,12 в течение 40 с"}, {"regime_ru": "Висение", "failure_ru": "Срыв поля в подъёмной чаше (тяга ноль за 1 с)", "action_ru": "Маршевые на 60°: переход к посадке с пробегом на раскрытых консолях", "reserve_ru": "v посадки 78 м/с, пробег на шасси"}, {"regime_ru": "Гиперзвук", "failure_ru": "Отказ магнитного щита", "action_ru": "Горячая конструкция держит без щита; α увеличить до 45°", "reserve_ru": "T кромки 1834 K при пределе 2100 K"}, {"regime_ru": "Баллистика", "failure_ru": "Потеря управления по подъёмной силе", "action_ru": "Вход днищем (ЦМ у центра площади), щит плюс аргоновый вдув в носу", "reserve_ru": "5,5 g; 1412 K при пределе 2100 K"}, {"regime_ru": "Марш/орбита", "failure_ru": "Течь бака аргона", "action_ru": "Перекрёстная подача из второго бака, второй инжектор", "reserve_ru": "50 % рабочей массы, возврат к «Тантре»"}, {"regime_ru": "Все режимы", "failure_ru": "Отказ криокулера или привода", "action_ru": "Второй криокулер, двойные обмотки приводов, ansition_deg": 0, "cruise_deg": 0, "stowed_deg": -90, "entry_deg": -90}, {"group": "lift_L", "pivot": [9.2, -1.2, -2.2], "axis": [0, -1, 0], "hover_deg": 0.7, "transition_deg": 0.7, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0, "note_ru": "выдвижение, м"}, {"group": "lift_R", "pivot": [9.2, -1.2, 2.2], "axis": [0, -1, 0], "hover_deg": 0.7, "transition_deg": 0.7, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0}], "thrusters": [{"id": "M_L", "group": "main_L", "origin": [-7.6, 0.2, -3], "dir": [-1, 0, 0], "thrust_MN": 0.26, "vector_cone_deg": 8}, {"id": "M_R", "group": "main_R", "origin": [-7.6, 0.2, 3], "dir": [-1, 0, 0], "thrust_MN": 0.26, "vector_cone_deg": 8}, {"id": "L_L", "group": "lift_L", "origin": [9.2, -1.6, -2.2], "dir": [0, -1, 0], "thrust_MN": 0.19, "vector_cone_deg": 0}, {"id": "L_R", "group": "lift_R", "origin": [9.2, -1.6, 2.2], "dir": [0, -1, 0], "thrust_MN": 0.19, "vector_cone_deg": 0}]}}, {"id": "Т4Б", "name_ru": "Т4Б «Грань»", "tagline_ru": "Трапеция-несущий корпус: горячий боразон, магнитный щит, четыре скрытые чаши висения", "concept_ru": "Цельный несущий корпус-трапеция 20 × 16 м (в плане от лопаточного носа шириной 2,4 м к корме 16 м), плоское днище, верх — кристаллические грани. Консоли крыла (по 3 м) лежат на верхней палубе при входе и в ангаре, раскрываются на дозвуке до 22 м размаха. Две маршевые чаши с УВТ ±15° в корме, четыре подъёмные чаши выходят из днища на поворотных рычагах только для висения. На входе контур гладкий: створки заподлицо, консоли сложены.", "thermal_ru": "Три слоя: 1) горячая конструкция: боразон-ZrB2/HfB2 с перестроенной кристаллической структурой, днище и кромки держат до ~2000 K без абляции; 2) магнитный щит: носовой сверхпроводящий тор (общий криокулер с чашами) поднимает отход ударной волны, эффективный радиус ×2,2 → поток −33 %; 3) аргоновый вдув через пористый нос (только аварийно, баллистика): ещё −25 % на носу, расход ~36 кг за 120 с из основного бака. Баллистика: 546 → 276 кВт/м², T 1835 → 1547 K (−49 %). Планирующий: 480 → 323 кВт/м², T 1776 → 1610 K.", "materials_ru": "Каркас и днище — боразон-ZrB2/HfB2 композит, перестроенная кристаллическая структура; обшивка — тёмный боразоно-циркониевый лак (ε 0,85); кромки и нос — HfB2-боразон, пористый носовой сегмент для вдува; кольца приводов и шарниры консолей — бериллиевая бронза с боразоном; катушки чаш и щита — сверхпроводник в криооболочке; теневой экран чаш ~25 г/см². Иридий не применяется.", "ballistic_ru": "Аварийный вход днищем без подъёмной силы, γ −2°, 7,8 км/с, m 50 т, Cd 1,35, β 215 кг/м². Перегрузка пик ≈ 5,5 g (кресла с поглотителем инерции). Нагрев (Аллен–Эггерс, ρ 3,5·10⁻⁴ кг/м³, V 6,6 км/с, R 3 м): 546 кВт/м², 1835 K без защиты — в пределах боразона; с щитом и вдувом 276 кВт/м², 1547 K. Кромки (Λ 72°): 391 кВт/м², 1687 K. Стабилизация днищем — смещённый вперёд ЦМ и плоская форма.", "hypersonic_ru": "Планирующий вход α ≈ 40°, β 277 кг/м², L/D ≈ 1,6 (широкое плоское днище, стреловидность кромок 72°). Перегрузка ≤ 3,3 g. Управление: маршевые УВТ ±15° (тангаж/рысканье), щит — асимметричным полем даёт момент крена. Поперечная дальность — сотни км.", "hover_ru": "Висение на 4 подъёмных чашах по 0,40 МН (струя у грунта 15 км/с, 3,0 ГВт на чашу, F/S ≪ 58 МПа): Т/В 2,72 при 60 т. Расход при Т = В 39 кг/с (2,4 т/мин). Передние две чаши управляемые (±10°), задние неподвижные — управление дросселем. Маршевые с УВТ — подталкивание при переходе.", "ttx": {"length_m": 20, "span_m": 22, "span_stowed_m": 16, "height_m": 4.2, "planform_area_m2": 175, "mtom_t": 60, "dry_t": 38, "payload_t": 10, "reaction_mass_t": 12, "T_lift_max_K": 1610, "T_ball_max_K": 1547, "n_ball_g": 5.5, "beta_lift_kgm2": 277, "beta_ball_kgm2": 215, "nose_R_m": 3, "heat_reduction_pct": 49, "ld_hypersonic": 1.6, "ld_subsonic": 4.5, "v_land_power_off_ms": 56, "tw_earth": 2.72, "tw_one_unit_out": 1.77, "thrust_total_MN": 2.32, "tvc_range_deg": 15, "units_total": 6, "moving_parts": 16}, "propulsion_ru": "6 ионно-триггерных чаш, аргон 12 т (8,6 м³ в 2 баках с перекрёстной подачей). Маршевые 2 × 0,36 МН, УВТ ±15°, струя в пустоте 50 км/с: Δv 9,6 км/с требует ~10,5 т аргона, остаток 1,5 т — висение ~40 с. Подъёмные 4 × 0,40 МН, 15 км/с у грунта. Всего 2,32 МН. Форсаж 16 Тл не нужен.", "lift_units_ru": "Четыре подъёмные чаши в днище: передняя пара x +5 м, z ±3,2 м (управляемые ±10°); задняя пара x −5 м, z ±5,0 м (неподвижные). В полёте — в нишах за створками заподлицо, рычаг поворачивает чашу на 90° вниз только для висения. При отказе одной: диагональная пара на 11,5 км/с, Т/В 1,77.", "wings_ru": "Консоли по 3 м (хорды 7/3 м, стреловидность 60°) на бортовых кромках. Вход, ангар, гиперзвук — лежат на верхней палубе (165°), размах 16 м. Дозвук, висение, посадка без тяги — раскрыты в плоскость днища, размах 22 м, L/D 4,5.", "layout_ru": "Нос: тор магнитного щита и пористый сегмент вдува. x +3…+7: виртуальный кокпит 2 места (фотонная полоса датчиков по кромке, экраны, без окон). x −3…+3: салон 12 кресел с поглотителем инерции, люк сверху. По бокам салона — 2 бака аргона; за салоном — ионные заряды. Корма: маршевые, 2 криокулера. Шасси: передняя опора + 2 основные.", "mass_table_ru": "Корпус и ТЗ 14,0 т; 6 чаш с катушками и экранами 9,5 т; щит и криокулеры 2,5 т; консоли и приводы 2,2 т; шасси 1,6 т; кокпит/салон/жизнеобеспечение (O₂ на 14) 4,2 т; системы 4,0 т → сухая 38 т. Люди и грузы 10 т; аргон 12 т. Взлётная 60 т.", "emergencies": [{"regime_ru": "Баллистический спуск", "failure_ru": "Потеря подъёмной силы/управления", "action_ru": "Вход днищем, щит на максимум, аргоновый вдув в нос", "reserve_ru": "T 1547 K при пределе ~2000 K; 5,5 g; вдув 36 кг из 12 т"}, {"regime_ru": "Гиперзвук", "failure_ru": "Отказ магнитного щита", "action_ru": "Горячая конструкция держит без щита, α до 45°", "reserve_ru": "1776 K, кромки 1633 K — запас >200 K"}, {"regime_ru": "Гиперзвук", "failure_ru": "Отказ одной маршевой УВТ", "action_ru": "Вторая маршевая ±15° + асимметрия поля щита по крену", "reserve_ru": "Двойные обмотки приводов УВТ"}, , "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0}, {"group": "gearN", "pivot": [7, -1.3, 0], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0}, {"group": "gearL", "pivot": [-3, -1.3, -4], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0}, {"group": "gearR", "pivot": [-3, -1.3, 4], "axis": [0, 0, 1], "hover_deg": 90, "transition_deg": 90, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0}], "thrusters": [{"id": "mainL", "group": "main", "origin": [-10, 0.3, -2.2], "dir": [-1, 0, 0], "thrust_MN": 0.36, "vector_cone_deg": 15}, {"id": "mainR", "group": "main", "origin": [-10, 0.3, 2.2], "dir": [-1, 0, 0], "thrust_MN": 0.36, "vector_cone_deg": 15}, {"id": "cupFL", "group": "cupFL", "origin": [5, -2.4, -3.2], "dir": [0, -1, 0], "thrust_MN": 0.4, "vector_cone_deg": 10}, {"id": "cupFR", "group": "cupFR", "origin": [5, -2.4, 3.2], "dir": [0, -1, 0], "thrust_MN": 0.4, "vector_cone_deg": 10}, {"id": "cupRL", "group": "cupRL", "origin": [-5, -2.4, -5], "dir": [0, -1, 0], "thrust_MN": 0.4, "vector_cone_deg": 0}, {"id": "cupRR", "group": "cupRR", "origin": [-5, -2.4, 5], "dir": [0, -1, 0], "thrust_MN": 0.4, "vector_cone_deg": 0}]}}, {"id": "Т1Б-Н", "name_ru": "«Грань-Н»", "tagline_ru": "Горячий кристалл с притуплёнными кромками: трапеция из боразона и боридов, 2 маршевых с УВТ ±15° и 6 скрытых подъёмных чаш", "concept_ru": "Цельное тело-трапеция длиной 20,0 м: лопаточный нос (горизонтальный радиус 1,0 м, вертикальный 0,45 м, эквивалентный 0,62 м), грани корпуса Λ 74° с кромками R 4 см переходят в несущие плоскости Λ 55° с кромкой R 17 см, плоское днище 168 м². Теплозащита пассивная: горячая оболочка из боразона и борных керамик излучает тепло. Гиперзвуковое качество 2,1 при α 20°. Аварийный баллистический вход идёт днищем поперёк потока (эффективный радиус 6 м). Висение — 6 чаш по 200 кН в два ряда по три вокруг ЦМ, скрыты за створками заподлицо. Концевые части крыла 1,3 м работают как килевые плоскости (60°) и складываются на 90° для ангара. Изменения: Нос: R 0,15 м → лопаточный, R_гор 1,0 / R_верт 0,45 м (R_экв 0,62 м); по Саттону–Грейвсу (7 км/с, ρ 8,3·10⁻⁵): 1,40 → 0,69 МВт/м², 2320 K (в исходном тексте 2150 K) → 1945 K; Кромка крыла Λ 55°: R 5 → 17 см, толщина крыла 0,35 → 0,40 м, концевых частей 0,15 → 0,34 м; 1,25 → 0,68 МВт/м², 2255 K (в тексте 2100 K) → 1935 K; Кромки граней Λ 74°: R 3 → 4 см; 1930 → 1860 K; Запас до предела боридов с боразоном (2400 K): ~250 K по тексту (по единой формуле ~80 K) → не меньше 455 K; Гиперзвуковое качество α 20°: 2,4 → 2,1 (α 40°: 1,15 → 1,12); боковая дальность ~2000 → ~1700 км; Подъёмные чаши: 4 × 330 кН (квадрат) → 6 × 200 кН (два ряда по три, центральная симметрия); мощность 2,5 → 1,5 ГВт на чашу; масса чаш 5,2 → 5,1 т, створки +0,2 т; Т/В на Земле: 2,24 → 2,02; Т/В при отказе одной чаши на номинале: 1,12 (диагональная пара; 1,46 только на форсаже 30–60 с) → 1,34 на номинале, 4 чаши, полный баланс моментов, без форсажа и ограничения по времени; Масса: сухая 30,0 → 30,7 т (+0,7 нос/кромки, −0,1 чаши, +0,2 створки, −0,1 кресла без гасителя); взлётная 60,0 → 60,7 т; на входе 48 → 48,7 т; β планирования 518 → 513 кг/м²; β баллистики 220 → 223 кг/м²; Баллистический вход днищем: 1690 → 1685 K, 5,5 → 5,5 g — не хуже; Кресла: «с поглотителем инерции» → полулёжа с ложементами по телу (гасителя инерции в лэндере нет), 5,5 g грудь–спина кратко допустимо; Посадка без тяги: 65 → 66 м/с, L/D 4,5; Моторов 6 → 8, подвижных частей 17 → 21; Ангар: 20,0 × 15,6 × 3,4 м → без изменений (предел 20,2 × 16,0 × 5,4)", "thermal_ru": "Пассивная горячая конструкция, ε 0,85. Расчёт по Саттону–Грейвсу для пика планирующего входа (V 7 км/с, ρ 8,3·10⁻⁵ кг/м³): нос R_экв 0,62 м — 0,69 МВт/м², T ≈ 1945 K; кромка крыла R 0,17 м, Λ 55° (×cos^1,2Λ) — 0,68 МВт/м², ≈ 1935 K; кромки граней R 4 см, Λ 74° — 0,58 МВт/м², ≈ 1860 K. Днище — ниже 1500 K. Предел боридов циркония/гафния с боразоном 2400–2500 K, запас не меньше 455 K. Стреловидность срезает поток на кромке крыла на 49 % (Λ 55°) и на гранях на 79 % (Λ 74°) против прямой кромки; баллистический вход днищем снижает поток на 72 % против входа носом (0,39 против 1,40 МВт/м²).", "materials_ru": "Нос — лопаточный монолит из боридов гафния/циркония с боразоновой армирующей фазой, мелкозернистая «кристаллически перестроенная» структура (рабочая T 2400 K). Кромки крыла и концевых частей — трубчатые монолиты того же состава R 17 см. Обшивка — панели из композита боразона и ZrB₂ толщиной 6–10 мм на горячем боразоновом каркасе, покрыты тёмным боразоно-циркониевым лаком (ε 0,85). Внутренний барьер — пористая борная керамика 40 мм, кабина не выше 320 K. Шарниры складывания, кольца приводов и УВТ — бериллиевая бронза с боразонным покрытием.", "ballistic_ru": "Аварийный баллистический вход: аппарат разворачивается днищем поперёк потока (α 90°, CD 1,3), β 223 кг/м², γ −2°, вход на 7,8 км/с. Пиковая перегрузка ≈ V²·sinγ/(2e·g·H) = 5,5 g, грудь–спина: кресла полулёжа с ложементами по телу переносят её кратко без вреда (гасителя инерции в лэндере нет). Нагрев: ρ ≈ β·sinγ/(3H), V ≈ 6,6 км/с, днище R_eff 6 м → 0,39 МВт/м², T ≈ 1685 K. Носом вперёд было бы 1,40 МВт/м² и ~2320 K, поэтому режим «днищем» обязателен. Удерживают его аналоговый резервный автомат и элевоны. Кромки в тени, ниже 1500 K.", "hypersonic_ru": "Притуплённые нос и кромки дают L/D ≈ 2,1 при α 20° и 1,12 при α 40° (участок пикового нагрева); прирост сопротивления от притупления ≈ 2,4 м² (CD·S). Боковая дальность — около 1700 км. Путевая устойчивость — от концевых плоскостей, поднятых на 60°. Тангаж и крен — двумя элевонами и УВТ маршевых ±15°. Ничего не выступает: створки чаш закрыты заподлицо, шасси убрано.", "hover_ru": "6 подъёмных чаш по 200 кН: два ряда по три в точках x ±3,0 м, z −2,6 / 0 / +2,6 м от ЦМ, струя вниз на 15 км/с. Т/В на Земле 2,02 при 60,7 т. При отказе любой чаши автомат гасит центрально-симметричную ей чашу; остаются четыре, попарно симметричные относительно ЦМ, — баланс моментов по тангажу и крену с полной управляемостью, Т/В 1,34 на НОМИНАЛЬНОЙ тяге (12,1 Тл, без форсажа). Расход аргона на висении 40 кг/с; 6 т аргона после выхода на орбиту дают ~150 с висения. Маршевые в висении не участвуют.", "ttx": {"length_m": 20, "span_m": 18, "span_stowed_m": 15.6, "height_m": 3.4, "planform_area_m2": 168, "mtom_t": 60.7, "dry_t": 30.7, "payload_t": 10, "reaction_mass_t": 18, "T_lift_max_K": 1945, "T_ball_max_K": 1685, "n_ball_g": 5.5, "beta_lift_kgm2": 513, "beta_ball_kgm2": 223, "nose_R_m": 0.62, "heat_reduction_pct": 49, "ld_hypersonic": 2.1, "ld_subsonic": 4.5, "v_land_power_off_ms": 66, "tw_earth": 2.02, "tw_one_unit_out": 1.34, "thrust_total_MN": 2.1, "tvc_range_deg": 15, "units_total": 8, "moving_parts": 21, "nose_R_h_m": 1.0, "nose_R_v_m": 0.45, "wing_le_R_m": 0.17, "facet_le_R_m": 0.04, "T_edge_max_K": 1935, "T_margin_K": 455}, "propulsion_ru": "Всего 8 ионно-триггерных моторов, импульсный синтез в магнитной чаше со сверхпроводящими катушками (12,1 Тл, магнитное давление B²/2μ0 = 58,3 МПа). Маршевые: 2 × 450 кН в корме, УВТ ±15°, в пустоте 30–60 км/с; выход на орбиту (Δv 9,3 км/с при 40 км/с) требует ~12 т аргона. Подъёмные: 6 × 200 кН; минимальный срез по F ≤ B²/(2μ0)·S — 34 см², принят 70 см² (запас ×2 по удержанию потока импульса: 13,3 кг/с × 15 км/с); мощность 1,5 ГВт на чашу (F = 2P/v); чаша Ø 0,96 м, длина 0,95 м. Рабочее тело — жидкий аргон 18 т (12,9 м³) из запаса «Тантры», ионные заряды 2 т. Теневой экран 25 г/см² между чашами и салоном.", "lift_units_ru": "6 подъёмных чаш в два ряда по три лежат в корпусе плашмя, каждая за створкой заподлицо с днищем. Для висения чаша поворачивается на 90° в вертикаль, срез выходит на 0,8 м под днище. Три передние качаются ±8°, задние неподвижны, баланс — дросселированием. Расстановка центрально-симметрична относительно ЦМ: при отказе любой чаши гасится противолежащая, четыре оставшиеся держат и тягу, и моменты на номинале. На входе и в крейсере чаши убраны.", "wings_ru": "Несущие плоскости Λ 55°, корневая хорда 10,8 м, размах 18,0 м, толщина 0,40 м, передняя кромка — боридный монолит R 17 см. Концевые части по 1,3 м (толщина 0,34 м, та же кромка) складываются вверх: 0° — дозвук и посадка (L/D 4,5), 60° — гиперзвук и вход (кили), 90° — ангар (размах 15,6 м). Задняя кромка — по одному элевону на сторону.", "layout_ru": "Лопаточный нос (x +11…+6): датчики фотонной полосы, за ними виртуальный кокпит на 2 места (x +6…+4,5), без окон, экраны. Салон на 12 кресел полулёжа с ложементами по телу (гасителя инерции нет) (x +4,5…−1), шлюз сбоку. Под салоном теневой экран, вокруг ЦМ — 6 подъёмных чаш в два ряда. Баки аргона (2 × 6,45 м³, перекрёстная подача) — x −1…−5. Генераторы, криокулеры, ионные заряды — x −5…−7,5. Маршевые — корма. Грузовой отсек 10 т — x 0…−5 над баками. Шасси трёхопорное: ПО под кокпитом, две основные — у x −4.", "mass_table_ru": "Корпус-каркас и горячая обшивка — 11,0 т; лопаточный нос и утолщённые кромки — +0,7 т. Подъёмные чаши 6 × 0,85 = 5,1 т (было 4 × 1,3 = 5,2 т); две дополнительные створки с приводами — +0,2 т. Маршевые 2 × 1,8 = 3,6 т. Энергетика, катушки, криокулеры — 4,0 т. Теневой экран — 2,5 т. Кабина, кресла полулёжа, системы — 2,1 т. Шасси — 1,5 т. Сухая масса 30,7 т. Нагрузка 10 т. Аргон 18 т, ионные заряды 2 т. Взлётная 60,7 т. Масса на входе ~48,7 т.", "emergencies": [{"regime_ru": "Висение", "failure_ru": "Отказ одной подъёмной чаши", "action_ru": "Автомат гасит центрально-симметричную чашу, четыре оставшиеся остаются на номинальной тяге, затем посадка", "reserve_ru": "Т/В 1,34 на номинале без ограничения по времени (кроме запаса аргона)"}, {"regime_ru": "Висение", "failure_ru": "Срыв поля в чаше (тяга ноль за ~1 с)", "action_ru": "Автомат за 0,3 с гасит противолежащую чашу, четыре оставшиеся добирают тягу, второй инжектор перезапускает чашу", "reserve_ru": "Высота падает меньше чем на 3 м с 30 м"}, {"regime_ru": "Выход на орбиту", "failure_ru": "Отказ маршевого", "action_ru": "Второй маршевый через УВТ 15° держит ось, переход на 16 Тл кратко; иначе — возврат планированием", "reserve_ru": "Т/В по одному маршевому ~0,76, после 40 км — достаточно"}, {"regime_ru": "Гиперзвук", "failure_ru": "Отказ привода элевона или складывания", "action_ru": "Резервная обмотка привода; крен — дифференциальным УВТ маршевых", "reserve_ru": "Двойные обмотки, 2 маршевых"}, {"regime_ru": "Вход", "failure_ru": "Потеря подъёмной силы или управления", "action_ru": "Баллистический вход днищем, α 90°, ручной аналоговый резерв", "reserve_ru": "5,5 g полулёжа, днище 1685 K — запас ~700 K до предела"}, {"regime_ru": "Посадка", "failure_ru": "Отказ всех чаш", "action_ru": "Планирующая посадка на шасси, концевые части на 0°", "reserve_ru": "Без тяги — 66 м/с, L/D 4,5"}, {"regime_ru": "Энергетика", "failure_ru": "Отказ криокулера или бака", "action_ru": "Второй криокулер, перекрёстная подача из 2 баков", "reserve_ru": "Полная тяга на одном баке"}, {"regime_ru": "Жизнеобеспечение", "failure_ru": "Разгерметизация", "action_ru": "Аварийный O₂ на 14 человек, спуск", "reserve_ru": "Запас O₂ на 14 человек"}], "hangar": {"fits": true, "stowed_bbox_m": [20, 15.6, 3.4], "growth_ru": "Запас: длина 0,2 м, ширина 0,4 м, высота 2,0 м до предела 20,2 × 16,0 × 5,4 м. Чаши и шасси убраны, концевые части на 90°. Лопаточный нос в пределах прежней длины 20,0 м."}, "pros_ru": ["Запас по нагреву носа и кромок не меньше 455 K на номинальном планирующем входе", "Гиперзвуковое качество 2,1, боковой манёвр ~1700 км", "Т/В 2,02, при отказе одной чаши — 1,34 на номинале, без форсажа", "Цельная кристаллическая форма, на входе ничего не выступает", "Запас по высоте ангара 2 м"], "cons_ru": ["Качество на гиперзвуке ниже, чем у острой «Грани» (2,1 против 2,4)", "8 моторов вместо 6, две лишние створки", "Баллистический вход допустим только днищем", "Струя чаш разрушительна для площадки"], "risks_ru": ["Термоудар в боридных кромках при циклах (смягчён большими радиусами)", "Удержание α 90° при баллистическом входе deg": -95, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0}, {"group": "lift_RR", "pivot": [-3, -0.75, 2.6], "axis": [0, 0, 1], "hover_deg": 0, "transition_deg": 0, "cruise_deg": -90, "stowed_deg": -90, "entry_deg": -90, "min_deg": -90, "max_deg": 0, "note_ru": "Неуправляемая"}, {"group": "door_RR", "pivot": [-3, -1.08, 3.2], "axis": [-1, 0, 0], "hover_deg": -95, "transition_deg": -95, "cruise_deg": 0, "stowed_deg": 0, "entry_deg": 0}], "thrusters": [{"id": "main_L", "group": "main_L", "origin": [-9.2, 0.2, -1.8], "dir": [-1, 0, 0], "thrust_MN": 0.45, "vector_cone_deg": 15}, {"id": "main_R", "group": "main_R", "origin": [-9.2, 0.2, 1.8], "dir": [-1, 0, 0], "thrust_MN": 0.45, "vector_cone_deg": 15}, {"id": "lift_FL", "group": "lift_FL", "origin": [3, -1.8, -2.6], "dir": [0, -1, 0], "thrust_MN": 0.2, "vector_cone_deg": 8}, {"id": "lift_FC", "group": "lift_FC", "origin": [3, -1.8, 0], "dir": [0, -1, 0], "thrust_MN": 0.2, "vector_cone_deg": 8}, {"id": "lift_FR", "group": "lift_FR", "origin": [3, -1.8, 2.6], "dir": [0, -1, 0], "thrust_MN": 0.2, "vector_cone_deg": 8}, {"id": "lift_RL", "group": "lift_RL", "origin": [-3, -1.8, -2.6], "dir": [0, -1, 0], "thrust_MN": 0.2, "vector_cone_deg": 0}, {"id": "lift_RC", "group": "lift_RC", "origin": [-3, -1.8, 0], "dir": [0, -1, 0], "thrust_MN": 0.2, "vector_cone_deg": 0}, {"id": "lift_RR", "group": "lift_RR", "origin": [-3, -1.8, 2.6], "dir": [0, -1, 0], "thrust_MN": 0.2, "vector_cone_deg": 0}], "nose": {"kind": "spatula", "R_h_m": 1.0, "R_v_m": 0.45, "R_eq_m": 0.62}}, "changes_ru": ["Нос: R 0,15 м → лопаточный, R_гор 1,0 / R_верт 0,45 м (R_экв 0,62 м); по Саттону–Грейвсу (7 км/с, ρ 8,3·10⁻⁵): 1,40 → 0,69 МВт/м², 2320 K (в исходном тексте 2150 K) → 1945 K", "Кромка крыла Λ 55°: R 5 → 17 см, толщина крыла 0,35 → 0,40 м, концевых частей 0,15 → 0,34 м; 1,25 → 0,68 МВт/м², 2255 K (в тексте 2100 K) → 1935 K", "Кромки граней Λ 74°: R 3 → 4 см; 1930 → 1860 K", "Запас до предела боридов с боразоном (2400 K): ~250 K по тексту (по единой формуле ~80 K) → не меньше 455 K", "Гиперзвуковое качество α 20°: 2,4 → 2,1 (α 40°: 1,15 → 1,12); боковая дальность ~2000 → ~1700 км", "Подъёмные чаши: 4 × 330 кН (квадрат) → 6 × 200 кН (два ряда по три, центральная симметрия); мощность 2,5 → 1,5 ГВт на чашу; масса чаш 5,2 → 5,1 т, створки +0,2 т", "Т/В на Земле: 2,24 → 2,02", "Т/В при отказе одной чаши на номинале: 1,12 (диагональная пара; 1,46 только на форсаже 30–60 с) → 1,34 на номинале, 4 чаши, полный баланс моментов, без форсажа и ограничения по времени", "Масса: сухая 30,0 → 30,7 т (+0,7 нос/кромки, −0,1 чаши, +0,2 створки, −0,1 кресла без гасителя); взлётная 60,0 → 60,7 т; на входе 48 → 48,7 т", "β планирования 518 → 513 кг/м²; β баллистики 220 → 223 кг/м²", "Баллистический вход днищем: 1690 → 1685 K, 5,5 → 5,5 g — не хуже", "Кресла: «с поглотителем инерции» → полулёжа с ложементами по телу (гасителя инерции в лэндере нет), 5,5 g грудь–спина кратко допустимо", "Посадка без тяги: 65 → 66 м/с, L/D 4,5", "Моторов 6 → 8, подвижных частей 17 → 21", "Ангар: 20,0 × 15,6 × 3,4 м → без изменений (предел 20,2 × 16,0 × 5,4)"]}, {"id": "Т1Б-Н2", "name_ru": "«Грань-Н2»", "tagline_ru": "Горячий кристалл с притуплёнными кромками: трапеция из боразона и боридов, 2 маршевых с УВТ ±15° и 6 мелких подъёмных чаш под двумя створками", "concept_ru": "Цельное тело-трапеция длиной 20,0 м: лопаточный нос (горизонтальный радиус 1,0 м, вертикальный 0,45 м, эквивалентный 0,62 м), грани корпуса Λ 74° с кромками R 4 см переходят в несущие плоскости Λ 55° с кромкой R 17 см, плоское днище 168 м². Теплозащита пассивная: горячая оболочка из боразона и борных керамик излучает тепло. Гиперзвуковое качество 2,1 при α 20°. Аварийный баллистический вход идёт днищем поперёк потока (эффективный радиус 6 м). Висение — 6 чаш по 200 кН в два ряда по три вокруг ЦМ, скрыты за створками заподлицо. Концевые части крыла 1,3 м работают как килевые плоскости (60°) и складываются на 90° для ангара. Изменения: Чаши: Ø0,96 × ~0,95 м → Ø0,84 × 0,34 м; выступ убранных чаш под днищем 0,23 (перед) / 0,13 м (зад) → внутри контура, зазор 0,04 м; Убирание: поворот каждой чаши на 90° → переворот рамы ряда на 180°; срез в висении 0,8 → 0,30 м под днищем; Расстановка по z: ±2,6 м (заходила в фаску и корень крыла) → ±1,5 м; Створки 6 → 2; приводы (6 чаш + 6 створок) 12 → 4; подвижных частей 21 → 13 (−8); Узел чаш 5,3 → 5,0 т; сухая 30,7 → 30,4 т; аргон 18 → 18,3 т; взлётная 60,7 т и на входе 48,7 т — прежние, поэтому β 513/223, нагрев 1945/1935 K, Т/В 2,02/1,34 сохранены; Земля: посадка висением → штатно на полосу планированием (без тяги 66 м/с); висение на Земле — резерв ~157 с (было ~150 с); Марс ~420 с, Луна ~950 с; Корма: нижний обвод −1,0 → −0,55 м; производная восстанавливающего момента у α 90°: −1,1 → −5,2 отн. ед./град (×4,7); центр давления 2,7 → 2,6 м позади ЦМ — пассивной балансировки нет; Новый режим ballistic_deg: концевые части 90°, элевоны −25°; Аварийный вдув аргона в пористый нос для баллистического спуска носом вперёд: ~3200 К без вдува → ≤ 2400 К с вдувом; резерв 0,5 т аргона, +2 детали (магистраль, клапан), +0,05 т", "thermal_ru": "Пассивная горячая конструкция, ε 0,85. Расчёт по Саттону–Грейвсу для пика планирующего входа (V 7 км/с, ρ 8,3·10⁻⁵ кг/м³): нос R_экв 0,62 м — 0,69 МВт/м², T ≈ 1945 K; кромка крыла R 0,17 м, Λ 55° (×cos^1,2Λ) — 0,68 МВт/м², ≈ 1935 K; кромки граней R 4 см, Λ 74° — 0,58 МВт/м², ≈ 1860 K. Днище — ниже 1500 K. Предел боридов циркония/гафния с боразоном 2400–2500 K, запас не меньше 455 K. Стреловидность срезает поток на кромке крыла на 49 % (Λ 55°) и на гранях на 79 % (Λ 74°) против прямой кромки; баллистический вход днищем снижает поток на 72 % против входа носом (0,39 против 1,40 МВт/м²).", "materials_ru": "Нос — лопаточный монолит из боридов гафния/циркония с боразоновой армирующей фазой, мелкозернистая «кристаллически перестроенная» структура (рабочая T 2400 K). Кромки крыла и концевых частей — трубчатые монолиты того же состава R 17 см. Обшивка — панели из композита боразона и ZrB₂ толщиной 6–10 мм на горячем боразоновом каркасе, покрыты тёмным боразоно-циркониевым лаком (ε 0,85). Внутренний барьер — пористая борная керамика 40 мм, кабина не выше 320 K. Шарниры складывания, кольца приводов и УВТ — бериллиевая бронза с боразонным покрытием.", "ballistic_ru": "Аварийный баллистический вход днищем (α 90°, CD 1,3), β 223 кг/м², 5,5 g грудь–спина, кресла полулёжа с ложементами (гасителя инерции нет). Днище ~1685 K. Поднятая корма (нижний обвод кормы −1,0 → −0,55 м на последних 4 м) делает днище выпуклым по длине: по ньютоновской оценке производная восстанавливающего момента у α 90° выросла в ~4,7 раза — аппарат устойчив по тангажу. Концевые части в баллистике — на 90°, элевоны вверх 25°. Балансировка сама не получается: центр давления на α 90° ~2,6 м позади ЦМ (на «Грани-Н» 2,7 м) — момент снимают элевоны и аналоговый автомат; полностью пассивная балансировка требует сдвига ЦМ назад на ~2,6 м, что меняет компоновку. Аварийный вдув аргона через пористый боразоновый нос: если при баллистическом спуске аппарат не удержится днищем к потоку и пойдёт носом вперёд (β ~4000 кг/м², нос без вдува ~3200 К — выше предела), аргон из основного бака по одной магистрали с клапаном продувается через пористую вставку носа. Теплота нагрева аргона от 87 К до ~2000 К ≈ 1,16 МДж/кг плюс оттеснение пограничного слоя; на пик ~100 с нужно 0,25–0,5 т аргона — резерв 0,5 т держится в баке до конца спуска. Детали: пористая вставка вместо сплошного наконечника (та же деталь), магистраль и клапан (+2).", "hypersonic_ru": "Притуплённые нос и кромки дают L/D ≈ 2,1 при α 20° и 1,12 при α 40° (участок пикового нагрева); прирост сопротивления от притупления ≈ 2,4 м² (CD·S). Боковая дальность — около 1700 км. Путевая устойчивость — от концевых плоскостей, поднятых на 60°. Тангаж и крен — двумя элевонами и УВТ маршевых ±15°. Ничего не выступает: створки чаш закрыты заподлицо, шасси убрано.", "hover_ru": "Штатная посадка на Земле и телах с атмосферой и полосой — планированием на полосу (без тяги 66 м/с, L/D 4,5); висение — на телах без полосы и аварийно. 6 чаш по 200 кН, Т/В на Земле 2,02, при отказе одной (гасится противолежащая) — 1,34 на номинале. Аргона после выхода на орбиту 6,3 т (+0,3 т за счёт облегчения узла чаш): при 40 кг/с на Земле ~157 с висения, на Марсе ~420 с, на Луне ~950 с. На Земле весь запас остаётся аварийным.", "ttx": {"length_m": 20, "span_m": 18, "span_stowed_m": 15.6, "height_m": 3.4, "planform_area_m2": 168, "mtom_t": 60.7, "dry_t": 30.45, "payload_t": 10, "reaction_mass_t": 18.3, "T_lift_max_K": 1945, "T_ball_max_K": 1685, "n_ball_g": 5.5, "beta_lift_kgm2": 513, "beta_ball_kgm2": 223, "nose_R_m": 0.62, "heat_reduction_pct": 49, "ld_hypersonic": 2.1, "ld_subsonic": 4.5, "v_land_power_off_ms": 66, "tw_earth": 2.02, "tw_one_unit_out": 1.34, "thrust_total_MN": 2.1, "tvc_range_deg": 15, "units_total": 8, "moving_parts": 14, "nose_R_h_m": 1.0, "nose_R_v_m": 0.45, "wing_le_R_m": 0.17, "facet_le_R_m": 0.04, "T_edge_max_K": 1935, "T_margin_K": 455, "hover_s_earth": 157, "hover_s_mars": 420, "hover_s_moon": 950, "earth_landing": "runway_glide", "lift_cup_D_m": 0.84, "lift_cup_depth_m": 0.34, "stowed_clearance_m": 0.04, "lift_doors": 2, "lift_drives": 2, "ball_dM_gain": 4.7, "ball_xcp_m": -2.6}, "propulsion_ru": "Всего 8 ионно-триггерных моторов, импульсный синтез в магнитной чаше со сверхпроводящими катушками (12,1 Тл, магнитное давление B²/2μ0 = 58,3 МПа). Маршевые: 2 × 450 кН в корме, УВТ ±15°, в пустоте 30–60 км/с; выход на орбиту (Δv 9,3 км/с при 40 км/с) требует ~12 т аргона. Подъёмные: 6 × 200 кН; минимальный срез по F ≤ B²/(2μ0)·S — 34 см², принят 70 см² (запас ×2 по удержанию потока импульса: 13,3 кг/с × 15 км/с); мощность 1,5 ГВт на чашу (F = 2P/v); чаша Ø 0,96 м, длина 0,95 м. Рабочее тело — жидкий аргон 18 т (12,9 м³) из запаса «Тантры», ионные заряды 2 т. Теневой экран 25 г/см² между чашами и салоном.", "lift_units_ru": "6 подъёмных чаш Ø0,84 × 0,34 м (было Ø0,96 × ~0,95): магнитная чаша — поле 12,1 Тл, а не стенка, поэтому мелкая. Давление поля B²/2μ0 = 58,3 МПа, объём чаши 0.063 м³ — энергия поля 3.7 МДж против энергии импульса 1,5 МДж (200 кН, 15 км/с, допущение 1 кГц): запас 2.4. Предельная сила на срез B²/2μ0·S = 32 МН ≫ 0,2 МН. Два ряда по три (x ±3,0 м, z −1,5 / 0 / +1,5 м — внутри плоского днища). Каждый ряд сидит на одной раме-рычаге, которая переворачивает три чаши на 180° срезом вверх внутрь ниши; ряд закрывает одна створка-панель 1,2 × 4,0 м заподлицо с днищем. Убранная чаша на 4 см выше днища, выпущенная — срез на 0,30 м под днищем. Передняя рама качается ±8° целиком; крен и рыскание — дросселированием. Чаши электрически независимы: при отказе одной гасится противолежащая, висят четыре на номинале.", "wings_ru": "Несущие плоскости Λ 55°, корневая хорда 10,8 м, размах 18,0 м, толщина 0,40 м, передняя кромка — боридный монолит R 17 см. Концевые части по 1,3 м (толщина 0,34 м, та же кромка) складываются вверх: 0° — дозвук и посадка (L/D 4,5), 60° — гиперзвук и вход (кили), 90° — ангар (размах 15,6 м). Задняя кромка — по одному элевону на сторону.", "layout_ru": "Лопаточный нос (x +11…+6): датчики фотонной полосы, за ними виртуальный кокпит на 2 места (x +6…+4,5), без окон, экраны. Салон на 12 кресел полулёжа с ложементами по телу (гасителя инерции нет) (x +4,5…−1), шлюз сбоку. Под салоном теневой экран, вокруг ЦМ — 6 подъёмных чаш в два ряда на двух рамах. Баки аргона (2 × 6,45 м³, перекрёстная подача) — x −1…−5. Генераторы, криокулеры, ионные заряды — x −5…−7,5. Маршевые — корма. Грузовой отсек 10 т — x 0…−5 над баками. Шасси трёхопорное: ПО под кокпитом, две основные — у x −4. Добавочные 0,3 т аргона — в существующих баках.", "mass_table_ru": "Корпус-каркас и горячая обшивка — 11,0 т; лопаточный нос и утолщённые кромки — +0,7 т. Подъёмные чаши 6 × 0,75 = 4,5 т; 2 рамы-рычага 0,3 т; 2 створки с приводами 0,2 т — узел 5,0 т (было 5,3 т). Маршевые 2 × 1,8 = 3,6 т. Энергетика, катушки, криокулеры — 4,0 т. Теневой экран — 2,5 т. Кабина, кресла полулёжа, системы — 2,1 т. Шасси —
