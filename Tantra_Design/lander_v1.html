<!doctype html>

<title>Лэндер Тантры V1</title>
<style>
:root{--bg:#eef1f4;--panel:#ffffff;--ink:#1d2430;--muted:#5d6878;--line:#d5dbe3;--ok:#1f8a4c;--warn:#b7791f;--bad:#c53030;--acc:#2b6cb0}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
#wrap{display:grid;grid-template-columns:1fr 430px;min-height:100vh}
#main{padding:10px 14px;min-width:0}
#side{background:var(--panel);border-left:1px solid var(--line);padding:12px 14px;overflow:auto;max-height:100vh}
h1{font-size:16px;margin:0 0 4px}
h2{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h3{font-size:14px;margin:6px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;overflow-x:auto}
button{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:#f7f9fb;color:var(--ink);cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.chk{display:inline-flex;gap:5px;align-items:center;margin:2px 10px 2px 0;font-size:13px}
select{font:inherit;padding:3px 5px;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:3px 5px;border-bottom:1px solid #eef1f4;vertical-align:top;text-align:left}
th{color:var(--muted);font-weight:600}
td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{font-size:12px;color:var(--muted)}
.big{font-size:15px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:#fdf1d8;color:#8a5a00;border:1px solid #f0d49a;margin-left:6px}
ul{margin:4px 0 4px 18px;padding:0}
li{margin:2px 0}
p{margin:4px 0}
#view3d{position:relative;height:560px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
#view3d canvas{display:block}
#vhud{position:absolute;left:10px;top:10px;color:#fff;font-size:12px;background:rgba(0,0,0,.5);padding:6px 9px;border-radius:6px;max-width:62%;pointer-events:none}
#vbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
#vbar button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);font-size:12px;padding:3px 8px}
#legend{position:absolute;right:10px;top:10px;color:#ddd;font-size:11px;background:rgba(0,0,0,.5);padding:6px 8px;border-radius:6px;max-height:70%;overflow:auto}
#legend div{display:flex;align-items:center;gap:6px;margin:1px 0}
#legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.3)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);color:#fff;font-size:10.5px;background:rgba(10,14,22,.72);border:1px solid rgba(255,255,255,.25);padding:1px 5px;border-radius:4px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#fail{position:absolute;inset:0;color:#eee;padding:20px;display:none;overflow:auto}
#wide{display:none}
.cmp th:first-child,.cmp td:first-child{min-width:150px;font-weight:600}
.cmp td{min-width:150px;font-size:12.5px}
.rec{border-left:4px solid var(--acc);background:#f2f7fd}
@media (max-width:900px){#wrap{grid-template-columns:1fr}#side{border-left:0;border-top:1px solid var(--line);max-height:none}#view3d{height:420px}#legend{display:none}}
</style>
</head>

<script type="application/json" id="data">{"title":"Лэндер «Тантры» V1 — отказоустойчивость и варианты облика","core":{"name_ru":"V1-ОЯ «Четыре поворотные гондолы — отказоустойчивое ядро»","summary_ru":"Ядро V1 с отказоустойчивостью, добавлено 11 деталей (+0,65 т). Тяговую часть не удваивали: одна чаша на гондолу. Резерв тяги — аварийный режим 0 деталей: мощность +10 %, струя 11,5 км/с вместо 15, это 306 кН на чашу при том же поле 12,1 Тл. Крыло увеличено: 2 × 24,1 = 48,2 м² плюс наплыв 16,8 м². Посадка без тяги 88 м/с при 37,7 т (CL 1,2). Взлётная масса 59,75 т, Т/В 1,45. Без одной гондолы: 1,04 в аварийном режиме на взлёте, 1,13 штатной мощностью на посадочной массе. Численная рамка stowed 19,0 × 15,78 × 3,65 м (было 14,25 при правилe правой руки; 17,37 возникает при обратном знаке поворота крыла).","criterion_ru":"Один любой отказ: задача продолжается либо безопасно завершается (посадка на 3 гондолы или на крыло ≤90 м/с). Два отказа: экипаж жив — за исключением потери двух гондол в висении выше ~20 м. Это остаточный риск, его закрывает профиль: висение ниже 20 м ≤15 с, переход идёт с поступательной скоростью, кресла с поглотителем инерции.","changes_ru":["Крыло: консоль 5,6 м, хорды 6,0/2,6 м, 24,1 м² ×2 (было 14,9 ×2). Корень ПК x +2,8, шарнир (0; −1,42; ±3,9), толщина 0,22 м","Наплыв-перчатка 6,0 × 1,4 м ×2 = 16,8 м² (было 4 × 1,4). Крыло опущено к брюху (y −1,42): при стреловидности корневая часть уходит в щель между брюхом и баками","Баки аргона подняты: y −0,6 → −0,52 (низ −1,27, над крылом в щели)","Знак поворота задан явно: Родригес, правая рука вокруг axis. R −50° и L +50° = стреловидность назад. Численная рамка stowed 19,0 × 15,78 × 3,65","Аварийный режим чаши: P 1,76 ГВт, v 11,5 км/с → 306 кН, 30–60 с. Поле не поднимается, форсаж 16 Тл отвергнут","Привод шарнира: вторая независимая обмотка статора в том же корпусе (+4)","Перекрёстная подача: бак L → гондолы 2 и 3, бак R → 1 и 4, клапан-перемычка (+1)","Второй инжектор зарядов в том же блоке (+1); второй криокулер ВТСП (+1)","Синхровал крыльев через брюхо с редуктором (+2)","Ручной аналоговый резерв: ручка → дифференциал мощности чаш (+1); аварийный O₂-коллектор на 14 мест (+1)"],"fmea":[{"component_ru":"Камера (чаша) в висении у грунта","failure_ru":"Погасание синтеза/повреждение чаши","effect_before_ru":"V1: при 55,9 т двум оставшимся нужно 274 кН — форсаж или сброс","mitigation_ru":"Три оставшиеся берут W/2 (передняя противоположная) и 0,34/0,16 W (задние). Аварийный режим 306 кН/чаша без новых деталей","effect_after_ru":"Взлёт 59,75 т: Т/В 1,04 → посадка обратно; посадка 37,7 т: нужно 185 кН (87 % штатной), висение сохранено","detection_ru":"Датчик тока катушки и нейтронов, 15 мс","added_parts":0,"added_mass_t":0,"sim":"chamber_out"},{"component_ru":"Гондола целиком","failure_ru":"Потеря гондолы (пилон, вал, пожар)","effect_before_ru":"Как отказ чаши плюс несимметрия массы","mitigation_ru":"Тот же аварийный режим; Т/В без гондолы 1,04/1,13; в марше −25 % тяги, Δv сохраняется","effect_after_ru":"Посадка вертикально или на крыло 88 м/с","detection_ru":"Датчики положения вала, тяги","added_parts":0,"added_mass_t":0,"sim":"pod_out"},{"component_ru":"Шарнир гондолы","failure_ru":"Заклинивание привода/вала","effect_before_ru":"Один привод: гондола застревает в любом угле","mitigation_ru":"Вторая обмотка статора в том же моторе (отказ обмотки/питания). При заклинивании подшипника гондолу гасят → случай «минус гондола»","effect_after_ru":"Застряла в −90°: посадка на 3 чаши или на крыло; в 0° в полёте — гасят, полёт на 3","detection_ru":"Рассогласование задатчик–угол >2°","added_parts":4,"added_mass_t":0.12,"sim":"pod_jam"},{"component_ru":"Поле чаши","failure_ru":"Срыв поля (квенч) на высоте 50 м","effect_before_ru":"Тяга чаши 0 за ~1 с, перезапуск 10–30 мин","mitigation_ru":"Остальные три переходят в аварийный режим за 0,2 с; провал высоты <1 м","effect_after_ru":"Снижение и посадка на 3 чаши (посадочная масса — штатной мощностью)","detection_ru":"dB/dt катушки","adde месту, отдельно, без оснастки. Обтекатели гондол восьмигранные (вписаны в r 0,75 м, без изменения габарита). Наплыв сделан гранёным клином 6,2 × 1,4 м. Ядро (кабина, кресла, баки, гондолы, шарниры, тяги, movers) скопировано без изменений.","aero_ru":"Размах 18,4 м, крыло 2 × 24,08 = 48,2 м², наплыв 2 × 8,68 = 17,4 м², несущая площадь 65,5 м². Удлинение 5,2. Качество на дозвуке ~8 (оценка по профилю 10, минус потери на рёбрах граней 15–20 %). Посадка без тяги: 37,7 т, CL 1,2 → 87,6 м/с (численно). Гиперзвук: стреловидность 70°, корпус с плоским брюхом работает как клин. L/D ~1,5 при угле атаки 35–40°. Рёбра скруглены r ≥ 5 см: вдоль рёбер нет пиков нагрева.","hypersonic_ru":"Вход носом и брюхом, α 35–40°, стреловидность 70°. Многогранный нос даёт отсоединённую ударную волну; плоское брюхо — равномерное давление. Рёбра граней скруглены r 5 см (на остром ребре тепловой поток был бы ×3). Гондолы повёрнуты на −90° и стоят в тени корпуса.","thermal_ru":"Нос и передние кромки — до ~1700 °C: плитки C/SiC с иридиевым покрытием (родство с носом «Тантры»). Брюхо — плоские плитки ТЗП ~1300 °C, одного типоразмера на грань. Верх ≤ 600 °C, матовый керамический лак. Плоские грани упрощают ремонт: плитку меняют без подгонки по кривизне.","materials_ru":"Каркас — Ti/Al-Li шпангоуты по восьмиугольнику. Грани — сотовые панели C/SiC. Нос — C/SiC с Ir-покрытием. Крыло — C/C кессон с ТЗП. Лак — матовая керамика, тёмный текстурный вид. Свечение только функциональное: чаши, кромки люков, бортовые огни.","kinship_ru":"Прямое родство с «Тантрой»: гранёный восьмигранный корпус, многогранный иридиевый нос, восьмигранные люки, тёмный матовый лак. Это корабль в малом масштабе.","mass_delta_t":0.05,"wing_area_m2":48.16,"landing_speed_power_off_ms":87.6,"stowed_bbox_m":[19,15.44,3.65],"fits_hangar":true,"growth_ru":"Ангар не растёт. Габарит stowed посчитан численно (Родригес, movers применены к примитивам и трапециям): 19,0 × 15,44 × 3,65 м при пределе 20,2 × 16,0 × 5,4 м. Запас по ширине 0,56 м, по высоте 1,75 м.","pros_ru":["Добавлено деталей 0, масса +0,05 т (две ступени носа)","Посадка без тяги 87,6 м/с ≤ 90","Stowed 15,44 м ≤ 16,0 (было 15,78)","Плоские панели ТЗП: ~40 типоразмеров, замена по месту","Прямое визуальное родство с «Тантрой»"],"cons_ru":["Рёбра граней: потери качества ~15–20 % (L/D ~8 вместо ~10)","Скругление рёбер r 5 см обязательно, иначе тепловой поток на ребре ×3","Иридиевое покрытие носа дорогое"],"palette":{"hull":"#2B2D30","dark_metal":"#17181A","accent":"#8A8F96","glow":"#5FD4FF"},"geometry":{"hull_sections":[{"x":-9,"hw":1.6,"yt":0.9,"yb":-0.9,"ch":0.5},{"x":-6.5,"hw":2.3,"yt":1.4,"yb":-1.4,"ch":0.7},{"x":-3,"hw":2.5,"yt":1.6,"yb":-1.6,"ch":0.8},{"x":1,"hw":2.5,"yt":1.6,"yb":-1.6,"ch":0.8},{"x":4,"hw":2.4,"yt":1.7,"yb":-1.5,"ch":0.8},{"x":7,"hw":2.2,"yt":1.8,"yb":-1.3,"ch":0.8},{"x":8.8,"hw":1.9,"yt":1.6,"yb":-1.1,"ch":0.75},{"x":9.5,"hw":1.15,"yt":1.15,"yb":-0.85,"ch":0.5},{"x":10,"hw":0.35,"yt":0.4,"yb":-0.4,"ch":0.15}],"primitives":[{"id":"cabin","kind":"box","role":"cabin","group":"body","center":[5.4,0.3,0],"dims":[4,2.3,3.6],"note_ru":"салон 12 мест"},{"id":"vestibule","kind":"box","role":"cabin","group":"body","center":[7.65,0.3,0],"dims":[0.5,2.1,3.4],"note_ru":"тамбур, гермоперегородка"},{"id":"cockpit","kind":"box","role":"cabin","group":"body","center":[8.6,0.2,0],"dims":[1.4,1.9,2.6],"note_ru":"кокпит 2 места"},{"id":"seat_c1","kind":"box","role":"seat","group":"body","center":[8.45,-0.3,-0.6],"dims":[1.1,1,0.7]},{"id":"seat_c2","kind":"box","role":"seat","group":"body","center":[8.45,-0.3,0.6],"dims":[1.1,1,0.7]},{"id":"seat_01","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,-1.2],"dims":[1.2,1,0.6]},{"id":"seat_02","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,-0.55],"dims":[1.2,1,0.6]},{"id":"seat_03","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,0.55],"dims":[1.2,1,0.6]},{"id":"seat_04","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,1.2],"dims":[1.2,1,0.6] ot":[-4.6,0.2,-5],"axis":[0,0,1],"hover_deg":0,"transition_deg":-45,"cruise_deg":-90,"stowed_deg":-90,"entry_deg":-90,"min_deg":-90,"max_deg":10},{"group":"wing_R","pivot":[0,-1.42,3.9],"axis":[0,1,0],"hover_deg":0,"transition_deg":0,"cruise_deg":-25,"stowed_deg":-50,"entry_deg":-50,"min_deg":-50,"max_deg":0,"note_ru":"правая рука вокруг +y: −50° = ПК 72°, z max 7,72"},{"group":"wing_L","pivot":[0,-1.42,-3.9],"axis":[0,1,0],"hover_deg":0,"transition_deg":0,"cruise_deg":25,"stowed_deg":50,"entry_deg":50,"min_deg":0,"max_deg":50,"note_ru":"синхровал с wing_R"},{"group":"gear_main","pivot":[-3.4,-1.3,0],"axis":[0,0,1],"hover_deg":0,"transition_deg":0,"cruise_deg":-90,"stowed_deg":-90,"entry_deg":-90,"min_deg":-90,"max_deg":0},{"group":"gear_nose","pivot":[8,-0.95,0],"axis":[0,0,1],"hover_deg":0,"transition_deg":0,"cruise_deg":-90,"stowed_deg":-90,"entry_deg":-90,"min_deg":-90,"max_deg":0},{"group":"cargo_hatch","pivot":[-0.3,1.6,-1.25],"axis":[1,0,0],"hover_deg":0,"transition_deg":0,"cruise_deg":0,"stowed_deg":0,"entry_deg":0,"min_deg":0,"max_deg":110}],"thrusters":[{"id":"cup_1","group":"pod_1","origin":[4.6,-0.1,3.5],"dir":[0,-1,0],"thrust_MN":0.213,"vector_cone_deg":8},{"id":"cup_2","group":"pod_2","origin":[4.6,-0.1,-3.5],"dir":[0,-1,0],"thrust_MN":0.213,"vector_cone_deg":8},{"id":"cup_3","group":"pod_3","origin":[-4.6,-1.2,5],"dir":[0,-1,0],"thrust_MN":0.213,"vector_cone_deg":8},{"id":"cup_4","group":"pod_4","origin":[-4.6,-1.2,-5],"dir":[0,-1,0],"thrust_MN":0.213,"vector_cone_deg":8}]}},{"id":"B","name_ru":"B «Скат» — несущий корпус на ядре V1-ОЯ","tagline_ru":"Плоский гранёный корпус и широкие плечи несут ~35 % подъёмной силы. Консоли уменьшены до 2 × 20,5 м², посадка без тяги 78 м/с","idea_ru":"Корпус сплющен и расширен до 5,0 м по всей длине (hw 2,5 от x −6,5 до +4, нос лопаточный hw 2,1). Наплыв заменён «плечами» 7,0 × 1,6 м ×2 = 22,4 м² у брюха (y −1,42). Это полые обтекатели, корень консоли при стреловидности уходит в щель плеча. Пилоны задних гондол заменены плечевыми обтекателями 2,4 × 1,7 м: гондолы 3 и 4 утоплены в них. Консоли 5,0 м, хорды 5,4/2,8, ПК 20°, 2 × 20,5 = 41 м² (было 48,2). Ядро V1-ОЯ (кабина, кресла, баки, гондолы, шарниры, тяги, movers) скопировано без изменений. Новых деталей 0: плечи заменили наплывы, обтекатели заменили пилоны.","aero_ru":"Несущая площадь: консоли 41 + плечи 22,4 = 63,4 м² (CL 1,2) плюс плоское брюхо ~72 м² (вихревая подъёмная сила кромок, CL ≈ 0,35 при α 15°). ΣCL·S = 101 м² против 78 у ядра (65 × 1,2). Посадка без тяги 78 м/с при 38,25 т (ядро 88 м/с). Нагрузка на всю несущую поверхность 276 кг/м². Качество на дозвуке ≈ 6,5: у ядра ~7,5, у чистого несущего корпуса 4. Планирование с 10 км ≈ 65 км. Гиперзвук: L/D 1,4 при α 30–40° (у ядра ~1,1), боковая манёвренность ±600 км. Плоское брюхо с гранями-кромками работает как волнорез, балансировка по тангажу без щитков: гондолы −90° сзади и сверху дают стабилизирующий момент. Размах раскрытый 17,2 м (ПК 20°), в марше −25° (ПК 45°).","hypersonic_ru":"Вход при α 40°, вся планформа ~135 м² работает как щит. Баллистический коэффициент β ≈ 280 кг/м² против ~315 у ядра. Торможение идёт выше на ~3 км, пиковый тепловой поток ∝ √β, это примерно −6 %. Радиус притупления носа и кромок плеч 0,45 м (у ядра 0,3), отсюда ещё −20 % по Фэю–Риддлу. Пик ~1350 °C на носу и кромках плеч, ~1100 °C на брюхе. Консоли при входе в 70° прячутся в тень плеч, кромка консоли ≤1000 °C. Сход с орбиты без тяги, перегрузка ≤1,6 g.","thermal_ru":"Нагрев сосредоточен на гранях: нос и передние кромки плеч — C/SiC; брюхо — плитки из пенокерамики SiO₂–Al₂O₃ 50 мм под матовым чёрным боросиликатным лаком; верх ≤600 °C — гибкая керамическая ткань под тёмным лаком. Струя гондол в висении не задевает плечи: передние чаши на x 3,85–5,35 вне плеч (плечо x −3,2…+3,8). Задние гондолы на z ±5, обтекатель доходит до z 4,2, зазор 0,05 м по радиусу поворота. Аргон в баках получает ~15 % меньше тепла через брюхо: пик ниже, а плечи экранируют бока.","materials_ru":"Каркас — Ti-6Al-4V и Al-Li 2195. Нос и кромки плеч — C/SiC. Брюхо — керамическая плитка 50 мм. Консоли — титановый кессон с C/SiC кромкой. Обтекатели гондол — композит SiC/SiC. Покрытие — матовый керамический лак, тёмный текстурный (графит/базальт), грани подчёркнуты фасками. Свечение только функциональное: срез чаш (рабочий), навигационные огни на концах консолей, подсветка восьмигранных люков при открытии.","kinship_ru":"Как у «Тантры»: гранёный восьмиугольный корпус с крупными фасками (ch 0,9–0,95), тёмный матовый лак, восьмигранные люки (вход L и грузовой), поворотные гондолы с чашами — масштабная копия её планетарных моторов. Силуэт сверху — ромб-скат с утопленными гондолами, перекликается с кормовыми плечами звездолёта.","mass_delta_t":0.55,"wing_area_m2":63.4,"landing_speed_power_off_ms":78,"stowed_bbox_m":[19.01,15.34,3.64],"fits_hangar":true,"growth_ru":"Масса +0,55 т: консоли −0,65 т (41 вместо 48,2 м², 0,09 т/м²), плечи вместо наплыва +0,5 т (22,4 вместо 16,8 м²), расширенный корпус и ТЗП брюха +0,4 т, обтекатели задних гондол вместо пилонов +0,3 т. Сухая 27,9 т, взлётная 60,3 т, Т/В 1,44 (0,852 МН / 0,592 МН), без одной гондолы в аварийном режиме 1,03. Посадочная 38,25 т. Объём корпуса +3,5 м³ (ширина 5,0 м по всей длине): это резерв под аргон, +4,9 т, или под груз. Новых деталей 0. Численный stowed 19,01 × 15,34 × 3,64 м ≤ 20,2 × 16,0 × 5,4. В висении размах 17,2 м, высота с опорами 5,03 м.","pros_ru":["Посадка без тяги 78 м/с (ядро 88), запас 12 м/с до предела 90","Крыло заклинено в 70°: ΣCL·S ≈ 80 м², посадка ~88 м/с (ядро ~105)","β 280 вместо 315 кг/м², пик нагрева ниже на ~25 %, гиперзвуковое L/D 1,4","Stowed по ширине 15,34 м: запас 0,66 м до цели 16,0","+3,5 м³ внутреннего объёма под аргон или груз","0 новых деталей: плечи и обтекатели заменили наплыв и пилоны"],"cons_ru":["Качество на дозвуке 6,5 вместо ~7,5: планирование короче на ~13 %","Консоли 41 м², это меньше правила ядра ≥48 м². Площадь добирают плечи: несущая 63,4 м²","Масса +0,55 т, Т/В 1,44 (без гондолы 1,03 в аварийном режиме)","Корень консоли идёт в щель плеча: нужна герметизация щели при входе","Высота в висении с опорами 5,03 м (у ядра столько же)"],"palette":{"hull":"#2B2E31","dark_metal":"#1A1C1E","accent":"#7A6A52","glow":"#5FD3E8"},"geometry":{"hull_sections":[{"x":-9,"hw":1.7,"yt":0.9,"yb":-1.1,"ch":0.6},{"x":-6.5,"hw":2.5,"yt":1.35,"yb":-1.45,"ch":0.9},{"x":-3,"hw":2.5,"yt":1.62,"yb":-1.5,"ch":0.95},{"x":1,"hw":2.5,"yt":1.62,"yb":-1.5,"ch":0.95},{"x":4,"hw":2.5,"yt":1.68,"yb":-1.45,"ch":0.95},{"x":7,"hw":2.45,"yt":1.75,"yb":-1.3,"ch":0.9},{"x":8.8,"hw":2.1,"yt":1.55,"yb":-1.1,"ch":0.8},{"x":10,"hw":0.9,"yt":0.5,"yb":-0.45,"ch":0.3}],"primitives":[{"id":"cabin","kind":"box","role":"cabin","group":"body","center":[5.4,0.3,0],"dims":[4,2.3,3.6],"note_ru":"салон 12 мест"},{"id":"vestibule","kind":"box","role":"cabin","group":"body","center":[7.65,0.3,0],"dims":[0.5,2.1,3.4],"note_ru":"тамбур, гермоперегородка"},{"id":"cockpit","kind":"box","role":"cabin","group":"body","center":[8.6,0.2,0],"dims":[1.4,1.9,2.6],"note_ru":"кокпит 2 места"},{"id":"seat_c1","kind":"box","role":"seat","group":"body","center":[8.45,-0.3,-0.6],"dims":[1.1,1,0.7]},{"id":"seat_c2","kind":"box","role":"seat","group":"body","center":[8.45,-0.3,0.6],"dims":[1.1,1,0.7]},{"id":"seat_01","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,-1.2],"dims":[1.2,1,0.6]},{"id":"seat_02","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,-0.55],"dims":[1.2,1,0.6]},{"id":"seat_03","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,0.55],"dims":[1.2,1,0.6]},{"id":"seat_04","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,1.2],"dims":[1.2,1,0.6]},{"id":"seat_05","kind":"box","role":"seat","group":"body","center":[5.4,-0.35,-1.2],"dims":[1.2,1,0.6]},{"id":"seat_06","kind":"box","role":"seat","group":"body","center":[5.4,-0.35,-0.55],"dims":[1.2,1,0.6]},{"id":"seat_07","kind":"box","role":"seat","group":"body","center":[5.4,-0.35,0.55],"dims":[1.2,1,0.6]},{"id":" 5). Сверхзвук M 2 при ПК 75°: K ≈ 4,5 (ядро ≈ 3,8, т.к. крыло прячется в конус Маха μ = 30°). Запас хода: в атмосферном крейсере на тяге расход аргона ∝ 1/K → дальность +21 %; дальность планирования с 15 км: 11,5 × 15 = 170 км (ядро 140 км). Посадка без тяги: V = √(2·38,15 т·g /(1,225·69,6·1,2)) = 86 м/с (ядро 88); ВПП ~2,3 км. Двойная дельта даёт вихревую подъёмную силу наплыва при α 15–20°, CL 1,2 достижим без закрылков.","hypersonic_ru":"Вход при ПК 75° и α 35–40°: консоли в тени корпуса и наплыва, нагружено брюхо. K гиперзвук ≈ 2,1 (ядро 1,9) → боковая манёвренность ~ ±900 км. Баллистический коэффициент m/(CxS) ≈ 38 т/(1,3·69,6) ≈ 420 кг/м², пик нагрева ниже по высоте ~70 км.","thermal_ru":"Острый нос r 0,12 м → тепловой поток в точке торможения ~1,4 МВт/м² (q ∝ 1/√r), пик T ≈ 1900 °C — нос и передние кромки наплыва из УУКМ C/C-SiC. Брюхо при α 40°: 0,25–0,4 МВт/м², T ≈ 1250 °C — керамическая плитка. Кромки консолей при ПК 75° в тени: ≤ 900 °C.","materials_ru":"Нос и кромки наплыва: C/C-SiC (0,35 т). Брюхо: плитка SiC/Al₂O₃ 25 мм. Верх и консоли: титановый сплав под матовым керамическим лаком (тёмный графит). Силовой набор корпуса: Ti + композит C/эпокси вне зоны нагрева.","kinship_ru":"Гранёный восьмигранный корпус и тёмный матовый лак — как у «Тантры»; люки восьмигранные; свечение только у срезов чаш (сине-фиолетовое) и навигационных огней. Вытянутый острый силуэт — «стрела», уходящая из ангара вверх.","mass_delta_t":0.45,"wing_area_m2":69.6,"landing_speed_power_off_ms":86,"stowed_bbox_m":[20.1,15.69,3.62],"fits_hangar":true,"growth_ru":"Масса +0,45 т к ядру: наплыв +4,2 м² (+0,3 т), удлинение носа +1,1 м и ТЗП носа (+0,3 т), сужение корпуса −0,15 т. Взлётная 60,2 т, Т/В 0,852/0,59 = 1,44 (≥1,35). Посадочная 38,15 т. Ангар не растёт: численно stowed 20,1 × 15,69 × 3,62 м ≤ 20,2 × 16,0 × 5,4 (пример: 1 python, movers гондол −90°, крыла ∓45°). Деталей добавлено: 0.","pros_ru":["K дозвук 11,5 против 9,5 у ядра (+21 % дальности на аргоне)","Посадка без тяги 86 м/с днищем не перетекает наверх. При α 15–20° и M 6–20 качество ≈2,2 (у V1 ≈1,3). Боковая дальность при входе ~2500 км (у V1 ~1000). На дозвуке ПК 22°: крыло 50,4 м² + рёбра 15,6 м² = 66 м², размах 18,4 м, λ≈4,5, качество ≈6,5 (у V1 ≈6). Минусы: скулы дают ранний отрыв вихря, поэтому на посадке α ≤14°. CL 1,2 даёт только совместная работа вихря скул и закрылков; при 38,5 т посадка 88 м/с.","hypersonic_ru":"Вход: α 35° до M 12, затем α 18° и полёт на качестве 2,2. Плоское днище принимает 85 % нагрева. Пик на днище ~45 Вт/см² (на 30 % ниже, чем у V1: днище шире, нагрузка на площадь меньше). Пик на скулах при радиусе 0,15 м ≈150 Вт/см²; это расчётная точка всего облика. Острее 0,15 м делать нельзя: при 0,05 м нагрев был бы ×1,7 и выше 250 Вт/см². В гиперзвуке крыло стоит в 70° и прячется в тени скул.","thermal_ru":"Носовой клин и скулы: C/SiC с подслоем ZrB₂, равновесная температура 1650–1750 °C, без абляции. Днище: плитки SiC-волокна, ≤1250 °C. Верхние грани: гибкая ТЗП, ≤600 °C. Консоли в 70° закрыты скулой; кромка консоли C/SiC, ≤1300 °C. Над передними гондолами (−90°) стоит экран ядра W, он не меняется.","materials_ru":"Каркас: Ti-6Al-4V и Al-Li. Кромки и нос: C/SiC + ZrB₂ (+0,35 т против V1). Днище: SiC-плитки на 32 м² большей площади. Верх: матовый керамический лак, тёмный графит, фактура «шагрень». Восьмигранные люки окантованы тёмной бронзой. Свечение только функциональное: срез чаш и навигационные огни.","kinship_ru":"С «Тантрой» роднит гранёный верх с теми же углами фасок, тёмный текстурный лак, восьмигранные люк входа и грузовой люк, бронзовые кромки. Клин носа повторяет нос «Тантры», только сплющен по высоте.","mass_delta_t":0.8,"wing_area_m2":50.4,"landing_speed_power_off_ms":88,"ld_subsonic":6.5,"stowed_bbox_m":[19,15.9,3.58],"fits_hangar":true,"growth_ru":"Масса +0,8 т: ТЗП скул и носа +0,35 т, площадь днища +0,25 т, крыло 50,4 вместо 48,2 м² +0,2 т. Взлётная 60,55 т, Т/В 0,852 / 0,594 = 1,43 (≥1,35). Посадочная без тяги 38,5 т. Stowed посчитан численно (movers применены к вершинам): 19,0 × 15,90 × 3,58 м ≤ 20,2 × 16,0 × 5,4. Запас по ширине всего 0,1 м: консоль с ПК 22° при повороте 50° доходит до z ±7,95. Деталей добавлено 0.","pros_ru":["Гиперзвуковое качество 2,2 против 1,3: боковой манёвр ~2500 км, больше окон посадки","Нагрев днища на 30 % ниже, перегрузка входа ≤1,5 g","Посадка без тяги 88 м/с при 38,5 т","0 новых деталей, ядро V1-ОЯ нетронуто","Плоское днище — ровная опора при аварийной посадке на брюхо"],"cons_ru":["Скулы — самое горячее место: ~150 Вт/см², нужны C/SiC + ZrB₂","Посадка: α ≤14° из-за вихря скул, ВПП ~2,6 км","Ширина stowed 15,90 м — запас до цели 16,0 всего 0,1 м","Масса +0,8 т, Т/В 1,43 (было 1,45)","Плоское днище у струи задних чаш: при висении у грунта нужна ТЗП и на корме"],"palette":{"hull":"#2B2D30","dark_metal":"#16171A","accent":"#8A6A3E","glow":"#7FD8FF"},"geometry":{"hull_sections":[{"x":-9,"hw":2,"yt":0.9,"yb":-1.3,"ch":0.3},{"x":-6.5,"hw":2.6,"yt":1.4,"yb":-1.3,"ch":0.4},{"x":-3,"hw":2.8,"yt":1.6,"yb":-1.3,"ch":0.45},{"x":1,"hw":2.8,"yt":1.7,"yb":-1.3,"ch":0.45},{"x":4,"hw":2.7,"yt":1.8,"yb":-1.3,"ch":0.45},{"x":7,"hw":2.4,"yt":1.85,"yb":-1.25,"ch":0.45},{"x":8.8,"hw":1.9,"yt":1.6,"yb":-1.15,"ch":0.35},{"x":10,"hw":0.5,"yt":0.45,"yb":-0.85,"ch":0.15}],"primitives":[{"id":"cabin","kind":"box","role":"cabin","group":"body","center":[5.4,0.3,0],"dims":[4,2.3,3.6],"note_ru":"салон 12 мест"},{"id":"vestibule","kind":"box","role":"cabin","group":"body","center":[7.65,0.3,0],"dims":[0.5,2.1,3.4],"note_ru":"тамбур, гермоперегородка"},{"id":"cockpit","kind":"box","role":"cabin","group":"body","center":[8.6,0.2,0],"dims":[1.4,1.9,2.6],"note_ru":"кокпит 2 места"},{"id":"seat_c1","kind":"box","role":"seat","group":"body","center":[8.45,-0.3,-0.6],"dims":[1.1,1,0.7]},{"id":"seat_c2","kind":"box","role":"seat","group":"body","center":[8.45,-0.3,0.6],"dims":[1.1,1,0.7]},{"id":"seat_01","kind":"box","role":"seat","group":"body","center":[4.1,-0.35,-1.2],"dims":[1.2,1,0.6]},{"id":"seat_02","kind":"b var matCache={};
function mat(role,opt){
  var key=role+'|'+(opt||'');
  if(matCache[key]) return matCache[key];
  var r=ROLES[role]||ROLES.other, p={color:r.c,roughness:0.75,metalness:0.15,flatShading:true};
  if(role==='cup'){ p.metalness=0.6; p.roughness=0.4; p.side=THREE.DoubleSide; }
  if(role==='coil'){ p.metalness=0.7; p.roughness=0.35; }
  if(role==='shield'){ p.metalness=0.5; p.roughness=0.45; }
  if(role==='tank'){ p.transparent=true; p.opacity=0.55; p.emissive=new THREE.Color(0x0d2a3c); }
  if(role==='charges'){ p.emissive=new THREE.Color(0x4a2c00); }
  if(role==='console'){ p.emissive=new THREE.Color(0x0f2c44); }
  if(role==='door'){ p.emissive=new THREE.Color(0x3a2c00); }
  if(role==='duct'){ p.emissive=new THREE.Color(0x200840); }
  if(role==='cabin'){ p.transparent=true; p.opacity=0.35; p.depthWrite=false; }
  if(role==='hull'){ p.roughness=0.9; p.metalness=0.1; p.side=THREE.DoubleSide; }
  if(opt&&String(opt).charAt(0)==='#'){ p.color=new THREE.Color(opt); }
  return matCache[key]=new THREE.MeshStandardMaterial(p);
}

function buildHull(secs){
  if(!Array.isArray(secs)||secs.length<2) return null;
  secs=secs.slice().sort(function(a,b){return a.x-b.x;});
  var rings=secs.map(function(s){
    var hw=Math.max(0.05,+s.hw||0.5), yt=+s.yt, yb=+s.yb; if(!(yt>yb)){ yt=0.5; yb=-0.5; }
    var hh=(yt-yb)/2, ch=(typeof s.ch==='number')? s.ch : 0.22*Math.min(hw,hh);
    ch=Math.max(0,Math.min(ch,hw*0.98,hh*0.98));
    var x=+s.x||0;
    return [[yt,-hw+ch],[yt,hw-ch],[yt-ch,hw],[yb+ch,hw],[yb,hw-ch],[yb,-hw+ch],[yb+ch,-hw],[yt-ch,-hw]].map(function(p){ return new THREE.Vector3(x,p[0],p[1]); });
  });
  var pos=[];
  function tri(a,b,c){ pos.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z); }
  for(var i=0;i<rings.length-1;i++){
    var A=rings[i],B=rings[i+1];
    for(var k=0;k<8;k++){ var k2=(k+1)%8; tri(A[k],B[k],B[k2]); tri(A[k],B[k2],A[k2]); }
  }
  [rings[0],rings[rings.length-1]].forEach(function(R,ci){
    var c=new THREE.Vector3(); R.forEach(function(p){c.add(p);}); c.multiplyScalar(1/8);
    for(var k=0;k<8;k++){ var k2=(k+1)%8; if(ci===0) tri(c,R[k2],R[k]); else tri(c,R[k],R[k2]); }
  });
  var geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.computeVertexNormals();
  var mesh=new THREE.Mesh(geo,hullMat()); mesh.userData.hull=true; mesh.renderOrder=5;
  return mesh;
}

  var p={side:[0,0,D],top:[0,D,0.001],front:[D,0,0],iso:[D*0.62,D*0.45,D*0.62]}[kind]||[D*0.62,D*0.45,D*0.62];
  camera.position.set(c.x+p[0],c.y+p[1],c.z+p[2]); camera.up.set(0,1,0);
  if(controls){ controls.target.copy(c); controls.update(); } else camera.lookAt(c);
}
Array.prototype.forEach.call(document.querySelectorAll('#vbar button'),function(b){ b.onclick=function(){ fitCamera(b.dataset.cam); }; });

function resize(){
  if(!has3D) return; var w=view.clientWidth||600, h=view.clientHeight||400;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

function placeLabels(){
  var w=view.clientWidth,h=view.clientHeight,p=new THREE.Vector3();
  models.forEach(function(m){
    if(m.nameLbl){ var b=modelBox(m); p.set((b.min.x+b.max.x)/2,b.max.y+1,(b.min.z+b.max.z)/2).project(camera); m.nameLbl.style.left=((p.x+1)/2*w)+'px'; m.nameLbl.style.top=((1-p.y)/2*h)+'px'; m.nameLbl.style.display=p.z<1?'':'none'; }
    m.labelObjs.forEach(function(o){ var d=o.userData.lbl; if(!d) return; o.getWorldPosition(p); p.project(camera);
      d.style.display=(p.z<1&&o.visible)?'':'none'; d.style.left=((p.x+1)/2*w)+'px'; d.style.top=((1-p.y)/2*h)+'px'; });
  });
}
var frame=0;
function loop(now){
  requestAnimationFrame(loop);
  var moving=false;
  models.forEach(function(m){ m.movers.forEach(function(r){
    if(r.cur!==r.to){ var k=Math.min(1,(now-r.t0)/1300); r.cur= r.from+(r.to-r.from)*ease(k); if(k>=1) r.cur=r.to; moving=true;
      r.outer.quaternion.setFromAxisAngle(r.axis,r.cur*Math.PI/180); }
  }); });
  if(moving){ applyThrust(); if(frame%6===0) updateHud(); }
  else if(state._dirtyHud){ state._dirtyHud=false; updateHud(); }
  if(moving) state._dirtyHud=true;
  frame++;
  if(controls) controls.update();
  renderer.render(scene,camera);
  if(labelsEl.children.length) placeLabels();
}

/* ---------- controls ---------- */
document.getElementById('shell').onchange=function(e){ state.shell=e.target.value; applyShell(); };
document.getElementById('cHangar').onchange=function(e){ state.hangar=e.target.checked; rebuild(); };
document.getElementById('cThrust').onchange=function(e){ state.thrust=e.target.checked; applyThrust(); };
document.getElementById('cLabels').onchange=function(e){ state.labels=e.target.checked; rebuild(); };
document.getElementById('cGrid').onchange=function(e){ state.grid=e.target.checked; rebuild(); };


/* legend */
(function(){ var L=document.getElementById('legend'), h='';
  ['hull','wing','pod','cup','coil','shield','tank','charges','cabin','seat','console','door','gear','structure','other'].forEach(function(k){ var r=ROLES[k]; h+='<div><i style="background:#'+r.c.toString(16).padStart(6,'0')+'"></i>'+esc(r.n)+'</div>'; });
  h+='<div><i style="background:#ff2a2a"></i>погашенная камера</div><div><i style="background:#7fb8ff"></i>факел (∝ тяге)</div><div><i style="background:#ffe08a"></i>конус УВТ</div>';
  L.innerHTML=h; })();

Array.prototype.forEach.call(modesEl.children,function(b){ b.classList.toggle('on',b.dataset.m===state.mode); });
if(has3D){ resize(); }
setFail(null); selectTab(0);
if(has3D){ resize(); requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
