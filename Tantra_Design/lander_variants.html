"pivot":[2.75,0.2,-3.15],"axis":[0,1,0],"hover_deg":0,"transition_deg":0,"cruise_deg":0,"stowed_deg":0,"entry_deg":0,"min_deg":-100,"max_deg":0,"note_ru":"Открывается наружу только на грунте или в ангаре"}],"thrusters":[{"id":"T_FL","group":"pod_FL","origin":[4.2,0,-4.4],"dir":[-1,0,0],"thrust_MN":0.5,"vector_cone_deg":8},{"id":"T_FR","group":"pod_FR","origin":[4.2,0,4.4],"dir":[-1,0,0],"thrust_MN":0.5,"vector_cone_deg":8},{"id":"T_RL","group":"pod_RL","origin":[-5.8,0,-4.4],"dir":[-1,0,0],"thrust_MN":0.5,"vector_cone_deg":8},{"id":"T_RR","group":"pod_RR","origin":[-5.8,0,4.4],"dir":[-1,0,0],"thrust_MN":0.5,"vector_cone_deg":8}]}}],"compare":{"criteria":[{"key":"mtom","name_ru":"Взлётная масса"},{"key":"argon","name_ru":"Рабочая масса (аргон)"},{"key":"tw","name_ru":"Т/В на Земле"},{"key":"engine_out","name_ru":"Висение при отказе чаши"},{"key":"tvc","name_ru":"УВТ: диапазон / скорость / отклик"},{"key":"dose","name_ru":"Доза экипажу и экран (χ=0,1 %)"},{"key":"parts","name_ru":"Подвижных деталей / шарниров двигателя"},{"key":"hangar","name_ru":"Вписывание в ангар"},{"key":"runway","name_ru":"Взлёт/посадка на Земле"},{"key":"entry","name_ru":"Вход в атмосферу"},{"key":"crew","name_ru":"Удобство экипажа"},{"key":"risk","name_ru":"Технологический риск"},{"key":"kin","name_ru":"Родство с «Тантрой»"}],"rows":[{"id":"V1","name_ru":"V1 «Четыре поворотные гондолы»","cells":["55,9 т (сухая 24,8)","21,1 т (15,1 м³)","1,56 (0,85 МН)","На посадке (36,5 т): 2 диагональные чаши на 83 % мощности. На взлёте нужно +29 % мощности или сброс аргона до 43,5 т","Гондолы −90…+10° (100°), 20°/с; магнит ±8°; отклик 15 мс","≈0,03 мЗв; неподвижные W-пластины 2,2 т + гильзы 1,4 т; источник на оси шарнира, тень при любом угле","25 (из них 14 кресел); 4 вала гондол","Да: 19,0 × 14,24 × 3,65 м, по высоте запас 1,75 м","ВПП, вертикально; без тяги 103 м/с, полоса ~3 км; зона ≥2 км (струя)","Крыло 70° наветренное, на ТЗП (+0,4 т); задние гондолы на пилонах греются","Центральный проход, люк в тамбуре, ≤2,2 g, кресла полулёжа","Средний: КПД 0,6, магнитное отклонение ±8° — спекуляция; при спектре 500 кэВ экран ~8 т","Высокое: гондолы 0–100° как у «Тантры» и Э.МПУ"]},{"id":"V2","name_ru":"V2 «Две гондолы по две чаши»","cells":["64,7 т (сухая 29,45)","25,3 т (18,1 м³)","1,42 (0,90 МН; только при ЦМ ±0,15 м от вала)","Диагональная пара при любой массе: 94 % мощности на взлёте (vₑ 10 км/с), 72 % на посадке","−100…+15° (115°), 30°/с; магнит ±10°; импульсы 18 мс","≈0 от чаш; на пол 0,7 т против альбедо (≤1 мЗв); вкладыши 6,4 т, всего экран 7,1 т","11; 2 вала","Да, но высота 5,35 м из 5,4 (запас 5 см); 19,6 × 11,5 м","Вертикально; без тяги 105 м/с, полоса ≥3 км; зона ≥700 м","Гондолы −90° выступают под брюхо на 1,8 м, ТЗП торцов +0,5 т","≤1,65 g, сидя (спинка 60°); вход через коридор 1,8 м, пригнувшись","Высокий: при 500 кэВ экран ~38 т — схема рушится; vₑ ≤24 км/с упирается в охлаждение вкладыша; перекачка аргона для ЦМ","Среднее: поворотные гондолы, схема V-22"]},{"id":"V3","name_ru":"V3 «Хвостом вниз»","cells":["62,5 т (сухая 29,3)","23,2 т (17,4 м³)","1,43 (0,88 МН); на верхнем участке 0,81","3 чаши: Т/В 1,47 на взлёте, пара 1,46 на посадке (vₑ 11 км/с, мощность та же)","Карданы ±15°, 30°/с; магнит ±3°; отклик 5 мс","≈5 мЗв (наибольшая, но в норме); экран 7,9 т (кормовой 5,1 + облицовка 2,8)","18; 4 кардана (8 осей)","Да, лучшее: 16,0 × 7,1 × 5,0 м; на 20 мест 18,6 м — тоже входит","Площадка с отчуждением 1000 м; ВПП только аварийно на лыжу, 86 м/с","Днищем, крылья сложены; переворот на корму на ~2 км (риск, как у SN8)","Кабина на 12–17 м над грунтом, спуск стрелой с лебёдкой, 14 человек за ~4 мин; ряды кресел на валах","Средний: переворот, косой шарнир, Т/В <1 на выведении","Высокое: садится кормой, как «Тантра»; кресла по канону"]},{"id":"V4","name_ru":"V4 «Подъёмные + маршевая»","cells":["50,5 т (сухая 25,7) — наименьшая","14,5 т (10,9 м³) — наименьшая","1,35 (подъёмные 0,67 МН; вместе с маршевыми 1,27)","На взлёте нет: Т/В 0,90, ниже 30 м аварийная посадка. На посадке (36 т) да, ~1,1 номинала в худшем случае","Маршевые: кардан ±15° + магнит ±10° (25°), 30°/с; подъёмные — дифференциал за 3,5 мс","≤10 мЗв (на пределе); одна W-переборка 6,66 т; грузовой отсек не защищён","30; 2 кардана (4 оси), подъёмные неподвижны","Да: 19,1 × 13,45 × 3,95 м","Только с площадки с газоотводными лотками; без тяги 89 м/с; зона ≥500 м","Створки 2 × 4,8 м в ТЗП брюха — главный риск; кили на C/C","Проход 1,1 м, вход пешком; люк на 2,6 м с трапом-ступенью","Средний: газодинамика 6 струй у грунта, уплотнение створок","Низкое: схема Як-38"]},{"id":"V5","name_ru":"V5 «Неподвижные чаши»","cells":["52,9 т (сухая 20,75)","22,2 т (17,5 м³)","1,35 (по вертикали; висение с кабрированием 28°)","На посадке Т/В 1,44–1,59 только при магнитном отклонении ±3°, запас 5–15 %; на взлёте 0,84–0,92 — нет","Магнит ±3° у грунта, ±10° в пустоте + дифференциал 6 чаш + наклон аппарата; 7–15 мс; механики нет","≤10 мЗв; воротники W 2,15 т; при спектре 1 МэВ ×7 — не сходится","23 (14 кресел); шарниров в двигателе 0","Да: 18,6 × 12,9 × 5,1 м","ВПП или вертикально; без тяги 77 м/с; зона 600 м","Срезы чаш на наветренной фаске (C/SiC, не рассчитано)","Без прохода, посадка сразу в кресло; кабрирование 28° на посадке","Высокий: вся живучесть и УВТ держатся на ±3° магнита","Низкое: «Тантра» поворачивает сопла, а здесь неподвижные"]},{"id":"V6","name_ru":"V6c «Пегас-2»","cells":["150,4 т — в 3 раза больше прикидки","67,4 т (48 м³)","1,35 (1,99 МН)","Отказ камеры: диагональ на 130 %, Т/В 1,56 на посадке, но по крену маргинально — посадка по-самолётному","Кольца −95…+100° (195°), 30°/с; магнит ±8°, 10 мс","≤10 мЗв при T каналов ≤50 кэВ; при 100 кэВ ≥30 Гр; экраны 16,4 т","12; 4 поворотных кольца","По габариту да (18,6 × 13,5 × 3,9 м), но ложемент и толкатель на 150 т","Вертикально или ВПП 100 м/с; зона 1,1 км (консервативно 2,9)","Гондолы за бортом на 1,6 м, не в тени","Кресла неподвижны, салон одновременно грузовой","Очень высокий: пропускание каналов, альфа-частицы, срыв поля канала","Среднее: один источник, поворотные сопла"]}],"ranking":["V1","V2","V3","V4","V5","V6"],"recommendation_ru":"Предлагаю V1 «Четыре поворотные гондолы» (решение за Вами). 55,9 т, Т/В 1,56 — лучший запас тяги. Вписывается в ангар без роста (19,0 × 14,24 × 3,65 м). Источник стоит на оси шарнира, поэтому неподвижный экран 2,2 т закрывает кабину при любом угле. УВТ прямо наследует гондолы 0–100° «Тантры» и Э.МПУ.","why_ru":"V1 — единственный вариант без провала ни по одному критерию. Т/В 1,56 при требовании 1,35. Доза ≈0,03 мЗв даёт самый большой запас на неизвестный спектр. Высоты в ангаре остаётся 1,75 м. Перегрузки ≤2,2 g. Есть центральный проход. Ценой этого стали 25 подвижных деталей (без кресел — 11) и масса на 4–9 т выше прикидки, но у V2–V6 масса не меньше, кроме V4. Слабое место — отказ чаши на взлёте. Его можно закрыть без форсажа (см. гибриды). У V2 запас по высоте в ангаре 5 см. V3 нельзя сажать на ВПП. У V4 нет висения при отказе на взлёте. У V5 УВТ держится на ±3° магнита. V6 весит 150 т.","runner_up_ru":"V2 «Две гондолы по две чаши»: отказ любой чаши парируется без форсажа при любой массе, всего 11 подвижных деталей, ≤1,65 g, кресла сидя. Против: 64,7 т, экран 7,1 т, по высоте в ангаре запас 5 см, при спектре 500 кэВ схема не сходится. Если хотите корабль, похожий на «Тантру» и с минимумом деталей, третьим идёт V3 (доза ~5 мЗв, ангар 16 × 7,1 м).","hybrids_ru":"1) V1 + логика отказа из V2/V3: при отказе на взлёте снижать vₑ до ~11,7 км/с при той же мощности 1,6 ГВт. Получается 274 кН на чашу, без форсажа +29 % и без сброса аргона. Расход ~23 кг/с на чашу, на 20–30 с. 2) V1 + конический W-вкладыш V2 только у горловины (вместо гильзы и части пластин): защищает и катушку, и кабину. Нужна проверка массы. 3) V1 с грузом и аргоном точно на оси ЦМ, как у V2, и перекачкой аргона между секциями баков: ход ЦМ ≤±0,15 м. 4) Для варианта на 20 мест — 6 откидных кресел в грузовом отсеке V1 (−0,6 т груза), ангар не растёт.","common_assumptions_ru":"Принято во всех вариантах:\n- Синтез ионно-триггерный (канон), χ=0,1 % (не утверждено), поле 12,1 Тл (58,3 МПа). Предел тяги задаёт мощность, а не поле: запас по полю ×5…×1000.\n- Рабочая масса — жидкий аргон из запаса «Тантры»; ионные заряды 0,1–0,2 кг на рейс, узел с инжектором 0,3–0,4 т.\n- Нагрузка 10 т на весь рейс Земля → НОО → сход → посадка с 45 с висения; Δv 10,0–10,9 км/с.\n- vₑ у грунта 15 км/с; перегрузки ≤3 g; кресла на гидрошарнирах (кроме V6).\n- Приборы фотонно-аналоговые, 2–3 контура.\n- Ориентация у «Тантры» — газовые сопла на аргоне; чаши не включаются ближе 0,6–5 км.\n- Химии, водорода и анамезона нет ни в одном варианте.","cautions_ru":["Спектр χ у вариантов разный: V1 200 кэВ, V2 150 кэВ, V3 300 кэВ, V4 тормозное kT 50 кэВ, V5 ≤300 кэВ, V6 ~1 МэВ для камер. Поэтому массы экранов (2,2…16,4 т) и дозы напрямую несравнимы. При общем спектре 500 кэВ V2 и V5 не сходятся, у V1 экран вырастет до ~8 т","Нейтроны нигде не учтены: вольфрам их не держит, все экраны рассчитаны на безнейтронную реакцию","КПД струи разный: 0,6 (V1), 0,5 (V2, V3, V5), η(vₑ) 0,59–0,84 (V4). Масса зарядов и тепло на стенку от этого расходятся до ×2","Предел vₑ в пустоте разный: у V2 24 км/с (охлаждение вкладыша аргоном), у V1 и V4 40 км/с, у V5 до 60 км/с при сопоставимой нагрузке на стенку. Охлаждение пересчитано только у V2","При отказе чаши V1 берёт форсаж мощности +29 %, а V2 и V3 снижают vₑ при той же мощности. Для V1 второй путь тоже возможен и дешевле","Опасные зоны на грунте считались по-разному (с накоплением в воздухе и без): от 0,35 км (V1) до 1,1–2,9 км (V6). Струя по канону ~300 м во всех вариантах","Грузоподъёмность подъёмника нижних створок (рассчитан на МПУ, платформа 9 м) никто не знает, а для старта с «Тантры», лежащей на грунте, от неё зависят V1, V4 и V6","Сеть Δv-бюджетов: у V5 добавлен штраф 0,6 км/с за кант, у V1 гравитационные потери заложены внутри 9,3 км/с. Методики близки, но не одинаковы (погрешность ±0,5 км/с ≈ ±3 т взлётной)"],"open_questions_ru":["χ: 0,1 % или 0,001 %? Спектр мягкий (≤300 кэВ) или жёсткий, есть ли нейтроны? От этого зависят экраны (±2–6 т) и выживание V2 и V5","Какова грузоподъёмность подъёмника нижних створок? Нужно ≥56 т и опора 19 м — иначе старт с «Тантры» на грунте невозможен","Нагрузка 10 т на весь рейс или только вверх? При пустом спуске взлётная масса V1 ~47 т","14 или 20 мест: удлинять ангар (+0,8…1,8 м) или ставить 6 кресел в грузовом отсеке?","Допустима ли посадка без тяги на 89–105 м/с с ВПП ~3 км?","Какую схему выбрать за основу: V1 (рекомендация), V2 или V3? И принимаете ли гибрид «V1 + снижение vₑ при отказе»?"]}}</script>

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function txt(s){ // multi-line text -> html (lines "- " -> list)
  if(s==null||s==='') return '<p class="note">нет данных</p>';
  var lines=String(s).split('\n'), out='', inList=false;

    if(/^\s*-\s+/.test(l)){ if(!inList){out+='<ul>';inList=true;} out+='<li>'+esc(l.replace(/^\s*-\s+/,''))+'</li>'; }
    else { if(inList){out+='</ul>';inList=false;} if(l.trim()) out+='<p>'+esc(l)+'</p>'; }
  });
  if(inList) out+='</ul>';

var matCache={};
function mat(role,opt){
  var key=role+'|'+(opt||'');
  if(matCache[key]) return matCache[key];
  var r=ROLES[role]||ROLES.other, p={color:r.c,roughness:0.75,metalness:0.15,flatShading:true};
  if(role==='cup'){ p.metalness=0.6; p.roughness=0.4; p.side=THREE.DoubleSide; }
  if(role==='coil'){ p.metalness=0.7; p.roughness=0.35; }
  if(role==='shield'){ p.metalness=0.5; p.roughness=0.45; }
  if(role==='tank'){ p.transparent=true; p.opacity=0.55; p.emissive=new THREE.Color(0x0d2a3c); }
  if(role==='charges'){ p.emissive=new THREE.Color(0x4a2c00); }
  if(role==='console'){ p.emissive=new THREE.Color(0x0f2c44); }
  if(role==='door'){ p.emissive=new THREE.Color(0x3a2c00); }
  if(role==='duct'){ p.emissive=new THREE.Color(0x200840); }
  if(role==='cabin'){ p.transparent=true; p.opacity=0.35; p.depthWrite=false; }
  if(role==='hull'){ p.roughness=0.9; p.metalness=0.1; p.side=THREE.DoubleSide; }
  return matCache[key]=new THREE.MeshStandardMaterial(p);
}
function hullMat(){
  var m=mat('hull');
  if(state.shell==='glass'){ m.transparent=true; m.opacity=0.22; m.depthWrite=false; }
  else { m.transparent=false; m.opacity=1; m.depthWrite=true; }
  m.needsUpdate=true; return m;
}
function v3(a,d){ return (Array.isArray(a)&&a.length>=3)? new THREE.Vector3(+a[0]||0,+a[1]||0,+a[2]||0) : (d||new THREE.Vector3()); }
function orientAxis(geo,axis){ // geometry built along +y
  if(axis==='x') geo.rotateZ(-Math.PI/2);
  else if(axis==='z') geo.rotateX(Math.PI/2);
}

function buildHull(secs){
  if(!Array.isArray(secs)||secs.length<2) return null;
  secs=secs.slice().sort(function(a,b){return a.x-b.x;});
  var rings=secs.map(function(s){
    var hw=Math.max(0.05,+s.hw||0.5), yt=+s.yt, yb=+s.yb; if(!(yt>yb)){ yt=0.5; yb=-0.5; }
    var hh=(yt-yb)/2, ch=(typeof s.ch==='number')? s.ch : 0.22*Math.min(hw,hh);
    ch=Math.max(0,Math.min(ch,hw*0.98,hh*0.98));
    var x=+s.x||0;
    return [[yt,-hw+ch],[yt,hw-ch],[yt-ch,hw],[yb+ch,hw],[yb,hw-ch],[yb,-hw+ch],[yb+ch,-hw],[yt-ch,-hw]].map(function(p){ return new THREE.Vector3(x,p[0],p[1]); });
  });
  var pos=[];
  function tri(a,b,c){ pos.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z); }
  for(var i=0;i<rings.length-1;i++){
    var A=rings[i],B=rings[i+1];
    for(var k=0;k<8;k++){ var k2=(k+1)%8; tri(A[k],B[k],B[k2]); tri(A[k],B[k2],A[k2]); }
  }
  [rings[0],rings[rings.length-1]].forEach(function(R,ci){
    var c=new THREE.Vector3(); R.forEach(function(p){c.add(p);}); c.multiplyScalar(1/8);
    for(var k=0;k<8;k++){ var k2=(k+1)%8; if(ci===0) tri(c,R[k2],R[k]); else tri(c,R[k],R[k2]); }
  });
  var geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.computeVertexNormals();
  var mesh=new THREE.Mesh(geo,hullMat()); mesh.userData.hull=true; mesh.renderOrder=5;
  return mesh;
}

function buildPrim(p){
  var d=Array.isArray(p.dims)?p.dims.map(Number):[], geo=null, axis=p.axis||'y', role=roleOf(p.role);
  if(p.kind==='box'){
    var lx=d[0]||0.3,ly=d[1]||0.3,lz=d[2]||0.3;
    if(role==='door'){ // octagonal plate along thinnest axis
      var t=Math.min(lx,ly,lz), ax= t===lx?'x':(t===lz?'z':'y'), others= ax==='x'?[ly,lz]:(ax==='z'?[lx,ly]:[lx,lz]);
      geo=new THREE.CylinderGeometry(Math.min(others[0],others[1])/2/Math.cos(Math.PI/8),Math.min(others[0],others[1])/2/Math.cos(Math.PI/8),Math.max(t,0.04),8);
      geo.rotateY(Math.PI/8); orientAxis(geo,ax);
    } else geo=new THREE.BoxGeometry(Math.max(lx,0.01),Math.max(ly,0.01),Math.max(lz,0.01));
  } else if(p.kind==='cylinder'){
    var segs = role==='door'?8:20;
    geo=new THREE.CylinderGeometry(d[0]||0.2,d[0]||0.2,Math.max(d[1]||0.5,0.02),segs); orientAxis(geo,axis);
  } else if(p.kind==='cone'){
    var r1,r2,L;
    if(d.length>=3){ r1=Math.max(d[0],d[1]); r2=Math.min(d[0],d[1]); L=d[2]; } else { r1=d[0]||0.5; r2=0; L=d[1]||1; }
    var open = role==='cup'||role==='shield';
    geo=new THREE.CylinderGeometry(r2,r1,Math.max(L,0.02),24,1,open); orientAxis(geo,axis);
  } else if(p.kind==='sphere'){
    geo=new THREE.SphereGeometry(d[0]||0.5,20,14);
  } else if(p.kind==='torus'){
    geo=new THREE.TorusGeometry(d[0]||0.5,Math.max(d[1]||0.05,0.01),10,32);
    if(axis==='y') geo.rotateX(Math.PI/2); else if(axis==='x') geo.rotateY(Math.PI/2);
  }
  if(!geo) return null;
  var m=new THREE.Mesh(geo,mat(role)); var c=v3(p.center); m.position.copy(c);
  m.userData={role:role,id:p.id,note:p.note_ru||''};
  if(role==='shield'&&p.kind==='cone'){ m.material=mat('shield'); }
  return m;
}

function buildWing(w){
  var s=(w.side==='L')?-1:1, rl=v3(w.root_le), span=+w.span||1, rc=+w.root_chord||1, tc=(typeof w.tip_chord==='number')?w.tip_chord:rc*0.5;
  var sw=(+w.le_sweep_deg||0)*Math.PI/180, dh=(+w.dihedral_deg||0)*Math.PI/180, th=(typeof w.thickness==='number')?w.thickness:0.25;
  var sdir=new THREE.Vector3(0,Math.sin(dh),s*Math.abs(Math.cos(dh))); // span direction; >90° = outward cant
  var nrm=new THREE.Vector3(0,-sdir.z,sdir.y); if(nrm.y<0||(Math.abs(nrm.y)<1e-6&&nrm.z<0)) nrm.multiplyScalar(-1); nrm.normalize();
  var tipLE=rl.clone().add(sdir.clone().multiplyScalar(span)); tipLE.x-=span*Math.tan(sw);
  var rootTE=rl.clone(); rootTE.x-=rc; var tipTE=tipLE.clone(); tipTE.x-=tc;
  var P=[rl,tipLE,tipTE,rootTE], ht=th/2, htt=th/2*0.6;
  var top=P.map(function(p,i){ return p.clone().add(nrm.clone().multiplyScalar(i===1||i===2?htt:ht)); });
  var bot=P.map(function(p,i){ return p.clone().add(nrm.clone().multiplyScalar(-(i===1||i===2?htt:ht))); });
  var pos=[]; function tri(a,b,c){ pos.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z); }
  tri(top[0],top[1],top[2]); tri(top[0],top[2],top[3]); tri(bot[0],bot[2],bot[1]); tri(bot[0],bot[3],bot[2]);
  for(var k=0;k<4;k++){ var k2=(k+1)%4; tri(top[k],bot[k],bot[k2]); tri(top[k],bot[k2],top[k2]); }
  var geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.computeVertexNormals();
  var m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:ROLES.wing.c,roughness:0.8,metalness:0.15,flatShading:true,side:THREE.DoubleSide}));
  m.userData={role:'wing',id:w.group,note:''}; return m;
}

var glowTex=null;
function getGlow(){
  if(glowTex) return glowTex;
  var c=document.createElement('canvas'); c.width=c.height=64; var x=c.getContext('2d');
  var gr=x.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.3,'rgba(150,200,255,.8)'); gr.addColorStop(1,'rgba(60,110,255,0)');
  x.fillStyle=gr; x.fillRect(0,0,64,64); glowTex=new THREE.CanvasTexture(c); return glowTex;
}
function buildThruster(t){
  var o=v3(t.origin), dir=v3(t.dir,new THREE.Vector3(0,-1,0)); if(dir.lengthSq()<1e-6) dir.set(0,-1,0); dir.normalize();
  var F=+t.thrust_MN||0.1, L=Math.max(1.5,F*28), cone=(+t.vector_cone_deg||5)*Math.PI/180;
  var grp=new THREE.Group(); grp.position.copy(o);
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  var jg=new THREE.CylinderGeometry(0.12+F*0.6,0.06,L,16,1,true); jg.translate(0,L/2,0);
  var jet=new THREE.Mesh(jg,new THREE.MeshBasicMaterial({color:0x7fb8ff,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  var cL=L*0.85, cg=new THREE.CylinderGeometry(cL*Math.tan(cone),0.001,cL,24,1,true); cg.translate(0,cL/2,0);
  var cm=new THREE.Mesh(cg,new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,opacity:0.12,depthWrite:false,side:THREE.DoubleSide}));
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:getGlow(),color:0xaad4ff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.scale.set(1.4,1.4,1.4);
  grp.add(jet); grp.add(cm); grp.add(sp);
  grp.userData={thruster:true,id:t.id,F:F,localDir:dir.clone()};
  return grp;
}

function ease(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function modeAngle(mv,mode){ var a=mv[mode+'_deg']; return (typeof a==='number')?a:0; }

function buildModel(v,opt){
  var G=v.geometry||{}, root=new THREE.Group(), groups={}, model={v:v,root:root,movers:[],thr:[],labelObjs:[]};
  function grp(name){
    if(!name||name==='body') return root;
    if(groups[name]) return groups[name].inner;
    var mv=(Array.isArray(G.movers)?G.movers:[]).filter(function(m){return m.group===name;})[0];
    var outer=new THREE.Group(), inner=new THREE.Group();
    if(mv){
      var pv=v3(mv.pivot); outer.position.copy(pv); inner.position.copy(pv).multiplyScalar(-1);
      var ax=v3(mv.axis,new THREE.Vector3(0,0,1)); if(ax.lengthSq()<1e-9) ax.set(0,0,1); ax.normalize();
      var a0=modeAngle(mv,state.mode);
      var rec={outer:outer,axis:ax,mv:mv,cur:a0,from:a0,to:a0,t0:0};
      outer.quaternion.setFromAxisAngle(ax,a0*Math.PI/180);
      model.movers.push(rec);
    }
    outer.add(inner); root.add(outer); groups[name]={outer:outer,inner:inner};
    return inner;
  }
  var hull=buildHull(G.hull_sections); if(hull){ root.add(hull); model.hull=hull; }
  (Array.isArray(G.primitives)?G.primitives:[]).forEach(function(p){
    try{ var m=buildPrim(p); if(m){ grp(p.group).add(m); if(p.note_ru||p.id) model.labelObjs.push(m); } }catch(e){ console.warn('prim',p&&p.id,e); }
  });
  (Array.isArray(G.wings)?G.wings:[]).forEach(function(w){ try{ grp(w.group).add(buildWing(w)); }catch(e){ console.warn('wing',e); } });
  (Array.isArray(G.thrusters)?G.thrusters:[]).forEach(function(t){ try{ var th=buildThruster(t); grp(t.group).add(th); model.thr.push(th); }catch(e){ console.warn('thr',e); } });
  return model;
}

function clearWorld(){
  while(world.children.length){ var c=world.children[0]; world.remove(c); c.traverse(function(o){ if(o.geometry) o.geometry.dispose(); }); }
  models=[]; extras=[]; labelsEl.innerHTML='';
}
function modelBox(m){
  var b=new THREE.Box3(); m.root.updateMatrixWorld(true);
  m.root.traverse(function(o){
    if(!o.isMesh) return; var p=o.parent, skip=false; while(p){ if(p.userData&&p.userData.thruster){skip=true;break;} p=p.parent; }
    if(skip) return; if(!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    var bb=o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld); b.union(bb);
  });
  return b;
}

var hangarObjs=[];
function lineBox(sx,sy,sz,color,dashed){
  var geo=new THREE.EdgesGeometry(new THREE.BoxGeometry(sx,sy,sz));
  var m=dashed? new THREE.LineDashedMaterial({color:color,dashSize:0.6,gapSize:0.4}) : new THREE.LineBasicMaterial({color:color});
  var l=new THREE.LineSegments(geo,m); if(dashed) l.computeLineDistances(); return l;
}
function makeHangar(m){
  var H=new THREE.Group(); H.userData.hangar=true;
  var frame=lineBox(20.2,5.4,24,0x66ccff); frame.position.y=2.7; H.add(frame);
  var door=lineBox(20,0.01,16.7,0x9ad8ff,true); door.position.y=9.4; H.add(door);
  var post=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,5.4,0),new THREE.Vector3(0,9.4,0)]);
  H.add(new THREE.Line(post,new THREE.LineDashedMaterial({color:0x9ad8ff,dashSize:0.3,gapSize:0.3})));
  var mpu=lineBox(20.2,3,24,0x8a7a4a,true); mpu.position.y=-1.5; H.add(mpu);
  var cradle=new THREE.Mesh(new THREE.BoxGeometry(8,0.08,3),new THREE.MeshStandardMaterial({color:0x445566})); cradle.position.y=-0.04; H.add(cradle);
  var bad=lineBox(1,1,1,0xff3030); bad.visible=false; H.add(bad); H.userData.bad=bad;
  m.hangar=H; world.add(H); return H;
}
function updateHangar(m){
  if(!m.hangar) return null;
  var b=modelBox(m), sz=new THREE.Vector3(), c=new THREE.Vector3(); b.getSize(sz); b.getCenter(c);
  m.hangar.position.set(c.x+m.root.position.x - m.root.position.x, b.min.y, m.root.position.z + 0);
  m.hangar.position.x=c.x; m.hangar.position.z=c.z;
  var ex={L:sz.x-20.2,W:sz.z-24,Wd:sz.z-16.7,H:sz.y-5.4}, bad=m.hangar.userData.bad;
  var over=ex.L>0.005||ex.W>0.005||ex.H>0.005;
  bad.visible=over; if(over){ bad.scale.set(Math.max(sz.x,0.1),Math.max(sz.y,0.1),Math.max(sz.z,0.1)); bad.position.set(0,sz.y/2,0); bad.position.x=c.x-m.hangar.position.x; bad.position.z=c.z-m.hangar.position.z; }
  return {sz:sz,ex:ex};
}

function rebuild(){
  if(!has3D) { updateHud(); return; }
  try{
    clearWorld();
    var t=TABS[state.tab]; if(!t||t.k!=='v') return;
    var six=state.six&&state.mode==='stowed';
    var list= six? VARS : [VARS[t.i]];
    list.forEach(function(v,i){
      if(!v) return;
      var m=buildModel(v); if(six){ m.root.position.z=(i-(list.length-1)/2)*27; }
      world.add(m.root); models.push(m);
      if(state.hangar||six){ var H=makeHangar(m); H.position.z=m.root.position.z; }
      if(six){ var d=document.createElement('div'); d.className='lbl'; d.textContent=v.id; d.style.fontSize='12px'; labelsEl.appendChild(d); m.nameLbl=d; }
    });
    // grid
    var gb=new THREE.Box3(); models.forEach(function(m){ gb.union(modelBox(m)); });
    if(state.grid){
      var span=Math.ceil(Math.max(gb.max.x-gb.min.x, gb.max.z-gb.min.z, 20)+8); if(span%2) span++;
      grid=new THREE.GridHelper(span,span,0x3a4a60,0x1c2430); grid.position.y=(isFinite(gb.min.y)?gb.min.y:-2)-0.02;
      grid.position.x=isFinite(gb.min.x)?(gb.min.x+gb.max.x)/2:0; grid.position.z=isFinite(gb.min.z)?(gb.min.z+gb.max.z)/2:0;
      world.add(grid);
    }
    if(!six&&state.labels) buildLabels();
    applyShell(); applyThrust();
    if(!camera.userData.placed||state._refit){ fitCamera('iso'); camera.userData.placed=true; state._refit=false; }
    updateHud();
  }catch(e){ console.warn(e); hud.textContent='Ошибка построения: '+e.message; }
}
function buildLabels(){
  labelsEl.innerHTML='';
  models.forEach(function(m){
    var seen={};
    m.labelObjs.forEach(function(o){
      var r=o.userData.role, key=r+'|'+(o.userData.note||'');
      if(!o.userData.note && seen[r]) return; if(seen[key]) return; seen[key]=1; seen[r]=1;
      var d=document.createElement('div'); d.className='lbl';
      var nm=(ROLES[r]||ROLES.other).n; d.textContent=nm+(o.userData.note?': '+o.userData.note:'');
      d.style.borderColor='#'+(ROLES[r]||ROLES.other).c.toString(16).padStart(6,'0');
      labelsEl.appendChild(d); o.userData.lbl=d;
    });
  });
}
function applyShell(){
  models.forEach(function(m){ if(m.hull){ m.hull.visible=state.shell!=='none'; m.hull.material=hullMat(); } });
}
function thrustActive(m,th){
  if(!state.thrust) return false;
  if(state.mode==='stowed'||state.mode==='entry') return false;
  if(state.mode==='cruise'){
    // в полёте подъёмные (вниз, в корпусе) молчат, если есть маршевые
    var wd=new THREE.Vector3(); th.updateMatrixWorld(true);
    wd.copy(new THREE.Vector3(0,1,0)).applyQuaternion(th.getWorldQuaternion(new THREE.Quaternion()));
    var anyMarch=m.thr.some(function(o){ var q=o.getWorldQuaternion(new THREE.Quaternion()); return new THREE.Vector3(0,1,0).applyQuaternion(q).y>-0.9; });
    if(wd.y<-0.9 && anyMarch) return false;
  }
  return true;
}
function applyThrust(){
  models.forEach(function(m){ m.root.updateMatrixWorld(true); m.thr.forEach(function(th){ th.visible=thrustActive(m,th); }); });
}
function setMode(k){
  var prevSix=state.six&&state.mode==='stowed';
  state.mode=k;
  Array.prototype.forEach.call(modesEl.children,function(b){ b.classList.toggle('on',b.dataset.m===k); });
  var nowSix=state.six&&state.mode==='stowed';
  if(prevSix!==nowSix){ state._refit=true; rebuild(); return; }
  var now=performance.now();
  models.forEach(function(m){ m.movers.forEach(function(r){ r.from=r.cur; r.to=modeAngle(r.mv,k); r.t0=now; }); });
  updateHud();
}

function tvcAngle(v){
  var m=models[0]; if(!m) return '—';
  var thrGroups=(g(v,'geometry.thrusters',[])||[]).map(function(t){return t.group;});
  var r=m.movers.filter(function(x){ return thrGroups.indexOf(x.mv.group)>=0; })[0];
  if(r) return num(r.cur,0)+'° ('+esc(r.mv.group)+')';
  return 'чаши неподвижны';
}
var lastHud=0;
function updateHud(){
  var t=TABS[state.tab]; if(!t||t.k!=='v'){ return; }
  var v=VARS[t.i]||{}, mname=(MODES.filter(function(x){return x.k===state.mode;})[0]||{}).n;
  var tc=g(v,'tvc.range_deg'), cone=(g(v,'geometry.thrusters',[])||[]).map(function(x){return x.vector_cone_deg||0;});
  var h='<b>'+esc(v.name_ru||v.id)+'</b><br>Режим: '+esc(mname)+'<br>Взлётная масса: '+num(g(v,'mass.mtom_t'),1)+' т · Т/В '+num(g(v,'mass.tw_earth'),2)+
    '<br>Угол УВТ: '+tvcAngle(v)+(cone.length?' · магнит ±'+num(Math.max.apply(null,cone),0)+'°':'')+(typeof tc==='number'?' · ход '+num(tc,0)+'°':'');
  var note='';
  if(has3D&&models.length){
    var fitTxt=[];
    models.forEach(function(m){
      var r=m.hangar?updateHangar(m):null; if(!r){ var b=modelBox(m),s=new THREE.Vector3(); b.getSize(s); r={sz:s,ex:{L:s.x-20.2,W:s.z-24,Wd:s.z-16.7,H:s.y-5.4}}; }
      var e=r.ex, bad=[]; if(e.L>0.005) bad.push('длина +'+num(e.L,2)+' м'); if(e.W>0.005) bad.push('ширина +'+num(e.W,2)+' м'); if(e.H>0.005) bad.push('высота +'+num(e.H,2)+' м');
      var dw=e.Wd>0.005?' <span class="warn">(шире проёма 16,7 м на '+num(e.Wd,2)+' м)</span>':'';
      fitTxt.push('<b>'+esc(m.v.id)+'</b> модель '+num(r.sz.x,2)+' × '+num(r.sz.z,2)+' × '+num(r.sz.y,2)+' м: '+(bad.length?'<span class="bad">выход за ангар — '+bad.join(', ')+'</span>':'<span class="ok">в объёме ангара</span>')+dw);
    });
    if(state.hangar||state.mode==='stowed'){ h+='<br>'+fitTxt.map(function(s){return s.replace(/class="(ok|bad|warn)"/g,function(_,k){return 'style="color:'+(k==='ok'?'#6fe39a':k==='bad'?'#ff6b6b':'#ffcc66')+'"';});}).join('<br>'); }
    note='Габарит модели в текущем режиме (без факелов): '+fitTxt.join(' · ')+'. Расчётные габариты варианта — в разделе «Ангар».';
  }
  hud.innerHTML=h;
  document.getElementById('hangarNote').innerHTML=note;
}

function fitCamera(kind){
  if(!has3D) return;
  var b=new THREE.Box3(); models.forEach(function(m){ b.union(modelBox(m)); });
  var c=new THREE.Vector3(), s=new THREE.Vector3(); if(b.isEmpty()){ c.set(0,0,0); s.set(20,5,10);} else { b.getCenter(c); b.getSize(s); }
  var R=Math.max(s.x,s.y,s.z)*0.5, D=R/Math.sin(camera.fov*Math.PI/360)*1.05+4;
  var p={side:[0,0,D],top:[0,D,0.001],front:[D,0,0],iso:[D*0.62,D*0.45,D*0.62]}[kind]||[D*0.62,D*0.45,D*0.62];
  camera.position.set(c.x+p[0],c.y+p[1],c.z+p[2]); camera.up.set(0,1,0);
  if(controls){ controls.target.copy(c); controls.update(); } else camera.lookAt(c);
}
Array.prototype.forEach.call(document.querySelectorAll('#vbar button'),function(b){ b.onclick=function(){ fitCamera(b.dataset.cam); }; });

function resize(){
  if(!has3D) return; var w=view.clientWidth||600, h=view.clientHeight||400;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

function placeLabels(){
  var w=view.clientWidth,h=view.clientHeight,p=new THREE.Vector3();
  models.forEach(function(m){
    if(m.nameLbl){ var b=modelBox(m); p.set((b.min.x+b.max.x)/2,b.max.y+1,(b.min.z+b.max.z)/2).project(camera); m.nameLbl.style.left=((p.x+1)/2*w)+'px'; m.nameLbl.style.top=((1-p.y)/2*h)+'px'; m.nameLbl.style.display=p.z<1?'':'none'; }
    m.labelObjs.forEach(function(o){ var d=o.userData.lbl; if(!d) return; o.getWorldPosition(p); p.project(camera);
      d.style.display=(p.z<1&&o.visible)?'':'none'; d.style.left=((p.x+1)/2*w)+'px'; d.style.top=((1-p.y)/2*h)+'px'; });
  });
}
var frame=0;
function loop(now){
  requestAnimationFrame(loop);
  var moving=false;
  models.forEach(function(m){ m.movers.forEach(function(r){
    if(r.cur!==r.to){ var k=Math.min(1,(now-r.t0)/1300); r.cur= r.from+(r.to-r.from)*ease(k); if(k>=1) r.cur=r.to; moving=true;
      r.outer.quaternion.setFromAxisAngle(r.axis,r.cur*Math.PI/180); }
  }); });
  if(moving){ applyThrust(); if(frame%6===0) updateHud(); }
  else if(state._dirtyHud){ state._dirtyHud=false; updateHud(); }
  if(moving) state._dirtyHud=true;
  frame++;
  if(controls) controls.update();
  renderer.render(scene,camera);
  if(labelsEl.children.length) placeLabels();
}

/* ---------- controls ---------- */
document.getElementById('shell').onchange=function(e){ state.shell=e.target.value; applyShell(); };
document.getElementById('cHangar').onchange=function(e){ state.hangar=e.target.checked; rebuild(); };
document.getElementById('cThrust').onchange=function(e){ state.thrust=e.target.checked; applyThrust(); };
document.getElementById('cLabels').onchange=function(e){ state.labels=e.target.checked; rebuild(); };
document.getElementById('cGrid').onchange=function(e){ state.grid=e.target.checked; rebuild(); };
document.getElementById('cSix').onchange=function(e){ state.six=e.target.checked; state._refit=true; rebuild(); };

/* legend */
(function(){ var L=document.getElementById('legend'), h='';
  ['hull','wing','pod','cup','coil','shield','tank','charges','cabin','seat','console','door','gear','structure','duct','other'].forEach(function(k){ var r=ROLES[k]; h+='<div><i style="background:#'+r.c.toString(16).padStart(6,'0')+'"></i>'+esc(r.n)+'</div>'; });
  h+='<div><i style="background:#7fb8ff"></i>факел (∝ тяге)</div><div><i style="background:#ffe08a"></i>конус УВТ</div>';
  L.innerHTML=h; })();

Array.prototype.forEach.call(modesEl.children,function(b){ b.classList.toggle('on',b.dataset.m===state.mode); });
if(has3D){ resize(); }
if(VARS.length){ selectTab(0); } else { selectTab(TABS.length-1); }
if(has3D){ resize(); requestAnimationFrame(loop); }
})();
</script>
