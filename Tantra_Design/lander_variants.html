<style>

*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
#wrap{display:grid;grid-template-columns:1fr 430px;min-height:100vh}

h3{font-size:14px;margin:6px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;overflow-x:auto}
button{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:#f7f9fb;color:var(--ink);cursor:pointer}

.btns{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.chk{display:inline-flex;gap:5px;align-items:center;margin:2px 10px 2px 0;font-size:13px}
select{font:inherit;padding:3px 5px;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:3px 5px;border-bottom:1px solid #eef1f4;vertical-align:top;text-align:left}
th{color:var(--muted);font-weight:600}
td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{font-size:12px;color:var(--muted)}
.big{font-size:15px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:#fdf1d8;color:#8a5a00;border:1px solid #f0d49a;margin-left:6px}
ul{margin:4px 0 4px 18px;padding:0}
li{margin:2px 0}
p{margin:4px 0}
#view3d{position:relative;height:560px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
#view3d canvas{display:block}
#vhud{position:absolute;left:10px;top:10px;color:#fff;font-size:12px;background:rgba(0,0,0,.5);padding:6px 9px;border-radius:6px;max-width:62%;pointer-events:none}

#legend{position:absolute;right:10px;top:10px;color:#ddd;font-size:11px;background:rgba(0,0,0,.5);padding:6px 8px;border-radius:6px;max-height:70%;overflow:auto}
#legend div{display:flex;align-items:center;gap:6px;margin:1px 0}
#legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.3)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);color:#fff;font-size:10.5px;background:rgba(10,14,22,.72);border:1px solid rgba(255,255,255,.25);padding:1px 5px;border-radius:4px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#fail{position:absolute;inset:0;color:#eee;padding:20px;display:none;overflow:auto}
#wide{display:none}
.cmp th:first-child,.cmp td:first-child{min-width:150px;font-weight:600}
.cmp td{min-width:150px;font-size:12.5px}
.rec{border-left:4px solid var(--acc);background:#f2f7fd}
@media (max-width:900px){#wrap{grid-template-columns:1fr}#side{border-left:0;border-top:1px solid var(--line);max-height:none}#view3d{height:420px}#legend{display:none}}

<script type="application/json" id="data">{"generated_for":"Тантра — спасательная ракета / лэндер, 6 вариантов","variants":[{"id":"V1","name_ru":"V1 «Четыре поворотные гондолы» (ред. 2)","tagline_ru":"Гранёный корпус 19 м. Четыре магнитные чаши на одноосных шарнирах: передние высоко у кабины, задние широко у кормы. Крыло 20–70°; 55,9 т, T/W 1,56, Δv 10,0 км/с","concept_ru":"Лэндер — «спасательная ракета» из семейства «Тантры» и Э.МПУ. Четыре гондолы вращаются каждая на одном шарнире вокруг оси z: 0° висение, −45° переход, −90° марш, +10° торможение. Вторая ось УВТ — магнитное отклонение струи ±8° (в марше ±3° наружу и вниз). Передние шарниры (+4,6; +1,3; ±3,5) стоят у верхних скул над кабиной. Задние (−4,6; +0,2; ±5,0) на пилонах 1,85 м: струи передних гондол в марше проходят над задними гондолами, в переходе — перед крылом. Горловина каждой чаши лежит на оси шарнира, поэтому неподвижный экран всегда в тени. Внутри гондолы между горловиной и катушкой стоит W-гильза 12 г/см², её охлаждает аргон. Крыло низкое: 20° висение и посадка, 45° сверхзвук, 70° вход и ангар (размах 14,24 м). От носа к корме: кокпит на 2 места, тамбур с люком, салон на 12 мест с центральным проходом, у ЦМ грузовой отсек 10 т с верхним люком над двумя баками аргона, в корме заряды, энергоузел и криосистема. Ориентация и сближение без чаш — газовые сопла на аргоне.","science_logic_ru":"Тяга F = 2P/v. У грунта при 15 км/с P = 1,6 ГВт на чашу (6,4 ГВт всего), F = 213 кН на чашу, 0,85 МН всего, T/W 1,56 при 55,9 т. В пустоте при 40 км/с — 80 кН на чашу. Давление поля B²/2μ0 = 58,3 МПа при 12,1 Тл. Горловина r 0,08 м держит 1,17 МН, запас ×5,5. Тягу ограничивает мощность, не поле. Синтез 2,67 ГВт на чашу (КПД струи 0,6 — допущение). При 600 Гц импульс 4,4 МДж, нужно ≥3E = 13,3 МДж поля = 0,23 м³. Поле неоднородно, поэтому чаша r 0,55 м (0,35 м³), запас ×4,6. Выход на НОО идёт при v 15–18 км/с (T/W 1,6–2,2), пока горизонтальная скорость не достигнет ~5 км/с. Потом v поднимается до 40 км/с, средняя ≈ 22 км/с. Участок 9,3 км/с, считая отрыв и переход. Сход 0,15 км/с при 40 км/с. Висение и посадка ~45 с: 0,55 км/с при 15 км/с. Итого 10,0 км/с, R = 1,589. Энергия струи 4,9 ТДж, синтеза 8,2 ТДж, это 0,12 т зарядов. Излучение при χ = 0,1 %: 2,7 МВт на чашу. W-гильза поглощает ~30 % (0,8 МВт) и охлаждается аргоном, который всё равно идёт в струю. При 15 км/с расход 14,2 кг/с, нагрев 56 кДж/кг. При 40 км/с расход 2 кг/с, 400 кДж/кг: аргон испаряется и греется до ~350 К. Схема замыкается без криогенной перекачки. За гильзой ослабление ~10⁻⁵, на катушку (ВТСП 20–77 К) приходит единицы ватт. Канон: ионно-триггерный синтез, χ, ионные заряды. Всё остальное — обычная механика.","analogs_ru":["Bell X-22A, Curtiss-Wright X-19, V-22 — четыре или два поворотных движителя, переход висение→полёт (реальные)","F-14, МиГ-23 — крыло изменяемой стреловидности с перчаткой (реальные)","VASIMR, NASA MNX (Arefiev, Breizman) — отрыв плазмы от магнитного сопла (реальные исследования)","Helion, PJMIF — импульсный магнитно-инерциальный синтез (реальные исследования); «ионно-триггерный» — фантастическое допущение","SNAP-10A, NERVA — теневая защита; регенеративное охлаждение ЯРД рабочим телом (реальные)","Газовые сопла холодного газа (MMU, Shuttle-ранние; азот/аргон Isp ~50–70 с) — реальные","«Спейс Шаттл» — ТЗП нижней поверхности крыла при входе под углом атаки 40°","Э.МПУ проекта — модуль УВТ из 4 гондол (внутренний аналог)"],"tvc":{"method_ru":"1) Механика: каждая гондола на одноосном шарнире вокруг z (−90…+10°). Электромагнитный моментный привод стоит на валу, гидравлики нет. Вал несёт криолинию, аргон и ток. 2) Магнит: отклонение струи ±8° асимметрией тока в секциях выходной катушки (оценка-спекуляция). В марше передние ограничены 3° наружу и вниз, чтобы струя не задевала задние гондолы. 3) Дифференциал мощности и частоты ±25 % между чашами. 4) Без чаш (у «Тантры», на орбите) — 16 газовых сопел на аргоне, 4 блока по 4 на пилонах, клапаны без шарниров. Автомат момента — аналоговый фотонный контур в 3 каналах, голосование 2 из 3.","axes_ru":"Тангаж в висении — разность передних и задних (плечо ±4,6 м), в полёте — общий наклон гондол и магнитное отклонение. Крен в висении — разность левых (z −3,5/−5,0) и правых. Рыскание в висении — встречный наклон гондол ±10° (≈0,5 МН·м) плюс магнитное отклонение, в полёте — разность тяги. В пустоте без чаш — газовые сопла по трём осям, сдвиг ±5 м/с.","range_deg":100,"rate_deg_s":20,"response_ms":15,"engine_out_ru":"Отказ чаши: диагональную снимают в ноль, две оставшиеся держат по W/2. На посадочной массе 36,5 т нужно 177 кН на чашу (83 % штатной мощности): висение и посадка сохраняются. На взлётной 55,9 т нужно 274 кН = 2,06 ГВт на чашу. Это форсаж мощности и частоты +29 % (поле 12,1 Тл, не растёт) на 20–30 с. Тепло в гильзе до 1,0 МВт уносит аргон с расходом 18 кг/с. Если форсаж недопустим — аварийный сброс аргона до 43,5 т, тогда 2 × 213 кН = W, за ~60 с; или уход на крыло на скорости ≥105 м/с. Отказ в марше: 3 чаши и дифференциал, тяга −25 %, Δv сохраняется.","hover_control_ru":"Чаши расположены симметрично (±4,6 м), ЦМ на 0: доли тяги 50/50. Смещение ЦМ ±0,5 м по x даёт 61/39 % — в пределах ±25 % дифференциала. Боковой порыв 15 м/с: ~9 кН, компенсация наклоном гондол ~1° или магнитом. Момент 14 кН·м против ≥0,4 МН·м располагаемого, запас ×28. Переход 0→−90° ~25 с, разгон 0–110 м/с, ~0,45 g. Крыло 20°. Передние на −45° бьют струёй в точку x 2,45 при y −0,85, это перед корнем крыла (x 1,8–2,0), зазор ~0,45 м."},"propulsion":{"cups":4,"cup_radius_m":0.55,"field_T":12.1,"thrust_per_cup_MN":0.213,"total_thrust_MN":0.853,"ve_ground_kms":15,"ve_vac_kms":40,"jet_power_liftoff_GW":6.4,"pulse_energy_MJ":4.4,"pulse_rate_hz":600,"placement_ru":"Передние шарниры (+4,6; +1,3; ±3,5), задние (−4,6; +0,2; ±5,0) на пилонах 1,85 м. Горловина на оси шарнира. Срез на 1,4 м от оси. Гондола: цилиндр r 0,75 м × 1,8 м. Чаша-полусфера r 0,55 м, ВТСП-катушка 12,1 Тл. Внутри W-гильза 12 г/см², 0,35 т, охлаждается аргоном. Ширина по задним гондолам 11,5 м.","reaction_mass_ru":"Жидкий аргон из запаса «Тантры»: 20,74 т на маршевый рейс и 0,4 т на газовые сопла, всего 21,1 т (15,1 м³). Два криобака r 0,75 × 4,7 м (16,6 м³ с подушкой) у ЦМ, x −2,65…+2,05. Аргон охлаждает W-гильзы и экраны и только потом идёт в чашу. Ионные заряды: 0,12 т по энергии, с инжектором и резервом 0,4 т."},"mass":{"mtom_t":55.9,"dry_t":24.8,"payload_t":10,"reaction_mass_t":21.1,"tw_earth":1.56,"structure_tps_t":9.9,"wings_t":2.6,"propulsion_t":5.7,"shield_t":2.2,"gear_t":1.85,"systems_t":2.15,"charges_t":0.4,"mass_table_ru":"Корпус, гермокабина, ТЗП: 8,0 т. Грузовой люк: 0,25 т. Криобаки (8 % аргона): 1,66 т. Итого конструкция 9,9 т. Крыло 30 м², шарниры, ТЗП низа и кромки: 2,2 + 0,4 = 2,6 т. Двигатели: 4 гондолы × 0,85 т + 4 W-гильзы × 0,35 т + энергоузел 0,9 т = 5,7 т. Системы (фотонный пульт и автомат, связь, СЖО, газовые сопла 0,15 т): 2,15 т. Экраны кабины: 2 × 0,84 (передние, 3,36 м², 25 г/см²) + 2 × 0,1 (задние) + 0,3 т креплений и охлаждения = 2,2 т. Шасси (3,3 %): 1,85 т. Заряды: 0,4 т. Сухая масса: 24,8 т. Нагрузка: 10 т. Аргон: 20,74 + 0,4 = 21,1 т. Взлётная: 55,9 т. Посадочная перед висением: 36,5 т. После посадки: 35,2 т. Замкнуто итерацией, R = 1,589."},"dv_ru":"Рейс Земля (ВПП) → НОО → сход → посадка, нагрузка 10 т на всём пути. Выход с отрывом и переходом: 9,3 км/с при средней v 22 км/с (15–18 км/с до горизонтальной скорости ~5 км/с, затем до 40 км/с), расход 19,3 т. Сход: 0,15 км/с при 40 км/с, 0,14 т. Висение и посадка: 0,55 км/с при 15 км/с, 1,31 т. Газовые сопла: 0,4 т (~5–6 м/с). Итого 10,0 км/с, 21,1 т аргона. Перегрузки: отрыв 1,56 g. На участке v 15–18 км/с растёт до ~2,2 g. При 40 км/с ~0,9 g с подъёмной программой, ≤3 g везде. Выход длится ~12–15 мин. Спасательный рейс с орбитальной «Тантры» вниз: ~0,7 км/с, запас большой.","radiation_ru":"Синтез за рейс 8,2 ТДж. При χ = 0,1 % проникающее излучение 8,2 ГДж (2,7 МВт на чашу в работе). Источники стоят на осях шарниров. Передние в ~2,3 м от ближайших кресел. У каждой неподвижная W-пластина 2,4 × 1,4 м × 13 мм (25 г/см²) в плоскости z = ±2,65, в 0,85 м от источника. Это проекция всей кабины и кокпита, 0,84 т. Пластина одновременно опора вала. Задние в ~9,5 м за аргоном и грузом: пластины 0,5 м² (0,1 т). Доза за рейс при 200 кэВ (μ/ρ 0,94 см²/г, накопление ×3): ≈0,03 мЗв. Для 10 мЗв хватает 18,8 г/см². При χ = 0,001 % доза ~0,0003 мЗв. Внутренние W-гильзы 12 г/см² защищают катушки, тепло уносит аргон. При жёстком спектре ~500 кэВ экран ×5 (~8 т): закрыто только при малом χ. Опасная зона на грунте (посадка ~45 с, 0,13 ТДж струи, 200 кэВ, свободный пробег в воздухе ~66 м): χ = 0,1 % — 10 мЗв на ~0,35 км, 1 мЗв на ~0,5 км; χ = 0,001 % — ~0,12 и ~0,25 км (оценка). Нейтроны, если есть в реакции, вольфрам держит плохо — открытый вопрос. Из-за струи (~300 м по канону) и спектра висение у «Тантры» и людей запрещено, высадка за ≥2 км.","wings":{"scheme_ru":"Низкое поворотное крыло на неподвижной перчатке-наплыве. Шарнир (0; −1,0; ±3,9). Стреловидность ПК: 20° — висение и посадка, 45° — сверхзвук, 70° — вход и ангар. При входе угол атаки ~40°, крыло наветренное, как у «Шаттла». Поэтому на низ и переднюю кромку положена ТЗП (+0,4 т). Щель перчатки при 70° закрыта подпружиненной керамической накладкой без привода. При 70° крыло проходит под задними гондолами (−90°) с зазором 0,3 м. Посадка без тяги: несущая площадь ≈ 61 м² (крыло 30 + наплыв 11 + брюхо 20), 36,5 т, CL 0,9 → ~103 м/с, ВПП ~3 км. Со сбросом аргона висения ~101 м/с.","area_m2":29.7,"span_open_m":18.4,"span_stowed_m":14.24,"hinges":2,"landing_speed_ms":103,"sweep_min_deg":20,"sweep_max_deg":70},"cabin_ru":"Гермокабина восьмигранного сечения: x 3,4…9,3, ширина 3,6 м, высота 2,3 м. Салон x 3,4…7,4: 12 кресел полулёжа шириной 0,6 м, по 4 в ряд (z ±0,55 и ±1,2). Центральный проход 0,5 м, ряды x 4,1 / 5,4 / 6,7, шаг 1,3 м. При посадке и эвакуации кресла сложены вертикально (гидрошарнир, канон гл. 3), в полёте повёрнуты против перегрузки (≤3 g, гасителя нет). Тамбур x 7,4…7,9 с eg":-45,"cruise_deg":-90,"stowed_deg":-90,"entry_deg":-90,"min_deg":-90,"max_deg":10},{"group":"wing_R","pivot":[0,-1,3.9],"axis":[0,1,0],"hover_deg":0,"transition_deg":0,"cruise_deg":-25,"stowed_deg":-50,"entry_deg":-50,"min_deg":-50,"max_deg":0,"note_ru":"ПК 20°→70°"},{"group":"wing_L","pivot":[0,-1,-3.9],"axis":[0,1,0],"hover_deg":0,"transition_deg":0,"cruise_deg":25,"stowed_deg":50,"entry_deg":50,"min_deg":0,"max_deg":50},{"group":"gear_main","pivot":[-3.4,-1.3,0],"axis":[0,0,1],"hover_deg":0,"transition_deg":0,"cruise_deg":-90,"stowed_deg":-90,"entry_deg":-90,"min_deg":-90,"max_deg":0,"note_ru":"уборка назад"},{"group":"gear_nose","pivot":[8,-0.95,0],"axis":[0,0,1],"hover_deg":0,"transition_deg":0,"cruise_deg":-90,"stowed_deg":-90,"entry_deg":-90,"min_deg":-90,"max_deg":0,"note_ru":"уборка назад"},{"group":"cargo_hatch","pivot":[-0.3,1.6,-1.25],"axis":[1,0,0],"hover_deg":0,"transition_deg":0,"cruise_deg":0,"stowed_deg":0,"entry_deg":0,"min_deg":0,"max_deg":110,"note_ru":"открыт 110° только на грунте и в ангаре"}],"thrusters":[{"id":"cup_1","group":"pod_1","origin":[4.6,-0.1,3.5],"dir":[0,-1,0],"thrust_MN":0.213,"vector_cone_deg":8},{"id":"cup_2","group":"pod_2","origin":[4.6,-0.1,-3.5],"dir":[0,-1,0],"thrust_MN":0.213,"vector_cone_deg":8},{"id":"cup_3","group":"pod_3","origin":[-4.6,-1.2,5],"dir":[0,-1,0],"thrust_MN":0.213,"vector_cone_deg":8},{"id":"cup_4","group":"pod_4","origin":[-4.6,-1.2,-5],"dir":[0,-1,0],"thrust_MN":0.213,"vector_cone_deg":8}]}},{"id":"V2","name_ru":"V2 «Две гондолы по две чаши» (ред. 2)","tagline_ru":"Конвертоплан-лэндер 64,7 т: две поворотные гондолы 6,4 м на валу у ЦМ, в каждой по две чаши с плечом ±2,1 м; груз и аргон у ЦМ; высокоплан со стреловидностью 25–72°; 11 подвижных деталей.","concept_ru":"Гранёный восьмигранный фюзеляж 19,6 м. Впереди гермокабина 6,4 м на 14 мест (2 в кокпите + 12 в салоне по схеме 2+1). Посередине, над поперечным валом гондол (x = 0, ЦМ), идёт центральный трюм-коридор 4,5×1,2×1,8 м. По его бокам стоят два бортовых криобака аргона по 9 м³, центрированные на валу. Сзади агрегатный отсек и кормовой восьмигранный люк, общий для экипажа и груза: через него проходят по коридору в кабину и грузят трюм. Гондолы 6,4×2,6×2,6 м (z = ±4,0), чаши r = 1,1 м на x = ±2,1 м. Режимы гондол: висение 0°, переход −45°, разгон и вакуум −95° (струя назад и на 5° вниз), вход −90°. Шарниры крыла на спинном пилоне (x = −0,2, y = 3,0): 25° для посадки, 72° для разгона, входа и ангара. Сопла ориентации холодногазовые на испарённом аргоне, неподвижные. Расчёт: взлётная масса 64,7 т, аргон 25,3 т, тяга 0,90 МН (Т/В 1,42 при ЦМ на валу), Δv 10,3 км/с.","science_logic_ru":"Конвертоплан (V-22, X-22) без лишних шарниров. Тяга идёт по короткому пути: чаша → катушка → гондола → вал в балке у ЦМ. Тангаж и крен дают разностью тяги чаш, по импульсам (56 Гц, 18 мс). Механика нужна только для смены режима и рысканья. Тяга ограничена мощностью, а не полем: 58,3 МПа × π·1,1² = 221 МН на чашу ≫ 0,225 МН. Размер чаши задаётся удержанием импульса: V ≥ 3·60,4 МДж / 58,3 МПа = 3,11 м³, у параболоида r 1,1 × 1,65 м V = 3,14 м³. На вакуумном участке мощность струи постоянна, поэтому F = 2P/v падает с ростом v. Скорость струи там ограничена 24 км/с: Т/В 1,0 в начале участка, 1,4 в конце. При 35 км/с было бы 0,66, ошибку исправили. Груз и аргон стоят на валу, поэтому их загрузка и выработка не сдвигают ЦМ. Остаточный разброс ЦМ (экипаж/пусто) снимается перекачкой аргона между передней и задней секциями баков. Энергобаланс чаши: синтез 3,38 ГВт, струя 1,69 ГВт (КПД 0,5). Остальные 50 % уходят с выхлопом (расходимость, тепловая и ионизационная энергия). Нагрузка на стенку ≤ 0,1 % (≤ 3,4 МВт), её снимает подогрев аргона перед инжекцией: 9,5 МВт при 15 кг/с у грунта и 3,7 МВт при 24 км/с в пустоте. Поэтому v_e > 25 км/с при полной мощности недопустима. Конический W-вкладыш по всей стенке чаши закрывает кабину при любом угле гондолы и заодно экранирует обмотку REBCO (20–40 К).","analogs_ru":["Bell Boeing V-22 Osprey: поворотные гондолы, сквозной вал","Bell X-22A, Curtiss-Wright X-19: четыре поворотных движителя, управление разностью тяги","F-111, МиГ-23: поворотная стреловидность (у них стабилизатор; у нас бесхвостка с фокусом позади ЦМ)","Space Shuttle, Буран, X-37B: вход днищем, посадка без тяги ~100 м/с","VASIMR, NASA MSFC PuFF, Helion: магнитное сопло и импульсный синтез — прототипы чаши","Princeton Direct Fusion Drive: доля излучения и экранирование","REBCO-магниты (Commonwealth Fusion SPARC, 20 Т при 20 К): обмотка чаши","NIST XCOM: ослабление W и воздуха (150/500 кэВ)","Холодногазовые сопла (MMU, CubeSat): ориентация без химии","Спекуляция (канон): ионно-триггерный синтез, χ = 0,1 %"],"tvc":{"method_ru":"Три уровня УВТ. 1) Тяга каждой из 4 чаш по импульсам: 56 Гц, отклик 18 мс, 0–100 % мощности; снижение скорости струи даёт до 150 % тяги. 2) Магнитное отклонение струи ±10° (подмагничивание секций катушки), 20–40 мс; при −95° вверх не более 0° (струя под крылом). 3) Поворот гондол на валу от −100° до +15°, 30°/с, два электромагнитных привода с тормозом. В пределах 1 км от «Тантры» чаши выключены, работают холодногазовые сопла на аргоне (8 групп, неподвижные клапаны, Isp ~50 с).","axes_ru":"Тангаж: разность передних и задних чаш, плечо ±2,1 м. На взлётной массе запас момента 560 кН·м (эквивалент смещения ЦМ 0,88 м); при допуске ЦМ ±0,15 м нужно 95 кН·м, запас ×5,9. Крен: разность бортов, плечо ±4,0 м. Рысканье: встречный поворот гондол ±10° и боковое магнитное отклонение. Поступательно: синфазный поворот гондол.","range_deg":115,"rate_deg_s":30,"response_ms":18,"engine_out_ru":"Отказ одной чаши: балансирует диагональная пара (например, ПП + ЛЗ), третья чаша глушится. Взлётная масса 64,7 т: по 318 кН на чашу при струе 10 км/с — 1,59 ГВт (94 % мощности), аргон 32 кг/с на чашу. Посадочная 41,3 т: по 203 кН при 12 км/с — 1,22 ГВт (72 %). Висение и посадка на паре возможны при любой массе без форсажа поля. Вал Ti D 0,7 × 35 мм: кручение 0,67 МН·м, τ = 25 МПа.","hover_control_ru":"Висение при посадке: по 101 кН на чашу (45 % номинала), запас на управление ×2,2. Допуск ЦМ от вала: ±0,15 м на взлёте (Т/В ≥ 1,35), ±0,5 м на посадке (Т/В_max 2,2). Таблица ЦМ (x от вала): 14 чел + 6,5 т груза, полный аргон: 0,00 м; 2 пилота + 10 т (7 т в трюме, 3 т в салоне): −0,08; 2 пилота пустой: −0,23, после перекачки 2,5 т аргона вперёд −0,14; посадка 14 чел + груз: +0,16. Стреловидность 25→72° сдвигает ЦМ на −0,07 м. Порыв 15 м/с в борт ≈ 8 кН·м — несущественно."},"propulsion":{"cups":4,"cup_radius_m":1.1,"field_T":12.1,"thrust_per_cup_MN":0.225,"total_thrust_MN":0.9,"ve_ground_kms":15,"ve_vac_kms":24,"jet_power_liftoff_GW":6.76,"pulse_energy_MJ":60.4,"pulse_rate_hz":56,"placement_ru":"Две бортовые гондолы на оси вала x = 0, y = −0,6, z = ±4,0 м. В каждой передняя (x = +2,1) и задняя (x = −2,1) чаши. Чаша: параболоид r = 1,1 м, глубина 1,65 м, V = 3,14 м³; обмотка REBCO 12,1 Тл при 20–40 К. Предел по полю 221 МН (не ограничивает). Синтез 3,38 ГВт на чашу, струя 1,69 ГВт; в пустоте струя ≤ 24 км/с (выше не хватает охлаждения вкладыша аргоном), сход с орбиты 40 км/с на пониженной мощности.","reaction_mass_ru":"Жидкий аргон из запаса «Тантры»: 25,3 т = 18,1 м³ в двух бортовых криобаках по 9,05 м³ (r 0,8 м, L 4,5 м), 87 К, центрированы на валу. В каждом баке передняя и задняя секции для перекачки (балансировка ЦМ). Баки весят 1,2 т. 0,1 т из этого запаса идёт на холодногазовую ориентацию. Ионные заряды: ~0,16 кг на рейс (синтез 11 ТДж, струя 5,5 ТДж); кассеты с инжектором 0,3 т."},"mass":{"mtom_t":64.7,"dry_t":29.45,"payload_t":10,"reaction_mass_t":25.3,"tw_earth":1.42,"structure_tps_t":7.7,"wings_t":2.3,"gear_t":1.4,"propulsion_t":6.8,"systems_t":2.65,"shield_t":7.1,"charges_t":0.3,"mass_table_ru":"Корпус + ТЗП 7,2 и ТЗП гондол 0,5: итого 7,7. Крыло 2,3. Шасси 1,4. Двигатели 6,8: 4 чаши r 1,1 с REBCO-катушками и криостатами, 2 гондолы по 6,4 м, вал 8 м, приводы. Системы 2,65: фотоника, СЖО, криоохладитель, накопитель поджига, радиаторы, клапаны ориентации. Экран 7,1: конические W-вкладыши 4 × 1,6 = 6,4 и экран пола и бортов кабины 0,7 (при 500 кэВ 2,9). Заряды с инжектором 0,3. Баки 1,2. Сухая масса 29,45 т. Нагрузка 10,0 т: 14 чел. 3,5 + груз 6,5. Аргон 25,3 т (доля 0,39). Массы по этапам: взлётная 64,7 т, на НОО 41,5, к висению 41,3, после посадки 40,1 (резерв 0,6 т аргона)."},"dv_ru":"Δv 10,3 км/с. Плотная атмосфера 2,0 км/с при струе 15 км/с. Разгон до НОО 7,5 км/с при 24 км/с: 7,8 − 0,4 (вращение Земли) + 1,6 (гравитационные потери при Т/В 1,0–1,4, частично гасятся подъёмной силой корпуса) + 0,3 (аэродинамика) + 0,2 (управление). Сход 0,15 км/с при 40 км/с. Висение 45 с — 0,45 км/с при 15 км/с. Резерв 0,2 км/с. Отношение масс 1,637, эффективная скорость струи 20,9 км/с. Ориентация холодным газом: ~1,2 м/с на 0,1 т аргона. Перегрузки: старт 1,35–1,42 g; к концу атмосферного участка 1,6 g; вакуум 1,0–1,4 g; вход ~1,5 g; отказ чаши — переходная до 1,2 g. Везде ≤ 1,65 g, полулежачее положение не нужно, спинка 60° к горизонту.","radiation_ru":"Синтез 3,38 ГВт на чашу. При χ = 0,1 % это 3,4 МВт проникающего излучения на чашу. Ближайшее кресло (S10) в 2,9 м от горловины ЛП; без экрана там ~87 Гр/с. Экран — конический W-вкладыш 13 мм (25 г/см²) по всей стенке чаши, от горловины до среза: 6,4 м², 1,6 т на чашу. Кабина в тени при 0°, −45°, −90° и −95°. Тот же вкладыш ослабляет поток на обмотку ≥ 400× при 150 кэВ. Доза за рейс от 4 чаш при спектре ~150 кэВ ~3·10⁻⁹ мЗв. Альбедо грунта и skyshine при висении без экрана пола дали бы ~15–20 Гр/с, поэтому днище и борта кабины (~30 м²) закрыты W 1,2 мм (2,4 г/см², 0,7 т); тогда доза ≤ 1 мЗв за 45 с. При χ = 0,001 % экран пола не нужен (~9 мГр). При жёстком спектре ~500 кэВ 25 г/см² не держит: нужно ~150 г/см² (~38 т вкладышей) и экран пола 2,9 т, для этой схемы это неприемлемо. Опасная зона на грунте (4 чаши, 60 с, с накоплением в воздухе; расчёт рецензента принят): при χ = 0,1 % 10 мЗв на 530–650 м и 1 мЗв на 600–800 м. Запрет висения: ≥ 700 м от людей и «Тантры», ≥ 900 м при жёстком спектре, ≥ 400 м при χ = 0,001 %.","wings":{"scheme_ru":"Бесхвостый высокоплан с поворотной стреловидностью. 2 вертикальных шарнира на спинном пилоне (x = −0,2, y = 3,0, z = ±2,0), неподвижный центроплан 4×4 м. Шарниры перенесены на 1,2 м назад: фокус при 25° x ≈ −0,4 м, запас устойчивости 0,17–0,56 м (6–20 % САХ) на всём диапазоне ЦМ (−0,23…+0,16). Положения: 25° — планирование и посадка; 72° — разгон, вакуум, вход (консоли в тени корпуса) и ангар. Крыло (низ y 2,85) выше гондол: зазор 0,15–0,5 м при −95°; струя при −95° идёт на 5° вниз, магнитное отклонение вверх запрещено. Без тяги: CL ≤ 1,0 (балансировка элевонами), посадка 105 м/с при 40,1 т, нагрузка 684 кг/м², полоса ≥ 3 км. Основная посадка — на чашах.","area_m2":58.6,"span_open_m":19.2,"span_stowed_m":11.5,"hinges":2,"landing_speed_ms":105,"sweep_min_deg":25,"sweep_max_deg":72},"cabin_ru":"Гермокабина 6,4×2,2×3,4 м (x 2,2–8,6), на 0,4 м длиннее за счёт носа. Пол на y = −1,2; снизу и с бортов W-экран 1,2 мм. Кокпит: 2 кресла (x = 7,8), командир слева. Перед ним пульт-полка с полётным терминалом и контроллером двигателей, у локтей большие вертикальные сенсорные дисплеи. Приборы фотонные/аналоговые, 2–3 контура, без кремния. Носовой обзор — фотонный перископ (нос выше глаз). Салон: 12 кресел, 4 ряда (x 6,6 / 5,4 / 4,2 / 3,0, шаг 1,2 м) по схеме 2+1: z −1,25 и −0,63 слева, +0,65 справа, проход 0,66 м. Спинка 60° к горизонту, кресла поворачиваются на гидрошарнирах (канон, гл. 3). Вход: кормовой восьмигранный люк 1,6 м → агрегатный отсек → центральный трюм-коридор 1,2×1,8 м между баками → две ступени вниз в кабину. В грузовом варианте кресла снимаются по рельсам, в салоне до 3 т груза. 20 мест: +2 ряда по 3 места = +2,4 м и ~+1,5 т; длина 22,0 м, ангар нужно удлинить на 1,8 м. В коридор места не встают.","hangar":{"length_m":19.6,"width_stowed_m":11.5,"height_m":5.35,"fits":true,"growth_ru":"Не требуется. Режим stowed: длина 19,6 ≤ 20,2 м (по 0,3 м с торцов). Ширина 11,5 м по концам консолей при 72° (гондолы 10,6 м) ≤ 16,7 м проёма и ≤ 24 м. Высота 5,35 м от брюха (y −2,0) до обтекателя шарниров (y 3,35) ≤ 5,4 м, запас 5 см. Гондолы при 0° не ниже брюха (y −1,9). Зона МПУ не занята. Вариант на 20 мест: ангар длиннее на 1,8 м (до 22,0 м)."},"launch_recovery_ru":"Старт с «Тантры». Лэндер в stowed (крылья 72°, гондолы 0°, шасси убрано) стоит на ложементе; магнитная плита брюха служит якорем и килем. Верхние створки открываются, толкатель даёт 2 м/с вверх; зазор в проёме 2,6 м на борт. Ориентация холодным аргоном. Примерно через 8 мин лэндер в 1 км: гондолы −95°, струя от «Тантры», поджиг при малой тяге, затем полная. Возврат: торможение заканчивается в ≥ 1 км со смещением вбок ≥ 200 м, чтобы струя прошла мимо «Тантры»; затем чаши гасятся. Подход на холодном газе 0,3 м/с. Захват на ≤ 3 м: штанга толкателя выдвигается с магнитной головкой и притягивает лэндер на ложемент. Земля: вертикальный взлёт на 4 чашах (Т/В 1,42), переход ≥ −30° только выше 10 м, набор 1–2 км, гондолы −45…−95°, гравитационный разворот. Посадка: вход днищем (гондолы −90°, срезы в тени), торможение, крыло 25°. Затем либо висение ≤ 45 с не ближе 700 м от людей, либо без тяги (105 м/с, полоса ≥ 3 км).","parts":{"cups":4,"propulsion_pivots":2,"wing_hinges":2,"other_moving":7,"total_moving":11,"list_ru":"Чаши 4: без движущихся частей. Шарниры гондол 2. Шарниры крыла 2. Прочие 7: кормовой люк 1, стойки шасси 3 (створки ниш заодно со стойками, без своих шарниров), элевоны 2, руль 1. Сопла ориентации (8 групп) неподвижные, клапаны без шарниров. Штанга-толкатель принадлежит ангару. Многофункциональные детали: вал = поперечина + путь тяги; W-вкладыш = экран кабины + экран обмотки, охлаждается аргоном; трюм = коридор экипажа; магнитная плита = якорь + киль; кормовой люк = вход + погрузка; бортовые баки = рабочая масса + балансировка ЦМ + газ ориентации."},"pros_ru":["4 механизма силовой схемы; УВТ по тангажу и крену импульсный (18 мс), плечо ±2,1 м даёт запас момента ×5,9","Груз и аргон на валу: ЦМ держится в ±0,15 м пр 1,43 (на трёх чашах 1,47 при vₑ 11 км/с). В ангаре 16,0 × 7,1 × 5,0 м.","concept_ru":"Хвостосидящий лэндер длиной 16 м с восьмигранным корпусом (полуразмеры 2,4 × 2,4 м). Порядок от кормы к носу: блок из 4 гондол с магнитными чашами (2×2, Ø1,56 м, карданы ±15°); теневой экран W 35 г/см² с апофемой 2,1 м, он же силовая плита тяги; заряды с инжектором; бак жидкого аргона Ø3,8 × 1,54 м (под тягой аргон стекает к экрану); грузовой отсек-шлюз 4,6 м (~70 м³) с верхней восьмигранной дверью-стрелой; гермокабина 5,2 м с 3 рядами по 4 кресла и кокпитом на 2 места. Каждый ряд кресел вместе с пультом поворачивается на одном валу. Взлёт и посадка — стоя на 4 опорах. Вход в атмосферу — днищем при сложенных крыльях; на дозвуке переворот на корму и посадка на тяге. Крылья S = 75 м², размах 20,6 м: для переходов и для аварийного планирования без тяги на 86 м/с.","science_logic_ru":"1) Δv 10,3 км/с, груз 10 т на всём рейсе. По фазам: 2,5 км/с при vₑ 15; 3,0 при 25; 3,9 при 35; 0,27 при 60; посадка 0,63 при 15 (0,60 + 5 % резерва). Отдельно 0,8 т аргона на холодные сопла. Рабочей массы 23,2 т, взлётная 62,5 т. 2) Мощность синтеза ограничена импульсами: 4 × 11 МДж × 300 Гц = 13,2 ГВт, при КПД 0,5 струя 6,6 ГВт. Скорость струи растёт ступенями при той же мощности: тяга 0,88 МН при 15 км/с → 0,53 МН при 25 → 0,38 МН при 35. Т/В на ступенях: 1,43→1,64; 1,01→1,13; 0,81→0,91. На третьей ступени v > 4 км/с, центробежная разгрузка ~0,3 g. 3) Давление поля B²/2μ0 = 58,3 МПа × 1,33 м² = 77 МН на чашу, это ≫ 0,22 МН. Удержание импульса: в конусе 0,44 м³ запасено 25,8 МДж = 2,3·E; в объёме катушки 0,575 м³ — 33,5 МДж = 3,0·E (это верхняя граница, поле к срезу спадает). 4) Защита: 1/r² на 11 м + W (μ/ρ 0,40 см²/г при 300 кэВ, ослабление 3,3·10⁻⁶ с накоплением) + столб аргона (0,105 см²/г). Допущение: χ — мягкий рентген ≤300–500 кэВ, реакция безнейтронная. 5) ЦМ низко, 5,4–6,4 м от кормы; плечо кардана 4,2–5,1 м, угол опрокидывания ~27°. 6) Косой шарнир крыла по схеме Sto-Wing: ось (1,−1,±1)/√3, поворот 120°.","analogs_ru":["Convair XFY-1 Pogo, Lockheed XFV-1, Ryan X-13 — хвостосидящие СВВП","DC-X, New Shepard, Falcon 9 — посадка на тяге, откидные опоры","Starship SN8–SN15 — вход «брюхом» и переворот на корму","Grumman Sto-Wing (F4F-4, TBF) — косой шарнир складывания крыла","VASIMR VX-200, PuFF (NASA MSFC/UAH), Daedalus (BIS) — магнитные сопла и импульсный синтез (по мощности спекулятивно)","Теневые экраны SNAP-10A и NERVA; ложементы «Казбек» — перегрузка грудь–спина","Канон: «Тантра» садится кормой, кресла на гидравлических шарнирах (гл. 3)"],"tvc":{"method_ru":"Три уровня, без кремния; контуры фотонные и аналоговые, 2–3 канала. (1) Двухосные карданы гондол ±15°, гидравлика, 30°/с. (2) Асимметричный ток корректирующих витков смещает отрыв струи на ±3° за ~5 мс (спекуляция). (3) Дифференциал частоты импульсов между чашами, шаг 3,3 мс при 300 Гц.","axes_ru":"Тангаж и рыскание: общее отклонение 4 гондол + дифференциал тяги. Крен: диагональные пары отклоняются тангенциально в разные стороны (зазор гондол 0,84 м при Ø1,56 м, ход концов 2 × 0,34 м). В полёте на крыле добавляются консоли.","range_deg":15,"rate_deg_s":30,"response_ms":5,"engine_out_ru":"Отказ 1 из 4 чаш: на оставшихся vₑ снижается до 11 км/с при той же мощности на чашу (1,65 ГВт струи), тяга чаши растёт до 0,30 МН, поле это держит. Отрыв (вес 0,613 МН): 3 чаши дают 0,90 МН, Т/В 1,47, асимметрию снимают карданы. Посадка (вес 0,41 МН): диагональная пара 0,60 МН, Т/В 1,46, третья чаша на подстройке. Аргона уходит на 36 % больше — берётся из 5 % посадочного резерва.","hover_control_ru":"Висение на корме. Плечо кардан–ЦМ 4,2 м (старт) – 5,1 м (посадка). Смещение ЦМ ±0,5 м съедает 5,6–6,8° из 15°, порыв 15 м/с — 1,3°. Угловое ускорение ~33°/с², переворот на 90° за ~4 с. Запас ~7°."},"propulsion":{"cups":4,"cup_radius_m":0.65,"field_T":12.1,"thrust_per_cup_MN":0.22,"total_thrust_MN":0.88,"ve_ground_kms":15,"ve_vac_kms":35,"jet_power_liftoff_GW":6.6,"pulse_energy_MJ":11,"pulse_rate_hz":300,"placement_ru":"Корма: гондолы 2×2 по (y,z) = (±1,2; ±1,2) м, длина 2,6 м, Ø1,56 м, шарнир кардана в середине. Срез чаш на x = −5,5 м, струя идёт по −x. Фаска корпуса у кормы 0,9 м: гондола при 15° не задевает. Перед гондолами общий экран — плита тяги.","reaction_mass_ru":"Жидкий аргон из запаса «Тантры»: 23,2 т (17,4 м³ вместе с 5 % свободного объёма; бак Ø3,8 × 1,54 м). Из них 0,8 т — холодные сопла (ориентация, сближение, ~10 м/с) и ~0,5 т — 5 % резерв посадки. Скорость струи 15 → 25 → 35 км/с при выведении, 60 км/с на орбите, 15 км/с на посадке. Ионных зарядов 0,2 кг, узел с инжектором 0,3 т."},"mass":{"mtom_t":62.5,"dry_t":29.3,"payload_t":10,"reaction_mass_t":23.2,"tw_earth":1.43,"structure_tps_t":8.73,"wings_t":2.15,"propulsion_t":6,"charges_t":0.3,"shield_t":7.91,"gear_t":1.6,"systems_t":2.6,"mass_table_ru":"Корпус, ТЗП, плита и удлинённый криобак — 8,73 т. Крылья с шарнирами — 2,15 т. Двигательная установка (4 гондолы × 1,4 т + подача аргона) — 6,0 т. Узел зарядов — 0,30 т. Экраны — 7,91 т: кормовой W 35 г/см² на 14,6 м² (апофема 2,1 м) 5,11 т и облицовка кабины W 7 г/см² на 40 м² 2,80 т. Опоры — 1,60 т. Системы — 2,60 т. Сухая масса 29,3 т. Груз 10,0 т (14 человек ≈ 3,5 т + 6,5 т груза). Аргон 23,2 т. Взлётная масса 62,5 т, перед посадкой 41,8 т, после посадки ~40,1 т. Тяга 0,88 МН (Т/В 1,43); на трёх чашах при 11 км/с — 0,90 МН (1,47)."},"dv_ru":"Δv 10,3 км/с (груз 10 т на всём рейсе). (1) Плотные слои: 2,5 км/с при vₑ 15 км/с, 0,88 МН, ~165 с, 1,43→1,64 g. (2) 3,0 км/с при 25 км/с, 0,53 МН, ~290 с, Т/В 1,01→1,13. (3) 3,9 км/с при 35 км/с, 0,38 МН, ~470 с, 0,81→0,91 g, при v > 4 км/с. Выведение (1–3) — 9,4 км/с вместе с гравитационными потерями (грубая оценка). (4) Орбитальные операции 0,15 + сход 0,12 км/с при 60 км/с. (5) Посадка: переворот, торможение, ~45 с висения — 0,63 км/с при 15 км/с. Плюс холодный газ 0,8 т. Вход днищем при угле атаки ~60°, до 2,5 g. Предел 3 g нигде не превышен.","radiation_ru":"Допущение: χ — мягкий рентген ≤300–500 кэВ, реакция без нейтронов. Если в χ есть гамма МэВ или нейтроны, нужен слой с водородом и бором и полный пересчёт. Кормовой экран W 35 г/см², апофема 2,1 м: тень закрывает углы кабины от всех чаш при ±15°. Доза экипажу при χ = 0,1 %: выведение ~1,9 мЗв (столб аргона ~38 г/см²; на плотном участке 115 г/см², доза там ничтожна); посадка прямая ~2,4 мЗв (аргона почти нет, синтез 6,2 ГВт, 60 с); отражённое от грунта 0,3–1 мЗв (с облицовкой W 7 г/см²). Итого ≈ 5 мЗв при цели ≤10. При χ = 0,001 % доза ≈ 0,05 мЗв: облицовку можно снять (−2,8 т), экран довести до 25 г/см² (−1,5 т). Опасная зона на грунте при посадке (60 с, с ослаблением и накоплением в воздухе). χ = 0,1 %: 1 мЗв на 600–750 м, 50 мЗв на 340–430 м. χ = 0,001 %: 1 мЗв на ~300 м, 50 мЗв на ~100 м. Зона отчуждения 1000 м при χ = 0,1 %, 300 м при χ = 0,001 % (там же разрушительная струя, ~300 м).","wings":{"scheme_ru":"Две трапециевидные консоли на косых шарнирах Sto-Wing. Шарнир у середины корневой хорды, на неподвижном наплыве 0,9 м (z = ±3,3 м). Поворот 120° вокруг оси (1,−1,±1)/√3 укладывает консоль вдоль борта: хорда вертикально, передняя кромка вниз. Режимы: 0° — полёт и планирование, 60° — переход, 120° — вход, висение, ангар. Сложенная консоль выступает за борт на 1,1 м, кромка керамическая (RCC).","area_m2":75,"span_open_m":20.6,"span_stowed_m":7.1,"hinges":2,"sweep_min_deg":12,"sweep_max_deg":90,"landing_speed_ms":86},"cabin_ru":"Гермокабина 5,2 × 4,2 × 4,2 м (x = 4,3…9,5 м). Облицовка W 7 г/см² на кормовой стенке и на низе. Кокпит на 2 кресла (z = ±0,6 м). У командира: полётный терминал на полке, контроллер двигателей под правой рукой, у локтей два вертикальных сенсорных дисплея. Окон нет, обзор — фотонные камеры (особенно вниз-назад). Приборы фотонные и аналоговые, 2–3 контура. Салон: 3 ряда по 4 кресла (z = ±0,85 и ±1,55 м), шаг рядов 1,3 м, проход 1,1 м. Каждый ряд (в кокпите — вместе с пультом) стоит на одном гидравлическом валу. Положения вала: −30° — старт и висение (лёжа на спине), 0° — горизонтальный полёт, +60° — вход при угле атаки 60° (вся нагрузка грудь–спина). Вход из ангара — через носовой восьмигранный люк 1,1 м прямо в проход. На грунте выход идёт через люк в отсек-шлюз и верхнюю дверь.","hangar":{"length_m":16,"width_stowed_m":7.1,"height_m":5,"fits":true,"growth_ru":"Ангар увеличивать не нужно. В сложенном виде 16,0 × 7,1 × 5,0 м при лимите 20,2 × 24 × 5,4 м. Проём верхних створок 16,7 м, запас 9,6 м. Бак удлинён внутри прежней длины, корпус не вырос. Место под ложементом не занимаем. Для 20 мест (+2 ряда) длина 18,6 м — тоже вписывается."},"launch_recovery_ru":"Старт из космоса: верхние створки открыты, магнитный толкатель ложемента выталкивает лэндер лёжа на ~5 м/с, ориентация — холодными аргоновыми соплами. Чаши поджигаются на ≥2 км (~400 с), струя направлена от «Тантры». Возврат: на чашах до 2 км, дальше холодный газ ≤1 м/с, захват тем же узлом, втягивание, створки закрываются. Посадка на Землю: вход днищем при сложенных крыльях; на ~2 км и ~100 м/с переворот на корму, опоры раскрываются на 135°, ~45 с висения, посадка на подготовленную площадку (зона 1000 м). Взлёт: стоя на 4 опорах, Т/В 1,43. Аварийно без тяги: крылья открыты, посадка на ВПП на ~86 м/с на киль-лыжу. Выход на грунте: дверь отсека (на 8,7 м) откидывается в стрелу, лебёдка спускает корзину на 6 человек или до 2 т; 14 человек — 3 рейса, ~4 мин.","parts":{"cups":4,"propulsion_pivots":4,"wing_hinges":2,"other_moving":12,"total_moving":18,"list_ru":"4 двухосных кардана гондол (8 осей). 2 косых шарнира крыла. 4 опоры. 4 вала рядов кресел. Дверь отсека, она же стрела. Лебёдка. Носовой люк. Внутренний люк. Всего 18 подвижных узлов. Совмещение функций: экран = плита тяги; аргон = рабочая масса + защита + холодный газ; дверь = стрела; отсек = шлюз."},"pros_ru":["Один экран на все 4 чаши, кабина в 11 м от плазмы; доза ≈ 5 мЗв при χ = 0,1 %","Висение при отказе чаши: Т/В 1,46–1,47 за счёт перехода на vₑ 11 км/с","Ангар не растёт: 16,0 × 7,1 × 5,0 м","Посадка кормой — как у «Тантры»; кресла поворачиваются, как в каноне","Всего 18 подвижных узлов"],"cons_ru":["Взлётная масса 62,5 т — выше прикидки 37–52 т (экраны 7,9 т, рост аргона)","Т/В 1,43 — без запаса на форсаж; поднять можно только снижением vₑ","Кабина на высоте 12–17 м: спуск только стрелой с лебёдкой","Струя 15 км/с в 2,6 м над грунтом: нужна подготовленная площадка, зона 1000 м","На ВПП садится только аварийно, на лыжу","Т/В < 1 на последней ступени выведения (0,81) — нужна пологая траектория"],"risks_ru":["Переворот на малой высоте (как у SN8–SN10), нужен запас ≥2 км","Если χ содержит МэВ-гамму или нейтроны — экран W бесполезен, доза +4–5 порядков","Быстрая магнитная девиация ±3° — спекуляция","Заедание косого шарнира — посадка только на тяге","Срыв поля при форсаже и усталость обмоток при 300 Гц","Гравитационные потери при Т/В 0,81–1,0 оценены грубо"],"open_questions_ru":["χ и спектр: 0,1 % или 0,001 %; мягкий рентген без нейтронов? При 0,001 % экраны легче на ~4,3 т, взлётная ~55 т — решает пользователь","20 мест: +2 ряда, +2,6 м, +1,5 т — нужно ли?","Возврат на «Тантру», стоящую на грунте (низ ангара на 24 м) — только через орбиту?","Крупный груз грузится только при открытых верхних створках?","Гидравлика карданов (как в каноне) или электромагнитные приводы?","Рецензент: доза экипажу 4–5 мЗв принята. По опасной зоне у меня 1 мЗв на ~600 м, у рецензента ~750 м (разница в учёте накопления). Взята зона 1000 м, покрывает обе оценки"],"geometry":{"hull_sections":[{"x":-5.5,"hw":2.5,"yt":2.5,"yb":-2.5,"ch":0.9},{"x":-2.7,"hw":2.4,"yt":2.4,"yb":-2.4,"ch":0.9},{"x":1.8,"hw":2.4,"yt":2.4,"yb":-2.4,"ch":1},{"x":6,"hw":2.4,"yt":2.4,"yb":-2.4,"ch":1},{"x":8,"hw":2.2,"yt":2.1,"yb":-2.3,"ch":0.9},{"x":9.5,"hw":1.7,"yt":1.5,"yb":-2,"ch":0.7},{"x":10.5,"hw":0.9,"yt":0.6,"yb":-1.3,"ch":0.35}],"primitives":[{"id":"pod_1","kind":"cylinder","role":"pod","group":"pod_1","center":[-4.2,1.2,1.2],"dims":[0.78,2.6],"axis":"x","note_ru":"гондола [радиус, длина]"},{"id":"pod_2","kind":"cylinder","role":"pod","group":"pod_2","center":[-4.2 ","pivot":[0.6,2.42,0],"axis":[0,0,1],"hover_deg":0,"transition_deg":0,"cruise_deg":0,"stowed_deg":0,"entry_deg":0,"min_deg":0,"max_deg":90,"note_ru":"на грунте 90° — стрела"},{"group":"door_nose","pivot":[10.45,-0.35,0.55],"axis":[0,1,0],"hover_deg":0,"transition_deg":0,"cruise_deg":0,"stowed_deg":0,"entry_deg":0,"min_deg":0,"max_deg":100},{"group":"door_inner","pivot":[4.2,0,0.6],"axis":[0,1,0],"hover_deg":0,"transition_deg":0,"cruise_deg":0,"stowed_deg":0,"entry_deg":0,"min_deg":-90,"max_deg":0}],"thrusters":[{"id":"T1","group":"pod_1","origin":[-5.5,1.2,1.2],"dir":[-1,0,0],"thrust_MN":0.22,"vector_cone_deg":15},{"id":"T2","group":"pod_2","origin":[-5.5,1.2,-1.2],"dir":[-1,0,0],"thrust_MN":0.22,"vector_cone_deg":15},{"id":"T3","group":"pod_3","origin":[-5.5,-1.2,1.2],"dir":[-1,0,0],"thrust_MN":0.22,"vector_cone_deg":15},{"id":"T4","group":"pod_4","origin":[-5.5,-1.2,-1.2],"dir":[-1,0,0],"thrust_MN":0.22,"vector_cone_deg":15}]}},{"id":"V4","name_ru":"V4 «Подъёмные + маршевая» (ред. 2)","tagline_ru":"6 неподвижных подъёмных чаш в брюхе (аргон, 15 км/с, по 112 кН) и 2 маршевые чаши в корме на двухосном кардане (40 км/с в пустоте). Взлётная масса 50,5 т, нагрузка 10 т, W-переборка во всё сечение салона, крыло изменяемой стреловидности 20–60°, элевоны и кили.","concept_ru":"Функции разделены, как у Як-38. Шесть подъёмных чаш стоят неподвижно в 2 ряда по 3 (x = +1,8/0/−1,8 м, z = ±1,25 м). Они бьют вниз через брюхо и работают только у грунта: 30 с на взлёт и переход, 45 с на висение при посадке. Две маршевые чаши (z = ±1,3 м) стоят в корме на двухосных карданах ±15°. Торцы их гондол выходят за срез корпуса на 0,5 м. Маршевые делают всё остальное: разгон в атмосфере (20 км/с, 2×300 кН), выход на орбиту (40 км/с, 2×150 кН), сход с орбиты и сближение одиночными импульсами. Порядок от носа: кокпит на 2 места → салон на 12 мест (2+2) → вольфрамовая переборка шириной 4,1 м во всё сечение салона → грузовой отсек над подъёмными чашами → кормовой бак аргона → маршевые гондолы. Под полом салона лежит плоский бак аргона. Его вырабатывают в заданном порядке вместе с кормовым и так держат ЦМ в пределах ±0,3 м. Створки подъёмных шириной 1,12 м закрывают проёмы перед входом в атмосферу, а при висении висят по бортам как газовые щитки. Крылья поворотные (по типу F-111/Су-24), стоят на спине: 20° для посадки, 60° для сверхзвука, входа и ангара. По бокам неподвижные наплывы. На задней кромке наплывов стоят 2 элевона, они же посадочные щитки. На концах наплывов — 2 развалённых цельноповоротных киля по 1,5 м.","science_logic_ru":"У каждого двигателя своя скорость струи. Подъёмной чаше у грунта выгоден большой расход при малой скорости: 15 км/с, F = 2P/v, отсюда 5,0 ГВт струи на 0,67 МН. Маршевой в пустоте выгодны 40 км/с: η 0,84 против 0,59 при 15 км/с, и 7,15 из 10,1 км/с Δv делаются на 40 км/с. Неподвижные подъёмные чаши не требуют поворотных узлов. Защита собрана в одном месте: все источники лежат позади одной поперечной переборки. Теперь переборка перекрывает всё сечение салона с полутенью (4,1 × 2,9 м, углы срезаны по фаске), и ни одна чаша не выходит из её тени ни в каком режиме. Цена схемы — мёртвый груз: 3,3 т подъёмной системы летят на орбиту без дела, это ≈1,2 т лишнего аргона. Удержание импульса: V = 2,5·E/(B²/2μ0) = 0,21 м³ при 5 МДж и 12,1 Тл → полусфера r = 0,47 м; маршевая при 8,7 МДж — r = 0,56 м. Поле на срезе даёт 40–58 МН, в сотни раз больше тяги, поэтому предел задаёт энергия импульса и нагрев стенки. Потери на ионизацию и возбуждение аргона (≈25 эВ/атом): η = 0,9·K/(K+25 эВ). Аэродинамика: тело малого удлинения без киля путево неустойчиво, поэтому стоят кили. Чистое крыло с наплывами даёт CL ≈ 1,0, элевоны в режиме щитков — около 1,2.","analogs_ru":["Як-38 / Як-141: подъёмные РД-36-35 и поворотное сопло маршевого, створки отсеков подъёмных двигателей","Mirage IIIV, Do 31, VAK 191B: подъёмные двигатели в корпусе","F-111, Су-24, МиГ-23, B-1: поворотные консоли на плечевых шарнирах","X-24B, HL-20, Dream Chaser: несущий корпус, развалённые кили, элевоны-щитки","MSNW Fusion Driven Rocket (NASA NIAC 2011–2013): импульсный синтез и магнитное сопло","VASIMR, опыты по магнитным соплам: отрыв плазмы от поля","Daedalus (BIS, 1978): импульсная камера с магнитным отражателем","SNAP-10A, NERVA: теневая защита из W/LiH","Space Shuttle: вход на 40° угла атаки, кромки из C/C, створки в теплозащите","Газоотводные лотки стартовых столов и площадки Harrier: отвод струи у грунта"],"tvc":{"method_ru":"Вектор тяги управляется на четырёх уровнях. (1) Подъёмные чаши: тяга каждой меняется энергией импульса (30–100 %, от импульса к импульсу, 3,5 мс при 287 Гц); две пары триммирующих катушек на чашу отклоняют поле на ±10°. (2) Маршевые: двухосный кардан ±15°, гидропривод с фотонно-аналоговым управлением, 30°/с. (3) Магнитное отклонение маршевых ±10° поверх кардана, всего ±25°. (4) В атмосфере — элевоны и цельноповоротные кили. Одиночный импульс маршевой даёт 300 Н·с (≈8 мм/с) и заменяет двигатели ориентации при сближении.","axes_ru":"Висение: тангаж и крен — разностью тяги рядов (плечи 1,8 и 1,25 м), рыскание и боковое смещение — магнитным отклонением струй передних и задних пар в разные стороны. Полёт с тягой: тангаж и рыскание — карданами маршевых, крен — разнонаправленным отклонением двух маршевых (база 2,6 м). Планирование и посадка без тяги: элевоны (тангаж, крен), кили (рыскание).","range_deg":25,"rate_deg_s":30,"response_ms":15,"engine_out_ru":"Отказ подъёмной чаши на взлёте (50,5 т). С балансом моментов работают фактически 4 чаши: 0,45 МН, Т/В 0,90. Висеть нельзя, поэтому ниже ~30 м — аварийная посадка с Т/В 0,9 на амортизацию шасси, выше 30 м — переход на маршевые (+0,6 МН) и крыло. Висение на 4 чашах с балансом возможно при массе ≤ 45,7 т. Отказ при посадке (36,0 т): нагрузка оставшихся ≈0,79 номинала. Худший случай — ЦМ +0,3 м и отказ передней угловой: ≈1,1 номинала (оценка), +10 % частоты, без форсажа поля. Отказ маршевой: вторая доворачивается на 8,7° (линия тяги через ЦМ) и работает при Т/В ≈ 0,4 в пустоте; дальше — прерывание с посадкой или виток до орбиты.","hover_control_ru":"Висение при 36,0 т, полный баланс сил, загрузка чаш 30–100 % (номинал 0,53): запас по тангажу ±0,27 МН·м, по крену ±0,19 МН·м, по рысканию ±0,13 МН·м; боковая сила 0,11 МН (3 м/с²). Порядок выработки баков ограничивает ЦМ до ±0,3 м: смещение даёт 0,11 МН·м, это 39 % запаса по тангажу. Выше 30 м добавочный момент дают маршевые: 2×90 кН с карданом ±15° — это ±23 кН вертикально на плече 8,5 м, ±0,2 МН·м. Ниже 30 м маршевые выключены: струя у грунта и людей. Ниже 5 м тяга подъёмных снижается, вертикальная скорость касания 2–3 м/с."},"propulsion":{"cups":8,"cup_radius_m":0.47,"field_T":12.1,"thrust_per_cup_MN":0.112,"total_thrust_MN":1.27,"ve_ground_kms":15,"ve_vac_kms":40,"jet_power_liftoff_GW":5,"pulse_energy_MJ":5,"pulse_rate_hz":287,"placement_ru":"Подъёмные: 6 чаш r = 0,47 м (полусфера 0,21 м³), по 112 кН при 15 км/с; 0,84 ГВт струи на чашу, 287 Гц × 5 МДж, синтез 8,6 ГВт на все 6. Стоят в брюхе под грузовым отсеком по сетке 1,8 × 2,5 м, срез на уровне брюха, 1,4 м над грунтом. Маршевые: 2 чаши r = 0,56 м, 3 ГВт струи каждая, 500 Гц × 8,7 МДж; 300 кН при 20 км/с или 150 кН при 40 км/с. Стоят в кормовых гондолах на кардане (шарнир x = −8,5 м), срез на x = −9,8 м. На отрыве работают только подъёмные: 0,67 МН, Т/В 1,35; вместе с маршевыми — 1,27 МН.","reaction_mass_ru":"Жидкий аргон 14,5 т (10,9 м³ с недоливом 5 %) из запаса «Тантры». Кормовой бак — цилиндр Ø2,2 × 2,1 м (≈9,9 т), плоский бак под полом салона 2,0 × 3,0 × 0,55 м (≈4,6 т). Порядок выработки: на подъёме сначала кормовой бак до 60 %, затем оба поровну; ЦМ держится в пределах ±0,3 м. Горючее зарядов — 0,13 кг на 9·10¹² Дж (7·10¹³ Дж/кг); с капсулами, кассетами и двумя инжекторами 0,3 т."},"mass":{"mtom_t":50.5,"dry_t":25.7,"payload_t":10,"reaction_mass_t":14.5,"charges_t":0.3,"propulsion_t":5.46,"shield_t":6.66,"structure_tps_t":6.85,"wings_t":2,"gear_t":1,"systems_t":3.7,"tw_earth":1.35,"mass_table_ru":"Подъёмная система — 3,30 т: 6 чаш по 0,51 т (катушки, криостат, стенка, инжектор) и 2 створки по 0,12 т. Маршевая система — 2,16 т: 2 чаши по 0,90 т и 2 кардана по 0,18 т. Корпус с теплозащитой — 6,85 т (+0,05 т на теплозащиту стоек и ступень люка). Крыло — 2,00 т: консоли с шарнирами 1,6 т, элевоны и кили с приводами 0,4 т. Шасси — 1,00 т. Системы — 3,70 т: жизнеобеспечение, питание, фотоника, кресла 2,6 т; криобаки 1,1 т. W-переборка — 6,66 т: 56 г/см² на 11,9 м². Итого: сухая 25,7 т, нагрузка 10,0 т, аргон 14,5 т, заряды 0,3 т, взлётная 50,5 т. На орбите 37,2 т, посадочная после 45 с висения 36,0 т. При χ = 0,001 % переборка 23 г/см² (2,7 т), взлётная ≈ 45 т."},"dv_ru":"Расчётный рейс: Земля → НОО с 10 т → сход → посадка с 45 с висения, всего 10,1 км/с. Участки (Циолковский, последовательно): (1) отрыв и переход на подъёмных — 0,30 км/с при 15 км/с, 50,5 → 49,5 т; (2) разгон в атмосфере маршевыми до ~25 км — 2,2 км/с при 20 км/с, → 44,4 т; (3) выход на орбиту — 7,0 км/с при 40 км/с, → 37,2 т, 7,1 т аргона, ≈16 мин при 7,5 кг/с; (4) манёвры и сход — 0,15 км/с при 40 км/с, → 37,1 т; (5) висение 45 с — 0,45 км/с при 15 км/с, → 36,0 т. Итого 14,5 т аргона, средняя скорость струи 29 км/с. Перегрузки: на отрыве 0,35 g сверх веса; в атмосфере ≤ 1,4 g; в пустоте 0,4–0,8 g; при планирующем входе 1,5–2 g. Предел 3 g не достигается. Старт с «Тантры» на орбите (без участков 1–2) с 10 т даёт запас ≈ 9 км/с.","radiation_ru":"χ = 0,1 %. Проникающее излучение за рейс идёт от подъёмных (8,6 ГВт синтеза, 75 с, ~4,5 м до кабины) и от маршевых (~16 мин, ~10,5 м). Расчёт: тормозное излучение с kT ≈ 50 кэВ (допущение), ослабление в W и ткани по NIST, накопление ×2. Без экрана — ≈24 кГр от подъёмных и ≈47 кГр от маршевых, смертельно. Решение — поперечная W-переборка на x = +2,6 м: 56 г/см² (2,9 см), ширина 4,1 м, высота 2,9 м (y −1,55…+1,35, углы срезаны по фаске корпуса), 11,9 м², 6,66 т, ослабление ~1·10⁻⁷. Она перекрывает всё сечение салона (|z| ≤ 2,0 м) с полутенью ≥ 0,05 м для лучей от всех 8 чаш при любом угле кардана: от L1 (0,8 м за переборкой, z 1,25+0,47) до борта салона z 2,0 луч проходит при |z| ≤ 2,05. Доза в кабине ≈4 мЗв от подъёмных и ≈4 мЗв от маршевых, с рассеянием ≤ 10 мЗв за рейс. Полный кормовой бак (≈300 г/см² Ar) на подъёме даёт запас, в расчёт он не взят. При χ = 0,001 % хватает 23 г/см² (2,7 т). Грузовой отсек не защищён. Опасная зона на грунте при χ = 0,1 % (75 с, накопление в воздухе ×5–10): 6 Гр на 100 м, 0,28 Гр на 200 м, 9 мЗв на 350 м, 1 мЗв на ≈450 м. При χ = 0,001 %: 1 мЗв на ≈200 м. С учётом струи (~300 м по канону) зона отчуждения ≥ 500 м.","wings":{"scheme_ru":"Две поворотные консоли на плечевых шарнирах (x = 0,5, y = 2,2, z = ±2,2 м) над спиной: корень 4,4 м, конец 2,0 м, полуразмах 6,9 м, 22,1 м² каждая. Стреловидность по передней кромке 20° (посадка, переход) или 60° (сверхзвук, вход, ангар). Неподвижные наплывы по бокам — 15,8 м², расширяют плоское брюхо до ±3,6 м. На задней кромке наплывов (x = −4,0, z 2,4…3,6) — 2 элевона по 1,0 м², ход ±25°. Они дают тангаж и крен при любой стреловидности, а на посадке опускаются на 20° как щитки. На концах наплывов — 2 цельноповоротных киля, развал 20° наружу, высота 1,5 м, по 2,6 м²; кромки из C/C. Крылья и кили выше и в стороне от струй подъёмных. Площадь 44,2 + 15,8 = 60 м². Посадка без тяги при 36,0 т: 98 м/с при CL 1,0 (чистое крыло), 89 м/с со щитками (CL ≈ 1,2); с пустым отсеком (~30 т) — 82 м/с.","area_m2":60,"span_open_m":18.4,"span_stowed_m":13.45,"hinges":2,"landing_speed_ms":89,"sweep_min_deg":20,"sweep_max_deg":60},"cabin_ru":"Гермокабина x = +2,65…+8,4 м, перед W-переборкой. Кокпит (x 6,6…8,4): 2 кресла полулёжа (z = ±0,6). Перед командиром полка с полётным терминалом и контроллером двигателей (подъёмные, маршевые, кардан, элевоны и кили), у локтей большие вертикальные сенсорные дисплеи. Приборы фотонно-аналоговые в 3 контурах (2 рабочих + 1 холодный резерв), без кремния. Салон (x 2,65…6,55, 3,9 × 4,0 × 2,3 м): 12 кресел, 3 ряда по 4 (2+2), проход 1,1 м, вход пешком. Кресла на гидрошарнирах поворачиваются по вектору перегрузки (канон, гл. 3). Вход через восьмигранный люк Ø1,3 м по левому борту. Низ люка на 2,6 м над грунтом, поэтому на внутренней стороне крышки сделана откидная ступень-трап: при открытии та же деталь опускается ниже, отдельного шарнира нет. В ангаре нужен бортовой переход от тамбура. 14 человек с креслами, скафандрами и запасом на 3 сут — ≈3,5 т, ещё 6,5 т груза в отсеке 5,0 × 3,4 × 2,0 м (34 м³). Для 20 мест — 4-й и 5-й ряды: +2,3 м длины, +1,5 т, длина 21,4 м, ангар нужно удлинить на 1,2 м. Гостевые места за переборкой при χ = 0,1 % не защищены и отвергаются.","hangar":{"length_m":19.1,"width_stowed_m":13.45,"height_m":3.95,"fits":true,"growth_ru":"Расширять ангар не нужно. Длина с торцами гондол 19,1 ≤ 20,2 м (по 0,55 м с торцов). Ширина в положении stowed 13,45 ≤ 16,7 м (проём верхних створок). Кили на z ±3,6…4,1 м. Высота от брюха до верха консолей 3,95 ≤ 5,4 м, шасси убраны, кили ниже консолей. Место МПУ под ложементом не занято. Для 20 мест (21,4 м) — +1,2 м длины ангара."},"launch_recovery_ru":"Старт с «Тантры»: лэндер на ложементе, консоли на 60°, шасси и створки закрыты. Магнитный толкатель упирается в плоскую полосу брюха между рядами створок (z ±0,64 м) и выталкивает лэндер вверх со скоростью 3–5 м/с через верхние створки (16,7 м). Подъёмные чаши в космосе не включаются никогда. На удалении ≥ 1–2 км лэндер разворачивается кормой от «Тантры» и включает маршевые. Возврат: торможение маршевыми вдали от корабля; на последнем километре — одиночные импульсы (≈8 мм/с), струя в сторону от «Тантры»; затем свободный подлёт и захват тем же узлом. На Земле взлёт и посадка на подъёмных — только с площадки с газоотводными лотками под рядами чаш. Отрыв при Т/В 1,35. С 30 м — переход с маршевыми, разгон до ~60 м/с при поддержке крыла, створки закрываются, дальше разгон по-самолётному. Посадка: на ВПП без тяги (89 м/с, щитки) или с висением 45 с, касание на 2–3 м/с, не ближе 500 м от людей и «Тантры».","parts":{"cups":8,"propulsion_pivots":4,"wing_hinges":2,"other_moving":24,"total_moving":30,"list_ru":"Подвижных узлов 30. (1) 2 кардана маршевых по 2 оси = 4 оси: вектор тяги, крен, ориентация. (2) 2 шарнира консолей: посадка, сверхзвук, вход и ангар. (3) 2 элевона: тангаж, крен, посадочные щитки, балансир на входе. (4) 2 цельноповоротных киля: рыскание и путевая устойчивость. (5) 2 створки подъёмных: теплозащита и газовые щитки. (6) 3 стойки шасси. (7) 1 люк со ступенью-трапом в той же детали. (8) 14 гидрошарниров кресел (канон). Подъёмные чаши неподвижны. Отдельных двигателей ориентации нет."},"pros_ru":["Подъёмные чаши неподвижны: нет поворотных узлов под 0,11 МН и усталости шарниров","Своя скорость струи на каждом участке: 15 км/с у грунта, 40 км/с в пустоте","Одна W-переборка 6,7 т закрывает весь салон от всех 8 чаш во всех режимах","Элевоны и кили обеспечивают посадку без тяги и управляемый вход","Струи подъёмных не касаются крыльев и килей","Одиночные импульсы маршевых заменяют двигатели ориентации","Вписывается в ангар без расширения: 19,1 × 13,45 × 3,95 м"],"cons_ru":["Мёртвая масса подъёмной системы 3,3 т летит на орбиту: +1,2 т аргона","Взлётная выросла до 50,5 т (+2,4 т): экран +1,25 т, аэродинамика +0,4 т","Отказ подъёмной чаши на взлёте: Т/В 0,90, висения нет, ниже 30 м — аварийная посадка","Проёмы 2 × 4,8 × 1,12 м в теплозащите брюха: уплотнение створок — главный узел входа","Взлёт и посадка на подъёмных — только с площадки с газоотводными лотками","Посадка без тяги — 89 м/с: нужна длинная ВПП","Грузовой отсек не защищён от излучения","30 подвижных узлов против 26"],"risks_ru":["χ = 0,1 % не утверждено: при ошибке в 10 раз переборке нужно +4–5 г/см² W (+0,5 т)","Спектр излучения (kT ≈ 50 кэВ) — допущение; при жёстком гамма толщина растёт кратно","Газодинамика 6 струй у грунта (подсос, эрозия, рециркуляция) не считалась; без лотка — нагрев шасси и брюха","Концы консолей и кили при входе выходят из тени брюха — кромки из C/C","Рассеянная плазма одиночных импульсов при сближении до ,"dir":[0,-1,0],"thrust_MN":0.112,"vector_cone_deg":10},{"id":"M_L","group":"pod_L","origin":[-9.8,-0.1,-1.3],"dir":[-1,0,0],"thrust_MN":0.3,"vector_cone_deg":10},{"id":"M_R","group":"pod_R","origin":[-9.8,-0.1,1.3],"dir":[-1,0,0],"thrust_MN":0.3,"vector_cone_deg":10}]}},{"id":"V5","name_ru":"V5 «Неподвижные чаши» (ред. 2)","tagline_ru":"Шесть неподвижных чаш под 60°, наклонённых вниз-назад. Вектор тяги задаётся магнитом, разностью тяги и наклоном всего аппарата. В двигателе ни одного шарнира, ориентация на газовых соплах аргона.","concept_ru":"Гранёный несущий корпус длиной 18,6 м, высокое крыло изменяемой стреловидности 20°→72° с двумя элевонами. Шесть магнитных чаш неподвижно встроены в нижние фаски тремя парами (x +1,2 / −0,9 / −3,0 м): r среза 0,55 м, длина 1,15 м, 12,1 Тл. Ось каждой чаши наклонена на 60° к оси корпуса (вниз-назад) и разведена наружу, по dir это 13°. Линия суммарной тяги проходит в 0,1 м от ЦМ. Висение идёт с кабрированием 28°. Крейсерского полёта на тяге нет: только разгон (в атмосфере α 0–10°, в пустоте нос поднят на ~59°) и баллистика или планирование. Взлётная масса 52,9 т, Т/В на Земле 1,35. 16 неподвижных газовых сопел на испаряемом аргоне отвечают за ориентацию у «Тантры» и на входе.","science_logic_ru":"1) Кардана нет. Чаша — это магнит 12 Т под нагрузкой 0,12 МН и мощностью 0,9 ГВт, подвижный узел под ней даёт усталость и срыв поля. 2) Чаши неподвижны, поэтому вольфрамовый экран-воротник стоит прямо у источника. Он закрывает только телесный угол кабины, и тень не уходит ни в каком режиме. 3) Предел магнитного отклонения задаёт отрыв струи от поля при β≈1. У грунта на аргоне это ±3°, в пустоте ±10° (Merino & Ahedo). 4) Мощность ограничена удержанием импульса: 12 МДж × 150 Гц × 6 чаш × 0,5 = 5,4 ГВт. При P = const F = 2P/vе, поэтому vе растёт по мере убывания массы: 15,5 км/с на отрыве, ~30 км/с в конце при 1,2 g. Средняя vе принята 20 км/с (консервативно). Расчёт при a = 1,2 g = const даёт m0 48,4 т, принято 52,9 т. 5) Жёсткий кант 60° в атмосфере даёт лишнюю нормальную силу, штраф принят 0,6 км/с. 6) Дифференциальная тяга безынерционна: энергия меняется со следующего импульса (≈7 мс).","analogs_ru":["Merino M., Ahedo E., «Contactless steering of a plasma jet with a 3D magnetic nozzle», PSST 26 (2017): отклонение струи на единицы градусов","Merino & Ahedo, отрыв плазмы от магнитного сопла (2011–2016): предел по β","SpaceX SuperDraco: неподвижные наклонные пары сопел, дифференциальное дросселирование","Lockheed X-33 / линейный аэроспайк: вектор только разностью тяги блоков","Harrier / Як-38: висение с кабрированием","Холодногазовые/резистоджетные RCS на аргоне и ксеноне (малые КА): неподвижные сопла, только клапаны","Space Shuttle / X-37B: элевоны, вход с большим α при ориентации от RCS","МГД-управление обтеканием (Битюрин; JAXA) для срезов чаш — спекулятивно"],"tvc":{"method_ru":"Четыре канала без механики в двигателе. (а) Дифференциальная тяга шести чаш через энергию и частоту импульсов. (б) 3D-магнитное сопло (нормально проводящие корректирующие катушки): ±3° у грунта, ±10° в пустоте. (в) Наклон всего аппарата: при висении кабрирование 28°, на разгоне α 0–10°, в пустоте нос поднят на ~59°. (г) 16 газовых сопел на аргоне по ~200 Н: ориентация при холодных чашах, сближение и вход.","axes_ru":"Тангаж и крен — сильно (дифференциал пар, плечи 3,6 и 2,7 м). Рыскание при висении — слабо, ≈0,08 МН·м (развал 13° + магнит ±3°) плюс аргоновые сопла. В полёте тангаж и крен держат элевоны, рыскание — асимметрия элевонов, кили неподвижны.","range_deg":10,"rate_deg_s":120,"response_ms":15,"engine_out_ru":"Без магнитного отклонения отказ чаши A или C не балансируется вообще: плечи по тангажу +1,65 / −1,86 м плюс крен и рыскание. С отклонением ±3° тяга равна 0,43–0,48 МН. Т/В: на посадочной массе 30,75 т — 1,44–1,59, на взлётной 52,9 т — 0,84–0,92. Висение на посадочной массе возможно, запас на управление 5–15 %, и держится он на ±3°. На взлёте — прерывание с разгоном вперёд и сброс аргона. Форсаж поля тягу не добавляет, предел здесь мощность.","hover_control_ru":"Висение с кабрированием 28° (кант 60°, развал 13°, магнитные 3°). Нетто-момент −0,06 МН·м компенсируется дифференциалом. Смещение ЦМ ±0,5 м требует ±35 кН на чашу (29 %), его покрывает запас Т/В 35 %. Тангаж ≈15°/с², 10° за ~1,2 с. Порыв 15 м/с даёт ≈11 кН·м, это меньше 5 % располагаемого крена. Касание основными опорами (x −6,5 м), хвост не задевает до 32,8°, затем нос опускается на тормозах."},"propulsion":{"cups":6,"cup_radius_m":0.55,"field_T":12.1,"thrust_per_cup_MN":0.12,"total_thrust_MN":0.72,"ve_ground_kms":15,"ve_vac_kms":60,"jet_power_liftoff_GW":5.4,"pulse_energy_MJ":12,"pulse_rate_hz":150,"reaction_mass_ru":"Жидкий аргон из запаса «Тантры»: 22,2 т (в том числе ~0,1 т на газовые сопла), 15,8 м³, с ullage 10 % — 17,5 м³. Два криобака r 0,8 × 4,6 м (2 × 9,25 м³). На отрыве расход 48 кг/с (8 кг/с на чашу). Заряды расходуются ≈0,17 кг за рейс (12 ТДж синтеза), запас с инжектором и тройным резервом — 0,3 т.","placement_ru":"Неподвижно в нижних фасках: A x+1,2 z±2,6; B x−0,9 z±2,65; C x−3,0 z±2,6; y≈−1,3. Ось струи (−0,5; −0,84; ±0,22): 60° вниз-назад, развал 13°. Чаша — конус r 0,27→0,55 м, L 1,15 м, V 0,63 м³ ≥ 3 × 12 МДж / 58,25 МПа = 0,62 м³. По давлению поля чаша держит ~55 МН, нужно 0,12 МН."},"mass":{"mtom_t":52.9,"dry_t":20.75,"payload_t":10,"reaction_mass_t":22.2,"tw_earth":1.35,"structure_tps_t":7,"wings_t":2.35,"gear_t":1.4,"propulsion_t":4.4,"shield_t":2.15,"systems_t":3.15,"charges_t":0.3,"mass_table_ru":"Корпус и ТЗП (C/SiC на кромках и срезах чаш) — 7,0 т. Крыло с поворотными узлами и 2 элевонами — 2,35 т. Шасси — 1,4 т. Двигатели — 4,4 т: 6 × 0,63 т (катушки 12 Т, криостат, корректирующие катушки, инжектор) + 0,6 т подача аргона и криокулер. Экраны W — 2,15 т (плиты 1,75 + рассеяние 0,4). Системы — 3,15 т (фотоника, жизнеобеспечение, гидравлика, питание + аргоновая RCS 0,15). Заряды с инжектором — 0,3 т. Сухая масса 20,75 т, нагрузка 10 т, конечная 30,75 т. Δv 10,86 км/с при средней vе 20 км/с: m0 = 30,75·e^0,543 = 52,9 т, аргон 22,2 т. Тяга по осям 0,72 МН, по вертикали 0,70 МН = 1,35·m0·g. Мощность 5,4 ГВт."},"dv_ru":"Земля → НОО 200 км — 9,40 км/с. Штраф неподвижного канта в атмосфере — 0,60 (поправка рецензента). Сход с орбиты — 0,15. Висение 45 с — 0,46. Резерв — 0,25. Итого 10,86 км/с. Мощность постоянная (5,4 ГВт), поэтому vе растёт с 15,5 км/с на отрыве до ~30 км/с к концу разгона при 1,2 g. Средняя vе 20 км/с дала m0 52,9 т, расчёт при a = 1,2 g = const — 48,4 т, запас 4,5 т. Перегрузка: отрыв 1,35 g, разгон ≤3 g, вход 1,5–2 g, кресла полулёжа.","radiation_ru":"Синтез ≈12 ТДж за рейс. При χ = 0,1 % без экрана: 4,5·10⁴ Гр в кокпите и 1,4·10⁵ Гр в 1-м ряду. Для ≤10 мЗв нужно 31–33 г/см² W (μ/ρ 0,6 при спектре ≤0,3 МэВ — допущение, с накоплением). Принято 40 г/см² = W 0,021 м. При спектре ~1 МэВ понадобится ~290 г/см², масса ×7: вариант тогда не сходится. Воротники у каждой чаши со стороны кабины, верх воротника A поднят до y −0,1. Плиты 1,75 т + рассеяние 0,4 т = 2,15 т. При χ = 0,001 % хватает 1,3 т. Зона на грунте (висение 45 с): 10 мЗв на ~450 м, 1 мЗв на ~620 м (при χ = 0,001 % — ~300 м). Люди и «Тантра» — не ближе 600 м.","wings":{"scheme_ru":"Высокое крыло изменяемой стреловидности, по одному шкворню на консоль (y +1,5). Корень уходит в щель-перчатку глубиной ~2,4 м над баками. Режимы: 20° — висение и посадка, 50° — разгон, 72° — вход и ангар (консоли на заветренной стороне, кромки C/SiC). На консолях 2 корневых элевона (тангаж, крен, рыскание асимметрией). Два неподвижных киля с развалом 20°.","area_m2":70,"span_open_m":20.4,"span_stowed_m":12.9,"hinges":4,"landing_speed_ms":77,"sweep_min_deg":20,"sweep_max_deg":72},"cabin_ru":"Гермокабина из 2 отсеков. Кокпит x 6,0–7,6 м, 2 кресла. У командира полётный терминал на полке, контроллер двигателей (6 дросселей пар + задатчик магнитного отклонения + рукоять RCS), большие вертикальные сенсорные дисплеи у локтей. Приборы фотонно-аналоговые, 3 контура, без кремния. Салон x 2,2–6,0 м: 12 ложементов, 3 ряда × 4, высота 2,1 м. Внутри не ходят: посадка сразу в кресло через восьмигранный люк ⌀1,3 м по левому борту. Каждое кресло на своём гидрошарнире (канон, гл. 3): 0° на тяге, +35° на входе. Для 20 мест: 4-й ряд и удлинение на 1,4 м (длина 20,0 м, на пределе ангара) либо 6 кресел в грузовом отсеке за счёт ~2,5 т груза.","hangar":{"length_m":18.6,"width_stowed_m":12.9,"height_m":5.1,"fits":true,"growth_ru":"Расширение не нужно. Габарит 18,6 × 12,9 × 5,1 м (шасси убрано в ниши, шарниры на y −1,5) при доступных 20,2 × 24 × 5,4 м. Выход вверх через проём 16,7 м, запас 3,8 м. Для 20 мест длина 20,0 м — на пределе 20,2 м."},"launch_recovery_ru":"Космос. Магнитный толкатель ложемента отталкивает накладку брюха, и лэндер уходит вверх через створки со скоростью 2–3 м/с. Ориентацию держат аргоновые сопла. Отход до 600 м занимает 200–300 с, затем разворот креном на 90°, чтобы струя шла вбок от «Тантры», и полная тяга. Возврат: остановка на 600 м сбоку, чаши гасятся. Сближение на аргоновых соплах до 0,3 м/с, захват полем толкателя с 5 м. «Тантра» на грунте: ложемент на 24 м над грунтом, запуск чаш рядом с ней запрещён (зона 600 м). Земля: ВПП или вертикально, вне 600 м от людей.","parts":{"cups":6,"propulsion_pivots":0,"wing_hinges":4,"other_moving":19,"total_moving":23,"list_ru":"Крыло: шкворни 2 и элевоны 2. Стойки шасси 3 (по одному шарниру). Боковой люк 1, грузовой люк 1. Кресла 14 (гидрошарниры по канону). Чаши, корректирующие катушки, 16 аргоновых сопел (только клапаны) и кили — неподвижны."},"pros_ru":["0 шарниров в двигателе: нет кардана под полем 12 Т","Экран у источника, тень сохраняется в любом режиме","Отклик вектора 7–15 мс","Ангар без расширения: 18,6 × 12,9 × 5,1 м","Всего 23 подвижные детали, из них 14 — кресла по канону","RCS на том же аргоне, без новых веществ"],"cons_ru":["Взлётная масса 52,9 т — тяжелее прежних 44,7 т","Висение с кабрированием 28°, обзор вниз хуже","Крейсерского полёта на тяге нет: только разгон и баллистика","Штраф 0,6 км/с за жёсткий х на уровне ЦМ (y=0, x=±5, z=±4,4). Передние каналы проложены под полом салона в желобе с вольфрамом. В кольце в струю впрыскивается аргон (15–20 км/с). Каждое кольцо поворачивается вокруг оси своего канала (z), от −95 до +100°. Камеры питают кольца по диагоналям: Л — ПЛ+ЗП, П — ПП+ЗЛ. Консоли изменяемой стреловидности стоят на спине корпуса, у каждой есть элевон.","science_logic_ru":"1) Баланс. ЦМ задаётся тем, что центр бака совпадает с ЦМ пустого аппарата: при полной массе x=−0,18 м, при посадке +0,16 м от середины пар колец. На висении тяга делится между парами 52/48, при запасе делителя ±20 %.\n2) Перенос по каналу. Дрейф ионов на изгибе R=1 м при 6 Тл: 5 мм (p), 34 мм (Li⁺). Альфа-частицы надо термализовать в камере (иначе дрейф 0,3 м). Давление ≤0,5·B²/2μ0, поток ≈7 ТВт/м², поэтому импульс растягивается буфером-горловиной до ≥1 мс.\n3) Предел скорости струи v_cap=√(2η·Δh/f_w): аргон снимает тепло 1,42 МДж/кг. При f_ch=0,2 % — 19,7 км/с, у прямых чаш — 27 км/с.\n4) Излучение камер: ~1 МэВ, μ_W=0,066 см²/г, фактор накопления 3.\n5) Тормозное излучение каналов: 0,8 МВт на канал. Принято T плазмы 50 кэВ. За 3,5 см W на 1,5 м доза ~1,2 мГр.\n6) Кольцо: горловина r 0,12 м при 14,3 МПа держит 0,65 МН, то есть +30 % при отказе камеры.\n\nСпекуляция: f_ch=0,2 % и T плазмы в канале ≤50 кэВ.","analogs_ru":["Rolls-Royce Pegasus (Harrier): 1 двигатель, 4 синхронных поворотных сопла 0–98,5°","Изогнутые магнитные фильтры дуговой плазмы (И. И. Аксёнов, ХФТИ): пропускание при изгибе 90° 25–50 %","Перенос компактных тороидов FRC ~250 км/с: TAE C-2/C-2U, LANL FRX-L","Магнитные сопла и векторизация: VASIMR (Ad Astra), Merino & Ahedo (UC3M)","Добавка рабочей массы в термоядерную струю: Direct Fusion Drive (Princeton Satellite Systems)","Теневые экраны: SNAP-10A, NERVA; бак рабочего тела как экран — проекты ЯРД NASA","Изменяемая стреловидность: F-14, Ту-160; элевоны и безмоторная посадка: Space Shuttle (~100 м/с)"],"tvc":{"method_ru":"Три уровня управления, все на кольцах:\n1) Механика: кольцо поворачивается вокруг оси канала (z) от −95 до +100°, 30°/с, 1 шарнир на кольцо.\n2) Магнитная векторизация: трим-катушки отклоняют струю на ±8°, отклик ~10 мс.\n3) Дифференциальная тяга: впрыск аргона ±25 % (~20 мс), делитель потока пары ±20 %, частота импульсов камеры (шаг 5 мс).\nПлюс 16 холодногазовых РДУ на аргоне (0,4 т газа).","axes_ru":"Тангаж: разность тяги передней и задней пар (плечо ±5 м), на висении делитель 52/48. Крен: разность левых и правых колец (плечо ±4,4 м). Рыскание: на висении наклон передних и задних колец в разные стороны (±8° магнитно, до ±15° механически). В крейсере все 4 кольца стоят на 20° (струя вниз-назад): вертикальные силы передней и задней пар взаимно гасят момент, тяга идёт на уровне ЦМ (y=0). Без тяги работают элевоны (тангаж и крен) и дифференциальная стреловидность.","range_deg":195,"rate_deg_s":30,"response_ms":10,"engine_out_ru":"Отказ кольца: камера отдаёт весь поток второму кольцу своей пары, Т/В на исправной диагонали около 1,5 при посадочной массе 84,5 т. Отказ камеры: одна диагональ работает на 130 % (260 Гц), Т/В 1,56 при посадочной массе. Вокруг оси диагонали управлять можно только плечом ~0,6 м и РДУ, это маргинально, поэтому по регламенту садиться по-самолётному на 100 м/с. Отказ обеих камер: планирование с элевонами, посадка на 100 м/с, РДУ только на малом скоростном напоре.","hover_control_ru":"ЦМ смещается на ±0,18 м от середины пар, нужно деление тяги 52/48 (0,26·W на кольцо). Кольцо может дать 0,34·W при Т/В 1,35, запас 30 %. Боковой порыв 10 м/с даёт ~5 кН и меньше 1 % управляющего момента. Отклик по тяге 5–20 мс, по вектору 10 мс. Переход висение→крейсер (90→20°) ~2,5 с."},"propulsion":{"cups":4,"cup_radius_m":0.45,"field_T":12.1,"thrust_per_cup_MN":0.5,"total_thrust_MN":1.99,"ve_ground_kms":15,"ve_vac_kms":19.7,"jet_power_liftoff_GW":14.9,"pulse_energy_MJ":63.8,"pulse_rate_hz":200,"placement_ru":"Поле: 12,1 Тл в камерах, 6 Тл в кольцах.\n- 2 камеры: r 0,87 м, 2,74 м³ (энергия поля 2,5×E_имп), x=−3,2, z=±1,1, y=0.\n- Синтез на отрыве 25,5 ГВт.\n- 4 кольца-сопла: горловина r 0,12 м, срез r 0,45 м, в гондолах x=±5, z=±4,4, y=0.\n- Каналы ~30 м, 2,6 т. Передние идут под полом салона (y −1,35, z ±1,4) в желобе W 3,5 см, затем поднимаются в стенке к оси кольца. Задние короткие, перекрёстные под камерами.","reaction_mass_ru":"Жидкий аргон из запаса «Тантры»: 67,4 т (48 м³, из них резерв 1,5 т). Бак единый, гранёный, x −2,1…+1,1, на всё сечение корпуса, с теплоизоляцией. Аргон одновременно охлаждает камеры и каналы и служит вторым экраном (~450 г/см² при полном баке). Ионные заряды (LiH с оболочками) с инжектором — 0,23 т, магазин x=−4,6."},"mass":{"mtom_t":150.4,"dry_t":72.8,"payload_t":10,"reaction_mass_t":67.4,"charges_t":0.23,"structure_tps_t":22.9,"wings_t":3.9,"gear_t":4.5,"propulsion_t":15.4,"shield_t":16.4,"systems_t":3.4,"tw_earth":1.35,"mass_table_ru":"Сухая масса 72,8 т:\n- корпус и ТЗП 22,56 т (15 % m0), плюс ТЗП гондол 0,3 т;\n- консоли 70 м² 3,61 т, элевоны 0,3 т;\n- шасси 4,51 т;\n- двигатель 15,43 т: камеры 6,81, каналы 2,6, кольца с узлами 2,25, бак и магистрали 3,77;\n- экран камер W 258 г/см², 4,55 м² — 11,72 т; желоб каналов W 3,5 см — 4,32 т; облицовка стояков и колец 0,4 т;\n- системы (фотонная авионика, СЖО на 14, криоустановка) 3,0 т;\n- резерв 10 % — 6,62 т.\nНагрузка 10 т, заряды 0,23 т, аргон 67,4 т.\nВзлётная 150,4 т, посадочная 84,5 т.\nПри χ=0,001 %: взлётная 136,4 т, сухая 64,9 т, экран 8,5 т.\nРост против прежних 114,6 т: экран теперь сплошной, без щели (+3,7 т), добавлен желоб каналов (+4,3 т), крыло увеличено, и всё это прошло через замыкание массы."},"dv_ru":"Земля→НОО 200 км: 9,3 км/с. Средняя v_e 17,4 км/с (по высоте 15→19,7). Потери: гравитационные ~1,2, аэродинамические 0,15, на управление 0,1 км/с; вращение Земли даёт −0,4 км/с.\nСближение с «Тантрой» 0,15 км/с и сход с орбиты 0,12 км/с при v_e 19,7 км/с. Висение 45 с при v_e 15 км/с: 0,44 км/с. Всего 10,0 км/с.\nОтношение масс 1,78 (ln 0,577), плюс 1,5 т резерва аргона.\nПерегрузка: на отрыве 1,35 g, в конце разгона 1,75 g (мощность струи постоянна, 14,9 ГВт). Вход в атмосферу планирующий, ~1,5 g. Гасителя инерции нет, кресла полулёжа, предел ≤3 g соблюдён.","radiation_ru":"Камеры. Синтез 25,5 ГВт, ~420 полномощных с на рейс. От центра камеры до ближнего кресла 5,0 м (было 3,6). Без экрана за рейс: 8,1·10⁴ Зв при χ=0,1 %, 810 Зв при χ=0,001 %. Для 10 мЗв нужно W 258 г/см² (13,4 см) или 188 г/см².\nЭкран сплошной: 3,5×1,3 м, x=−2,2 (1,0 м от центров камер). Щели нет, он перекрывает конус обеих камер к салону ±2,3 м (с полутенью источника r 0,3 м). Масса 11,7 / 8,5 т.\nИсточник не движется, поэтому экран годится при любых углах колец. Полный бак аргона между экраном и салоном добавляет ~450 г/см² на подъёме — это запас на неизвестный спектр χ (в расчёте не учтён).\nКаналы. Желоб W 3,5 см на 1,5 м от кресел: ~1,2 мГр при T=50 кэВ, но ≥30 Гр при T=100 кэВ.\nИтого на экипаж ≤10 мЗв при принятых допущениях.\nОпасная зона на грунте при 45 с висения, χ=0,1 % (сторона к грунту не экранирована):\n- с ослаблением в воздухе: 10 мЗв ~0,75 км, 1 мЗв ~1,1 км (рассеяние в воздухе не учтено);\n- консервативно, без воздуха: 2,9 / 4,8 км.\nПри χ=0,001 %: ~0,3 / 0,6 км. Плюс струя ~300 м. Висеть у «Тантры» и людей нельзя.","wings":{"scheme_ru":"Высокоплан на спинных пилонах. 2 поворотные консоли, 1 шарнир на консоль (вертикальная ось, x=1,0, z=±3,0, y=2,0). Стреловидность по передней кромке: 25° на взлёте и посадке, 45° в крейсере, 75° при входе в атмосферу и в ангаре. На каждой консоли элевон (+1 шарнир) для управления без тяги. При входе брюхом вперёд консоли в тени корпуса. Корпус несущий: ~110 м², CL≈0,4.","area_m2":70,"span_open_m":23,"span_stowed_m":13.5,"sweep_min_deg":25,"sweep_max_deg":75,"hinges":4,"landing_speed_ms":100},"cabin_ru":"Гермосалон 5,4×2,6×4,6 м (x 1,2…6,6) сужен до ±2,3 м и вписан в фаски корпуса. 12 кресел полулёжа, 3 ряда по 4, ряды на x 1,9 / 3,6 / 5,3.\nКокпит 2,0×2,0×3,2 м (x 6,6…8,6) на 2 кресла. Командир слева: полётный терминал на полке-пульте, контроллер двигателей под правой рукой, 3 вертикальных сенсорных дисплея (у левого локтя, между креслами, у правого локтя). Приборы фотонно-аналоговые, в 2–3 контурах, без кремния.\nКресла неподвижные. Канонный поворот на гидрошарнирах — опция, +14 шарниров.\nВосьмигранный люк 1,5 м по левому борту (x 2,0, порог y −0,55) выходит на свободный участок борта, каналы под полом его не перекрывают. Из тамбура в корме ангара проход вдоль левого борта.\nСалон служит и грузовым отсеком: кресла съёмные, 10 т груза через люк 1,5 м.\n20 мест: ещё 2 ряда по 3, салон +2,4 м по длине.","hangar":{"length_m":18.6,"width_stowed_m":13.5,"height_m":3.9,"fits":true,"growth_ru":"Не требуется. В положении stowed 18,6×13,5×3,9 м при допуске 20,2×24×5,4 м: корпус 17,6 м, концы консолей при 75° выходят на 1 м за корму. Для выхода вверх ширина 13,5 ≤16,7 м. Вариант на 20 мест длиннее на 2,4 м (21,0 м): нужно удлинить ангар на 0,8 м или в ангаре сложить консоли на 65°. Ложемент и магнитный толкатель должны держать 150 т (в прикидке 37–52 т)."},"launch_recovery_ru":"В космосе: консоли на 75°, кольца на 0°, шасси убрано. Магнитный толкатель ложемента выводит аппарат вверх через створки 16,7 м со скоростью ~2 м/с, дальше работают только аргоновые РДУ. Камеры запускаются не ближе ~5 км от «Тантры». Возврат: сближение на РДУ, захват тем же толкателем-ловителем.\nНа Земле: вертикальный старт с ВПП, Т/В 1,35, кольца 90→45→20°. Людям быть дальше 1,1 км, консервативно 2,9 км.\nПосадка: по-самолётному на 100 м/с (полоса ~3 км) или с висением 45 с. Под «Тантрой» не висеть.\nПодъём через нижние створки и платформу 9 м невозможен (150 т). Возврат на «Тантру» только через орбиту.","parts":{"cups":4,"propulsion_pivots":4,"wing_hinges":4,"other_moving":4,"total_moving":12,"list_ru":"Подвижные детали — всего 12:\n- 4 поворотных узла колец (они же вводы каналов);\n- 2 шарнира консолей и 2 элевона;\n- передняя опора (1), 2 главные опоры (2);\n- люк (1).\nБез подвижных частей: магнитная векторизация, делители потока, впрыск аргона.\nСовмещённые функции:\n- бак аргона — рабочее тело, теплоноситель и второй экран;\n- катушки каналов — силовая связь «тяга→корпус»;\n- кольцо — сопло, вектор тяги и дожигатель;\n- желоб W держит канал и экранирует его."},"pros_ru":["Источник излучения неподвижен: один сплошной экран 4,55 м² годится при любых углах колец","Бак аргона стоит у ЦМ и между камерами и кабиной: ход ЦМ ±0,18 м, на подъёме бак работает как экран","Диагональная разводка: отказ камеры не даёт моментов по тангажу и крену, Т/В 1,56","Вектор тяги управляется в 3 уровнях, быстрые без подвижных частей (10 мс); тяга идёт на уровне ЦМ","Аппарат компактный: 18,6×13,5×3,9 м, корпус 17,6 м"],"cons_ru":["Тяжёлый: 150 т против 37–52 т в прикидке","Экраны 16,4 т (камеры и каналы) — 23 % сухой массы","Тепло каналов ограничивает скорость струи 19,7 км/с (у прямых чаш 27 км/с)","Посадка без тяги на 100 м/с, нужна полоса ~3 км","Груз только через люк 1,5 м"],"risks_ru":["Пропускание каналов: если f_ch >1 %, скорость струи ≤8,6 км/с и проект не замыкается","Температура плазмы в каналах: при T≥100 кэВ желобу 3,5 см W нужна толщина ≥7 см (+4 т)","Альфа-частицы 3,5 МэВ разрушат стенку канала, если их не термализовать в камере","Спектр χ неизвестен: экран от 25 до 260 г/см² (±6 т)","Срыв поля канала даёт прорыв плазмы в корпус: нужен сброс камеры за 1 импульс (5 мс)","Излучение колец (смешение несущей плазмы с аргоном в 2 м от салона) не рассчитано, заложена облицовка 0,4 т"],"open_questions_ru":["Утвердить χ и его спектр: от этого зависит экран 8,5–11,7 т","Температура плазмы в канале (≤50 кэВ принято) и f_ch=0,2 % — спекуляция; при худших значениях лучше прямые чаши","Принимается ли взлётная масса 150 т? Иначе снизить нагрузку или вернуться к прямым чашам","20 мест: удлинить ангар на 0,8 м или складывать консоли на 65°?","Канонный поворот кресел (+14 шарниров) или неподвижные кресла","Нужен ли отдельный грузовой люк для груза крупнее 1,5 м","Рецензент предлагал 2 бака с
