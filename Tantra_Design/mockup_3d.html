<!doctype html><html><head><meta charset="utf-8"><style>body{background:#fff;font-family:system-ui;margin:16px}:root{--border:#ccc;--border-accent:#3b6fd6;--radius:8px;--text-primary:#111;--text-secondary:#555}.sr-only{position:absolute;left:-9999px}</style></head><body><h2 class="sr-only">Вращаемые 3D-макеты Тантры, варианты «Рыба» и «Копьё», с шасси на стоянке и режимом рентгена для систем.</h2>
<div style="padding:1rem 0">
<div style="position:relative;border-radius:12px;overflow:hidden;background:#07080b">
  <div id="c3" style="width:100%;height:560px"></div>
  <div id="lg" style="position:absolute;left:10px;top:10px;font:12px system-ui,sans-serif;color:#e4e0da;background:rgba(0,0,0,.5);padding:8px 10px;border-radius:8px;line-height:1.55;display:none"></div>
  <div id="err" style="position:absolute;left:10px;bottom:10px;font:12px system-ui;color:#f99"></div>
</div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
  <button class="b on" data-m="A">1 · «Рыба»</button>
  <button class="b" data-m="B">2 · «Копьё»</button>
  <button class="b" id="xr">Системы (рентген)</button>
  <button class="b" id="ar">Остановить вращение</button>
</div>
<div style="font-size:13px;color:var(--text-secondary);margin-top:8px">Мышь: вращать · колесо: масштаб · правая кнопка: сдвиг. Ось корабля 20 м над грунтом, клетка сетки 10 м.</div>
</div>
<style>.b{font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border);background:transparent;color:var(--text-primary);cursor:pointer}.b.on{border:2px solid var(--border-accent);padding:5px 11px}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
try{
const el=document.getElementById('c3');
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));el.appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07080b);
const cam=new THREE.PerspectiveCamera(35,1,1,4000);cam.position.set(150,55,175);
const ctl=new THREE.OrbitControls(cam,R.domElement);ctl.target.set(58,-2,0);ctl.enableDamping=true;ctl.autoRotate=true;ctl.autoRotateSpeed=0.7;
scene.add(new THREE.HemisphereLight(0xc8d2e6,0x2a1d17,0.75));
const d1=new THREE.DirectionalLight(0xffffff,0.95);d1.position.set(120,200,150);scene.add(d1);
const d2=new THREE.DirectionalLight(0x8090b0,0.35);d2.position.set(-150,40,-120);scene.add(d2);
function resize(){const w=Math.max(1,el.clientWidth),h=Math.max(1,el.clientHeight);R.setSize(w,h,false);R.domElement.style.width='100%';R.domElement.style.height='100%';cam.aspect=w/h;cam.updateProjectionMatrix();}
resize();if(window.ResizeObserver)new ResizeObserver(resize).observe(el);window.addEventListener('resize',resize);
// ground
const GY=-20;
const g=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x1b140f,roughness:1}));g.rotation.x=-Math.PI/2;g.position.y=GY;scene.add(g);
const grid=new THREE.GridHelper(400,40,0x3a2c22,0x2a2019);grid.position.y=GY+0.05;scene.add(grid);
// materials
const hullM=()=>new THREE.MeshStandardMaterial({color:0x5c616c,metalness:0.55,roughness:0.42,side:THREE.DoubleSide,transparent:true});
const shieldM=()=>new THREE.MeshStandardMaterial({color:0xa39478,metalness:0.9,roughness:0.22,side:THREE.DoubleSide,transparent:true});
const crestM=()=>new THREE.MeshStandardMaterial({color:0x7a3f2a,metalness:0.3,roughness:0.6,side:THREE.DoubleSide,transparent:true});
const cupM=new THREE.MeshStandardMaterial({color:0x9a90e8,emissive:0x281e66,metalness:0.85,roughness:0.2,side:THREE.DoubleSide});
const legM=new THREE.MeshStandardMaterial({color:0x9aa0a8,metalness:0.7,roughness:0.35});
const cylM=new THREE.MeshStandardMaterial({color:0xc9b27a,metalness:0.6,roughness:0.35});
const sysM=(c)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0.35,metalness:0.2,roughness:0.5});
const SYS=[['Гермомодули, анабиоз, библиотека',0x4f8fd6],['Центральный пост',0x6fd6e0],['Ловушки анамезона 30 Тл',0x8f6ff0],['Анамезонные камеры (нитрид бора)',0xeeeeee],['ВЭУ (реактор)',0xe0703a],['Накопитель поля камер',0x4fc97a],['Ионные заряды',0xe0a83a],['Гидроаккумуляторы и насосы',0xe8d45a],['Ангар: тележки, робот, станции',0x8a8f99]];
const sm={};SYS.forEach(([n,c])=>sm[n]=sysM(c));
// helpers
const lerp=(a,b,t)=>a+(b-a)*t;
function sample(keys,s){if(s<=keys[0][0])return keys[0].slice(1);for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(s<=b[0]){let t=(s-a[0])/(b[0]-a[0]);t=t*t*(3-2*t);return a.slice(1).map((v,k)=>lerp(v,b[k+1],t));}}return keys[keys.length-1].slice(1);}
function loft(keys,s0,s1,n,seg,pt,pb,pz,mat,cap0){
  const pos=[],idx=[];for(let i=0;i<=n;i++){const s=lerp(s0,s1,i/n);const [w,t,b]=sample(keys,s);
    for(let j=0;j<=seg;j++){const th=2*Math.PI*j/seg,c=Math.cos(th),sn=Math.sin(th);
      const y=sn>=0?t*Math.pow(sn,pt):-Math.abs(b)*Math.pow(-sn,pb);const z=w*Math.sign(c)*Math.pow(Math.abs(c),pz);pos.push(s,y,z);}}
  for(let i=0;i<n;i++)for(let j=0;j<seg;j++){const a=i*(seg+1)+j,b=a+seg+1;idx.push(a,b,a+1,b,b+1,a+1);}
  if(cap0){const ci=pos.length/3;const [w,t,b]=sample(keys,s0);pos.push(s0,(t-Math.abs(b))/2,0);for(let j=0;j<seg;j++)idx.push(ci,j+1,j);}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setIndex(idx);geo.computeVertexNormals();return new THREE.Mesh(geo,mat);}
function extrudeSY(pts,depth,mat,zc){const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));const geo=new THREE.ExtrudeGeometry(sh,{depth:depth,bevelEnabled:false});geo.translate(0,0,-depth/2+(zc||0));return new THREE.Mesh(geo,mat);}
function finSZ(pts,th,y,mat){const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));const geo=new THREE.ExtrudeGeometry(sh,{depth:th,bevelEnabled:false});geo.rotateX(Math.PI/2);geo.translate(0,y+th/2,0);return new THREE.Mesh(geo,mat);}
function cylBetween(a,b,r,mat){const va=new THREE.Vector3(...a),vb=new THREE.Vector3(...b),d=vb.clone().sub(va),L=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,14),mat);m.position.copy(va.clone().add(vb).multiplyScalar(0.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m;}
function cylX(s0,s1,y,z,r,mat){return cylBetween([s0,y,z],[s1,y,z],r,mat);}
function cup(r,x,y,z,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,10,0,Math.PI*2,0,0.95),mat);m.rotation.z=-Math.PI/2;m.position.set(x,y,z);return m;}
function sphere(r,x,y,z,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),mat);m.position.set(x,y,z);return m;}
function box(s0,s1,y0,y1,z0,z1,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(s1-s0,y1-y0,z1-z0),mat);m.position.set((s0+s1)/2,(y0+y1)/2,(z0+z1)/2);return m;}
const L1=26,L2=26;
function knee(H,P){const h=new THREE.Vector3(...H),p=new THREE.Vector3(...P),dv=p.clone().sub(h),d=Math.min(dv.length(),L1+L2-0.01),u=dv.clone().normalize();
  const a=(L1*L1-L2*L2+d*d)/(2*d),hh=Math.sqrt(Math.max(0,L1*L1-a*a));const up=new THREE.Vector3(0,1,0);const n=up.clone().sub(u.clone().multiplyScalar(up.dot(u))).normalize();
  const k=h.clone().add(u.clone().multiplyScalar(a)).add(n.multiplyScalar(hh));return [k.x,k.y,k.z];}
function legAft(grp,H,P,folded){if(folded)P=[-3,H[1]+1.5*Math.sign(H[1]),H[2]*1.15];const K=folded?[13,H[1]+4.5*Math.sign(H[1]),H[2]*1.32]:knee(H,P);
  grp.add(cylBetween(H,K,2.3,legM));grp.add(cylBetween(K,P,1.8,legM));
  const a=H.map((v,i)=>lerp(v,K[i],0.2)),b=K.map((v,i)=>lerp(v,P[i],0.45));grp.add(cylBetween(a,b,1.0,cylM));
  const a2=H.map((v,i)=>lerp(v,K[i],0.55)),b2=K.map((v,i)=>lerp(v,P[i],0.25));grp.add(cylBetween(a2,b2,0.7,cylM));
  grp.add(sphere(3.0,...H,legM));grp.add(sphere(2.8,...K,legM));
  if(!folded){const pad=new THREE.Mesh(new THREE.CylinderGeometry(5,5.4,0.8,28),legM);pad.position.set(P[0],GY+0.4,P[2]);grp.add(pad);grp.add(cylBetween(P,[P[0],GY+0.8,P[2]],1.0,legM));}}
function foreStrut(grp,s,ytop,z){grp.add(cylBetween([s,ytop,z],[s,GY+0.8,z],0.9,legM));grp.add(cylBetween([s,ytop-1,z],[s,ytop-6,z],1.3,cylM));const pad=new THREE.Mesh(new THREE.CylinderGeometry(3.75,4,0.7,24),legM);pad.position.set(s,GY+0.35,z);grp.add(pad);}
function lift(grp,s,ytop,z){grp.add(cylBetween([s,ytop,z],[s,GY+1,z],0.12,cylM));grp.add(box(s-1.5,s+1.5,GY,GY+0.4,z-1.5,z+1.5,cylM));}
const models={};const skin=[];
// ================= A: «Рыба» =================
(function(){const G=new THREE.Group(),S=new THREE.Group();
  const keys=[[0,11,8,-5],[6,13,10.5,-6.5],[20,14.5,14,-8],[45,15,15,-8],[65,13.5,13,-8],[85,10.5,10,-8],[100,8,7,-7],[112,5,4.2,-4.5],[120,2.6,2.2,-2.4],[126,0.2,0.2,-0.2]];
  const hm=hullM(),shm=shieldM(),cm=crestM();skin.push(hm,shm,cm);
  G.add(loft(keys,0,113,90,48,0.9,0.3,0.7,hm,true));
  G.add(loft(keys.map(k=>[k[0],k[1]*1.02,k[2]*1.02,k[3]*1.02]),112,126,20,48,0.9,0.3,0.7,shm,false));
  G.add(box(9,62,-14.5,-7.5,-11,11,hm));
  G.add(extrudeSY([[8,10.5],[16,34],[30,34],[50,14.8]],1.2,cm));
  G.add(finSZ([[6,13],[44,13],[26,27],[10,27]],0.8,-2,cm));G.add(finSZ([[6,-13],[44,-13],[26,-27],[10,-27]],0.8,-2,cm));
  [[5.3,4.5],[5.3,-4.5],[-2.3,4.5],[-2.3,-4.5]].forEach(([y,z])=>G.add(cup(3.6,-0.5,y,z,cupM)));
  for(let i=0;i<12;i++){const a=2*Math.PI*i/12;G.add(cup(1.5,0.3,1.5+5.8*Math.sin(a),9.6*Math.cos(a),cupM));}
  legAft(G,[32,-7,10],[-10,GY,19],false);legAft(G,[32,-7,-10],[-10,GY,-19],false);
  legAft(G,[30,9,9],[0,0,0],true);legAft(G,[30,9,-9],[0,0,0],true);
  foreStrut(G,98,-6.5,4);foreStrut(G,98,-6.5,-4);lift(G,80,-7,-9);
  // systems
  S.add(cylX(66,84,1,0,4.5,sm['Гермомодули, анабиоз, библиотека']));S.add(cylX(86,100,1,0,4.0,sm['Гермомодули, анабиоз, библиотека']));
  S.add(sphere(3,106,1,0,sm['Центральный пост']));
  [[11,36,5.5],[11,36,-5.5],[37,62,5.5],[37,62,-5.5]].forEach(([a,b,z])=>S.add(cylX(a,b,-9,z,4.9,sm['Ловушки анамезона 30 Тл'])));
  [[5.3,4.5],[5.3,-4.5],[-2.3,4.5],[-2.3,-4.5]].forEach(([y,z])=>S.add(cylX(1.5,20,y,z,2.4,sm['Анамезонные камеры (нитрид бора)'])));
  S.add(sphere(3.6,54,6,0,sm['ВЭУ (реактор)']));
  const tor=new THREE.Mesh(new THREE.TorusGeometry(4.2,0.9,12,32),sm['Накопитель поля камер']);tor.rotation.y=Math.PI/2;tor.position.set(26,6,0);S.add(tor);
  for(let i=0;i<5;i++)for(let j=0;j<3;j++)S.add(cylX(40+i*4,43.5+i*4,8+j*2.2,-6+j*6,0.9,sm['Ионные заряды']));
  [[30,-4,9],[30,-4,-9],[34,-4,9],[34,-4,-9]].forEach(p=>S.add(sphere(1.5,...p,sm['Гидроаккумуляторы и насосы'])));
  S.add(box(68,79,-7,-2,-5,5,sm['Ангар: тележки, робот, станции']));
  S.visible=false;G.add(S);models.A={G,S};scene.add(G);})();
// ================= B: «Копьё» =================
(function(){const G=new THREE.Group(),S=new THREE.Group();
  const aft=[[0,12,13,-9],[8,13,14,-9.5],[40,13,14,-9.5],[52,10,11,-8],[57,6,6,-6]];
  const neck=[[56,6,6,-6],[62,5.5,5.5,-5.5],[72,5.5,5.5,-5.5],[77,7.5,7.5,-7.5]];
  const fore=[[76,7.5,7.5,-7.5],[90,8.6,8.6,-8.6],[104,7.6,7.6,-7.6],[116,4.5,4.5,-4.5],[126,0.2,0.2,-0.2]];
  const hm=hullM(),shm=shieldM(),cm=crestM();skin.push(hm,shm,cm);
  G.add(loft(aft,0,57,24,8,1,1,1,hm,true));G.add(loft(neck,56,77,12,32,1,1,1,hm,false));G.add(loft(fore,76,126,40,48,1,1,1,shm,false));
  G.add(extrudeSY([[10,13],[18,36],[32,36],[46,13.5]],1.2,cm));
  G.add(finSZ([[8,12.5],[40,12.5],[24,26],[12,26]],0.8,-1,cm));G.add(finSZ([[8,-12.5],[40,-12.5],[24,-26],[12,-26]],0.8,-1,cm));
  [[7.5,5.5],[7.5,-5.5],[-3.5,5.5],[-3.5,-5.5]].forEach(([y,z])=>{G.add(cylBetween([0,y,z],[-8,y,z],0.9,legM));G.add(cup(4.6,-8.5,y,z,cupM));});
  for(let i=0;i<12;i++){const a=2*Math.PI*i/12,y=2+11*Math.sin(a),z=12*Math.cos(a);G.add(cylBetween([0,y,z],[-3,y,z],0.5,legM));G.add(cup(1.9,-3.3,y,z,cupM));}
  for(let i=0;i<8;i++){const a=2*Math.PI*i/8;G.add(cylX(58,72,6.6*Math.sin(a),6.6*Math.cos(a),0.9,sm['Ионные заряды']));}
  legAft(G,[30,-9,10],[-10,GY,19],false);legAft(G,[30,-9,-10],[-10,GY,-19],false);
  legAft(G,[28,11,9],[0,0,0],true);legAft(G,[28,11,-9],[0,0,0],true);
  foreStrut(G,100,-7.5,4);foreStrut(G,100,-7.5,-4);lift(G,86,-7,-8);
  S.add(cylX(80,96,0,0,5,sm['Гермомодули, анабиоз, библиотека']));S.add(cylX(98,110,0,0,4.5,sm['Гермомодули, анабиоз, библиотека']));
  S.add(sphere(3,114,0,0,sm['Центральный пост']));
  [[-3.5,5.5],[-3.5,-5.5],[7,5.5],[7,-5.5]].forEach(([y,z])=>S.add(cylX(24,49,y,z,4.9,sm['Ловушки анамезона 30 Тл'])));
  [[7.5,5.5],[7.5,-5.5],[-3.5,5.5],[-3.5,-5.5]].forEach(([y,z])=>S.add(cylX(1.5,21,y,z,2.4,sm['Анамезонные камеры (нитрид бора)'])));
  S.add(sphere(3.4,53,0,0,sm['ВЭУ (реактор)']));
  const tor=new THREE.Mesh(new THREE.TorusGeometry(3.6,0.8,12,32),sm['Накопитель поля камер']);tor.rotation.y=Math.PI/2;tor.position.set(22,2,0);S.add(tor);
  [[28,-8,9],[28,-8,-9],[32,-8,9],[32,-8,-9]].forEach(p=>S.add(sphere(1.5,...p,sm['Гидроаккумуляторы и насосы'])));
  S.add(box(78,88,-7,-2.5,-4,4,sm['Ангар: тележки, робот, станции']));
  S.visible=false;G.add(S);G.visible=false;models.B={G,S};scene.add(G);})();
// UI
let cur='A',xray=false;
const lg=document.getElementById('lg');lg.innerHTML=SYS.map(([n,c])=>'<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:#'+c.toString(16).padStart(6,'0')+'"></span>'+n+'</div>').join('');
function apply(){for(const k in models){models[k].G.visible=(k===cur);models[k].S.visible=xray;}
  skin.forEach(m=>{m.opacity=xray?0.13:1;m.depthWrite=!xray;m.needsUpdate=true;});lg.style.display=xray?'block':'none';}
document.querySelectorAll('.b[data-m]').forEach(b=>b.onclick=()=>{cur=b.dataset.m;document.querySelectorAll('.b[data-m]').forEach(x=>x.classList.toggle('on',x===b));apply();});
const xb=document.getElementById('xr');xb.onclick=()=>{xray=!xray;xb.classList.toggle('on',xray);apply();};
const ab=document.getElementById('ar');ab.onclick=()=>{ctl.autoRotate=!ctl.autoRotate;ab.textContent=ctl.autoRotate?'Остановить вращение':'Вращать';};
apply();
(function loop(){ctl.update();R.render(scene,cam);requestAnimationFrame(loop);})();
}catch(e){document.getElementById('err').textContent='Ошибка: '+e.message;}
})();
</script>
</body></html>
