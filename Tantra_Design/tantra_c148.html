function makeSections(v){const K=v.keys,NB=K[K.length-1][0];
  const base=resample(polyOf(K[K.length-1][1]),NS);const yMin=Math.min(...base.map(p=>p[1])),yMax=Math.max(...base.map(p=>p[1])),Y0=(yMin+yMax)/2,RN=(yMax-yMin)/2;
  const NL=L_SHIP-NB,RHO=(RN*RN+NL*NL)/(2*RN),rn=1.8,XS=NL-Math.sqrt((RHO-rn)**2-(RHO-RN)**2),XT=XS-rn*(NL-XS)/(RHO-rn),TIP=XS-rn;

  const at=s=>{if(s<=NB){for(let i=0;i<K.length-1;i++){const[a,pa]=K[i],[b,pb]=K[i+1];if(s<=b)return resample(polyOf(lerpP(pa,pb,sm5((s-a)/(b-a)))),NS);}}

  return {at,st,tip:[L_SHIP-TIP,Y0]};}
